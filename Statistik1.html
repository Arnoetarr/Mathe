:root{
  --akzent:#1F6F8B; --akzenthell:#E8F2F5; --warm:#E8833A; --warmhell:#FDF0E6;
  --gruen:#2E8B57; --gruenhell:#E6F4EC; --gruentext:#1E6B3A;
  --grau:#666; --linie:#d5dee2; --text:#1d2a30; --bg:#f6f8f9; --weiss:#fff;
  --d1:#1F6F8B; --d2:#E8833A; --d3:#8DB600; --d4:#F2C14E; --d5:#9B5DE5;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Andika,"Andika New Basic",system-ui,sans-serif;font-size:18px;line-height:1.5;color:var(--text);background:var(--bg)}
button,input,select{font:inherit}
.hidden{display:none!important}

/* Kopfzeile */
header.top{position:sticky;top:0;z-index:20;background:var(--weiss);border-bottom:3px solid var(--akzent);
  display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
header.top .titel{font-weight:700;color:var(--akzent);font-size:20px;cursor:pointer}
header.top .wer{color:var(--grau);font-size:16px}
header.top .platz{flex:1}
.knopf{border:2px solid var(--akzent);background:var(--weiss);color:var(--akzent);border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:700}
.knopf:hover{background:var(--akzenthell)}
.knopf.voll{background:var(--akzent);color:#fff}
.knopf.voll:hover{background:#185a71}
.knopf.warm{border-color:var(--warm);color:var(--warm)}
.knopf.warm.voll{background:var(--warm);color:#fff}
.knopf.gruen{border-color:var(--gruen);color:var(--gruen)}
.knopf.gruen.voll{background:var(--gruen);color:#fff}
.knopf:disabled{opacity:.45;cursor:default}
.knopf.klein{padding:4px 10px;font-size:15px}
#speichern.ungespeichert{border-color:var(--warm);color:#fff;background:var(--warm)}
#speichern.ungespeichert::after{content:" •"}

main{max-width:960px;margin:0 auto;padding:20px 16px 120px}

/* Start */
.startbox{max-width:560px;margin:40px auto;background:var(--weiss);border-radius:16px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.startbox h1{margin:0 0 4px;color:var(--akzent);font-size:34px}
.startbox p.unter{margin:0 0 20px;color:var(--grau)}
.feld{display:block;margin:14px 0}
.feld span{display:block;font-weight:700;margin-bottom:4px}
.feld input{width:100%;padding:10px 12px;border:2px solid var(--linie);border-radius:10px}
.feld input:focus{outline:none;border-color:var(--akzent)}
.trenn{display:flex;align-items:center;gap:10px;color:var(--grau);margin:22px 0}
.trenn::before,.trenn::after{content:"";flex:1;height:1px;background:var(--linie)}
.meldung{padding:10px 14px;border-radius:10px;margin:12px 0}
.meldung.fehler{background:var(--warmhell);color:#8a4210}
.meldung.ok{background:var(--gruenhell);color:var(--gruentext)}

/* Themenkarte */
.gruss{font-size:26px;font-weight:700;color:var(--akzent);margin:6px 0 2px}
.gruppe{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.gruppe h2{margin:0;font-size:20px}
.gruppe .streifen{width:10px;height:26px;border-radius:3px;background:var(--akzent)}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.kachel{position:relative;background:var(--weiss);border:2px solid var(--linie);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;text-align:left;cursor:pointer;color:inherit;width:100%}
.kachel:hover:not(.zu){border-color:var(--akzent)}
.kachel.zu{cursor:default;opacity:.55}
.kachel .nr{flex:none;min-width:48px;height:40px;padding:0 6px;background:var(--akzent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:16px}
.kachel.analog .nr{background:var(--grau)}
.kachel .txt{font-weight:700;line-height:1.3}
.kachel .klein{display:block;font-weight:400;color:var(--grau);font-size:14px;margin-top:2px}
.kachel.fertig{border-color:var(--gruen);background:var(--gruenhell)}
.kachel.fertig .nr{background:var(--gruen)}
.haken{position:absolute;top:4px;right:8px;color:var(--gruen);font-size:22px;font-weight:700}

/* Kapitel */
.kapitelkopf{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.badge{flex:none;width:58px;height:58px;background:var(--akzent);color:#fff;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.kapitelkopf .thema{color:var(--grau);font-size:15px}
.kapitelkopf h1{margin:0;font-size:26px;line-height:1.2}
.punkte{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.punkt{width:30px;height:8px;border-radius:4px;background:var(--linie);border:none;padding:0;cursor:pointer}
.punkt.besucht{background:#9cc3d1}
.punkt.erledigt{background:var(--gruen)}
.punkt.aktiv{outline:3px solid var(--warm);outline-offset:2px}
.karte{background:var(--weiss);border-radius:16px;padding:22px 24px;box-shadow:0 2px 12px rgba(0,0,0,.06);min-height:320px;animation:rein .25s ease}
@keyframes rein{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.karte h2{margin:0 0 4px;font-size:24px}
.kicker{text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--grau)}
.quelle{font-size:13px;color:var(--grau);margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--weiss);border-top:1px solid var(--linie);padding:10px 16px;display:flex;gap:10px;justify-content:center;z-index:15}
.nav .knopf{min-width:140px}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:720px){.zwei{grid-template-columns:1fr}}

/* Merke */
.merke{border-left:10px solid var(--akzent);background:var(--akzenthell);padding:14px 18px;border-radius:0 12px 12px 0}
.merke h2{color:var(--akzent)}
.merke table{width:100%;border-collapse:collapse;margin-top:8px}
.merke th{text-align:left;color:var(--akzent);font-size:15px;border-bottom:1px solid #b9cfd7;padding:6px 8px}
.merke td{vertical-align:top;padding:10px 8px;border-bottom:1px solid #b9cfd7}
.merke tr:last-child td{border-bottom:none}
.merke td:first-child{width:60%}
.hefterhinweis{margin-top:12px;font-size:15px;color:var(--akzent)}

/* Aufgaben */
.aufgabenkopf{display:flex;align-items:center;gap:10px;background:var(--akzenthell);margin:-22px -24px 16px;padding:12px 24px;border-radius:16px 16px 0 0}
.aufgabenkopf b{font-size:21px}
.stufe{margin-left:auto;font-size:15px;color:var(--grau)}
.teil{border-top:1px solid var(--linie);padding:14px 0}
.teil:first-of-type{border-top:none}
.frage{margin-bottom:8px}
.eingabe{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eingabe input{width:140px;padding:8px 10px;border:2px solid var(--linie);border-radius:10px;font-size:20px}
.eingabe input:focus{outline:none;border-color:var(--akzent)}
.eingabe .einheit{color:var(--grau)}
.teil.richtig input{border-color:var(--gruen);background:var(--gruenhell)}
.rueck{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:16px}
.rueck.gut{background:var(--gruenhell);color:var(--gruentext)}
.rueck.nochnicht{background:var(--warmhell);color:#8a4210}
.tipp{margin-top:8px;padding:8px 12px;border-radius:10px;background:#fff8e1;border:1px dashed var(--d4);font-size:16px}
.loesungzeigen{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--gruenhell);color:var(--gruentext);font-size:16px}
.links{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.linkknopf{background:none;border:none;color:var(--akzent);text-decoration:underline;cursor:pointer;padding:0;font-size:16px}
.wahl{display:flex;flex-direction:column;gap:8px}
.wahl button,.chips button{text-align:left;border:2px solid var(--linie);background:var(--weiss);border-radius:10px;padding:8px 12px;cursor:pointer}
.wahl button:hover,.chips button:hover{border-color:var(--akzent)}
.wahl button.gewaehlt,.chips button.gewaehlt{border-color:var(--akzent);background:var(--akzenthell)}
.wahl button.ist-richtig,.chips button.ist-richtig{border-color:var(--gruen);background:var(--gruenhell)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
table.daten{border-collapse:collapse;margin:6px 0 10px}
table.daten td,table.daten th{border:1px solid #9fb3bb;padding:4px 10px;text-align:center}
table.daten th{background:var(--akzenthell)}

/* Entdecken */
.entdecken svg{touch-action:none;user-select:none;max-width:100%}
.eimer{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--akzent);margin:6px 0}
.pfeile{display:flex;justify-content:space-around;max-width:520px}
.pfeile div{display:flex;gap:4px}
.pfeile button{width:40px;height:36px;border:2px solid var(--linie);border-radius:8px;background:var(--weiss);cursor:pointer;font-size:16px}
.pfeile button:hover{border-color:var(--akzent)}

/* Heft */
.heftaufgabe{border:2px solid var(--linie);border-radius:12px;padding:12px 16px;margin:12px 0}
.heftaufgabe label{display:flex;gap:10px;align-items:center;font-weight:700;margin-top:8px;cursor:pointer}
.heftaufgabe input[type=checkbox]{width:24px;height:24px}

.fertigbild{text-align:center;padding:30px 10px}
.fertigbild .gross{font-size:64px;color:var(--gruen)}
.ladehinweis{font-size:15px;color:var(--grau)}
</style>
</head>
<body>

<header class="top hidden" id="kopf">
  <span class="titel" id="zurStart" title="Zur Themenkarte">Statistik 7/8</span>
  <span class="wer" id="wer"></span>
  <span class="platz"></span>
  <button class="knopf" id="speichern" title="Spielstand als Datei speichern">Speichern</button>
  <button class="knopf" id="abmelden" title="Andere Person">Wechseln</button>
</header>

<main id="app"></main>
<nav class="nav hidden" id="nav">
  <button class="knopf" id="zurueck">← Zurück</button>
  <button class="knopf voll" id="weiter">Weiter →</button>
</nav>
<input type="file" id="dateiwahl" accept=".statistik" class="hidden">

<script>
"use strict";
/* =========================================================
   Einstellungen
   ========================================================= */
const KURS = "statistik78";
const KURSNAME = "Statistik 7/8";
const SPEICHERKEY = "lernpfad-" + KURS;
const SCHLUESSEL = "Freiarbeit-Statistik-Halle-2026";

/* =========================================================
   Themenkarte (wie Übersicht im Druck)
   ========================================================= */
const GRUPPEN = [
  {titel:"Brüche und Prozent", farbe:"#5f9fb5", kapitel:[
    {id:"eingang", nr:"E1–E2", titel:"Eingangschecks"},
    {id:"bruch", nr:"1–2", titel:"Bruch, Dezimalzahl, Prozent"},
    {id:"prozent", nr:"3–4", titel:"Prozentwert, Grundwert, Prozentsatz"}]},
  {titel:"Diagramme", farbe:"#1F6F8B", kapitel:[
    {id:"saeulen", nr:"5–6", titel:"Säulen- und Balkendiagramme"},
    {id:"linien", nr:"7–8", titel:"Liniendiagramme"},
    {id:"streifen", nr:"9–10", titel:"Streifendiagramme"},
    {id:"kreis", nr:"11–12", titel:"Kreisdiagramme"},
    {id:"passend", nr:"13–14", titel:"Das passende Diagramm wählen"},
    {id:"irrefuehrend", nr:"15–16", titel:"Irreführende Diagramme"}]},
  {titel:"Häufigkeiten", farbe:"#5f9fb5", kapitel:[
    {id:"haeufigkeit", nr:"17–18", titel:"Absolute und relative Häufigkeit"},
    {id:"vergleichen", nr:"19–20", titel:"Absolut oder relativ vergleichen"},
    {id:"td1", nr:"TD 1", titel:"Teste dich 1", analog:true}]},
  {titel:"Kennwerte", farbe:"#1F6F8B", kapitel:[
    {id:"extremwerte", nr:"21–22", titel:"Minimum, Maximum, Spannweite"},
    {id:"mittelwert", nr:"23–24", titel:"Das arithmetische Mittel berechnen"},
    {id:"median", nr:"25–26", titel:"Den Median bestimmen"},
    {id:"mittelodermedian", nr:"27–28", titel:"Arithmetisches Mittel oder Median?"}]},
  {titel:"Am Computer", farbe:"#5f9fb5", kapitel:[
    {id:"computerdiagramme", nr:"29–30", titel:"Tabellen und Diagramme erstellen"},
    {id:"computerkennwerte", nr:"31–32", titel:"Statistische Kennwerte berechnen"},
    {id:"td2", nr:"TD 2", titel:"Teste dich 2", analog:true}]},
  {titel:"Expert*innen", farbe:"#1F6F8B", kapitel:[
    {id:"x1", nr:"X1", titel:"Strom-Check: Zwei Schlagzeilen"},
    {id:"x2", nr:"X2", titel:"Klima-Detektive"},
    {id:"x3", nr:"X3", titel:"Das Notenspiegel-Rätsel"}]}
];

/* =========================================================
   Spielstand
   ========================================================= */
let S = null;          // aktueller Spielstand
let ungespeichert = false;

function jetzt(){ return new Date().toISOString(); }
function neuerStand(vorname, gruppe){
  return {kurs:KURS, version:1, vorname, gruppe, angelegt:jetzt(), zuletzt:jetzt(),
    gespeichert:[], ort:null, karten:{}, uebungen:{}, heft:{}, kapitel:{}};
}
function merke(){ // lokal sichern + als ungespeichert markieren
  S.zuletzt = jetzt();
  ungespeichert = true;
  try{ localStorage.setItem(SPEICHERKEY, JSON.stringify(S)); }catch(e){}
  zeigeSpeicherStatus();
}
function zeigeSpeicherStatus(){
  const k = document.getElementById("speichern");
  k.classList.toggle("ungespeichert", ungespeichert);
  k.title = ungespeichert ? "Es gibt Neues. Bitte speichern." : "Spielstand ist gespeichert.";
}
function ladeLokal(){
  try{ const t = localStorage.getItem(SPEICHERKEY); if(t){ const o = JSON.parse(t); if(o && o.kurs===KURS) return o; } }catch(e){}
  return null;
}

/* ---- Verschlüsselung (einfach, damit die Datei nicht im Editor lesbar ist) ---- */
function pruefsumme(txt){ let h = 0x811c9dc5; const s = SCHLUESSEL + txt;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8,"0"); }
function verschluesseln(obj){
  const txt = JSON.stringify(obj);
  const b = new TextEncoder().encode(txt), k = new TextEncoder().encode(SCHLUESSEL);
  let bin = "";
  for(let i=0;i<b.length;i++){ bin += String.fromCharCode(b[i] ^ k[i % k.length] ^ ((i*31) & 255)); }
  return "STAT1:" + pruefsumme(txt) + ":" + btoa(bin);
}
function entschluesseln(inhalt){
  const t = inhalt.trim().split(":");
  if(t.length !== 3 || t[0] !== "STAT1") throw new Error("Das ist keine Spielstand-Datei.");
  const bin = atob(t[2]), k = new TextEncoder().encode(SCHLUESSEL);
  const b = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++){ b[i] = bin.charCodeAt(i) ^ k[i % k.length] ^ ((i*31) & 255); }
  const txt = new TextDecoder().decode(b);
  const obj = JSON.parse(txt);
  obj._veraendert = (pruefsumme(txt) !== t[1]);
  return obj;
}
function dateiname(){
  const sauber = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"");
  return `Statistik78_${sauber(S.vorname)}_${sauber(S.gruppe)}.statistik`;
}
function speichereDatei(){
  S.gespeichert.push(jetzt());
  const blob = new Blob([verschluesseln(S)], {type:"application/octet-stream"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = dateiname();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  ungespeichert = false;
  try{ localStorage.setItem(SPEICHERKEY, JSON.stringify(S)); }catch(e){}
  zeigeSpeicherStatus();
  hinweis(`Gespeichert als <b>${dateiname()}</b>. Lege die Datei in deinen Ordner auf dem Server.`);
}
function hinweis(html){
  let h = document.getElementById("toast");
  if(!h){ h = document.createElement("div"); h.id="toast";
    h.style.cssText="position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1d2a30;color:#fff;padding:12px 18px;border-radius:12px;z-index:50;max-width:92vw;font-size:16px;box-shadow:0 4px 16px rgba(0,0,0,.2)";
    document.body.appendChild(h); }
  h.innerHTML = html; h.style.display="block";
  clearTimeout(h._t); h._t = setTimeout(()=>h.style.display="none", 6000);
}
window.addEventListener("beforeunload", e => { if(S && ungespeichert){ e.preventDefault(); e.returnValue=""; } });

/* ---- Protokoll für die Lehrkraft ---- */
function kartenProtokoll(nr){
  if(!S.karten[nr]) S.karten[nr] = {geoeffnet:jetzt(), erledigt:null};
}
function uebung(id, info){
  if(!S.uebungen[id]) S.uebungen[id] = {karte:info.karte, titel:info.titel, versuche:0, falsch:[], tipp:false, loesungGezeigt:false,
     ersterVersuchRichtig:null, begonnen:jetzt(), geloest:null};
  return S.uebungen[id];
}

/* =========================================================
   Hilfsfunktionen
   ========================================================= */
const $ = (sel, el=document) => el.querySelector(sel);
function el(tag, attrs={}, ...kinder){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") e.className = v; else if(k==="html") e.innerHTML = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for(const k of kinder.flat()){ if(k==null) continue; e.append(k.nodeType ? k : document.createTextNode(k)); }
  return e;
}
function zahl(txt){
  if(txt==null) return NaN;
  let t = String(txt).trim().replace(/\s/g,"").replace(/[a-zA-ZäöüÄÖÜß°%€]+$/,"");
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g,"");
  t = t.replace(",", ".");
  if(!/^-?\d*\.?\d+$/.test(t)) return NaN;
  return parseFloat(t);
}
const fmt = x => String(Math.round(x*100)/100).replace(".", ",");
function datumText(iso){ if(!iso) return "–"; const d = new Date(iso);
  return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}); }

/* =========================================================
   Startbildschirm
   ========================================================= */
function zeigeStart(){
  $("#kopf").classList.add("hidden"); $("#nav").classList.add("hidden");
  const app = $("#app"); app.innerHTML = "";
  const lokal = ladeLokal();
  const box = el("div",{class:"startbox"},
    el("h1",{}, "Statistik"),
    el("p",{class:"unter"}, "Lernpfad für Klasse 7/8 · Daten lesen, darstellen und auswerten"));
  if(lokal){
    box.append(el("button",{class:"knopf voll", style:"width:100%;padding:14px", onclick:()=>{ S = lokal; ungespeichert = false; zeigeThemen(); }},
      `Weiter als ${lokal.vorname} (${lokal.gruppe})`));
    box.append(el("div",{class:"trenn"},"oder"));
  }
  const vn = el("input",{type:"text", autocomplete:"off", placeholder:"z. B. Mia", maxlength:"30"});
  const gr = el("input",{type:"text", autocomplete:"off", placeholder:"z. B. 7b", maxlength:"20"});
  const fehler = el("div",{class:"meldung fehler hidden"});
  box.append(
    el("h2",{style:"margin:0;font-size:20px"}, "Neu anfangen"),
    el("label",{class:"feld"}, el("span",{},"Vorname"), vn),
    el("label",{class:"feld"}, el("span",{},"Lerngruppe"), gr),
    fehler,
    el("button",{class:"knopf voll", onclick:()=>{
      if(!vn.value.trim() || !gr.value.trim()){ fehler.textContent="Bitte Vorname und Lerngruppe eintragen."; fehler.classList.remove("hidden"); return; }
      if(lokal && !confirm(`Auf diesem Gerät ist noch der Spielstand von ${lokal.vorname}. Er wird hier gelöscht. Hast du ihn als Datei gespeichert?`)) return;
      S = neuerStand(vn.value.trim(), gr.value.trim()); merke(); zeigeThemen();
    }}, "Los geht's"),
    el("div",{class:"trenn"},"oder"),
    el("h2",{style:"margin:0;font-size:20px"}, "Spielstand laden"),
    el("p",{class:"ladehinweis"}, "Du hast schon angefangen? Wähle deine Datei aus deinem Ordner auf dem Server. Sie endet auf .statistik"),
    el("button",{class:"knopf", onclick:()=>$("#dateiwahl").click()}, "Datei auswählen …")
  );
  app.append(box);
}
$("#dateiwahl").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  try{
    const obj = entschluesseln(await f.text());
    if(obj.kurs !== KURS) throw new Error("Diese Datei gehört zu einem anderen Lernpfad.");
    delete obj._veraendert;
    S = obj; ungespeichert = false;
    try{ localStorage.setItem(SPEICHERKEY, JSON.stringify(S)); }catch(err){}
    hinweis(`Willkommen zurück, ${S.vorname}!`);
    if(S.ort && KAPITEL[S.ort.kapitel]) oeffneKapitel(S.ort.kapitel, S.ort.schritt); else zeigeThemen();
  }catch(err){
    alert("Die Datei konnte nicht geladen werden. " + (err.message||""));
  }
});
$("#speichern").addEventListener("click", speichereDatei);
$("#zurStart").addEventListener("click", ()=>zeigeThemen());
$("#abmelden").addEventListener("click", ()=>{
  if(ungespeichert && !confirm("Dein neuester Stand ist noch nicht als Datei gespeichert. Trotzdem wechseln?")) return;
  try{ localStorage.removeItem(SPEICHERKEY); }catch(e){}
  S = null; ungespeichert = false; zeigeStart();
});

/* =========================================================
   Themenkarte
   ========================================================= */
function zeigeThemen(){
  $("#kopf").classList.remove("hidden"); $("#nav").classList.add("hidden");
  $("#wer").textContent = `${S.vorname} · ${S.gruppe}`;
  zeigeSpeicherStatus();
  S.ort = null;
  const app = $("#app"); app.innerHTML = "";
  app.append(el("div",{class:"gruss"}, `Hallo ${S.vorname}!`),
    el("p",{style:"margin:0;color:var(--grau)"}, "Wähle ein Kapitel. Die Nummern sind dieselben wie auf den Karten in der Box."));
  for(const g of GRUPPEN){
    app.append(el("div",{class:"gruppe"}, el("span",{class:"streifen", style:`background:${g.farbe}`}), el("h2",{}, g.titel)));
    const k = el("div",{class:"kacheln"});
    for(const kap of g.kapitel){
      const da = !!KAPITEL[kap.id], fertig = S.kapitel[kap.id] && S.kapitel[kap.id].fertig;
      const zusatz = kap.analog ? "auf Papier bei deiner Lehrkraft" : (da ? (fertig ? "fertig" : (S.kapitel[kap.id] ? "angefangen" : "")) : "im Prototyp noch nicht da");
      const kachel = el("button",{class:"kachel" + (da?"":" zu") + (fertig?" fertig":"") + (kap.analog?" analog":""),
        onclick: da ? ()=>oeffneKapitel(kap.id) : null},
        el("span",{class:"nr"}, kap.nr),
        el("span",{class:"txt"}, kap.titel, el("span",{class:"klein"}, zusatz)),
        fertig ? el("span",{class:"haken"},"✓") : null);
      if(!da) kachel.disabled = true;
      k.append(kachel);
    }
    app.append(k);
  }
  window.scrollTo(0,0);
}

/* =========================================================
   Kapitel: Kartenstapel
   ========================================================= */
let aktKap = null, aktSchritt = 0;
function oeffneKapitel(id, schritt=0){
  aktKap = KAPITEL[id]; aktSchritt = Math.min(schritt, aktKap.schritte.length-1);
  if(!S.kapitel[id]) { S.kapitel[id] = {begonnen:jetzt(), fertig:null}; merke(); }
  $("#kopf").classList.remove("hidden"); $("#nav").classList.remove("hidden");
  $("#wer").textContent = `${S.vorname} · ${S.gruppe}`;
  zeigeSchritt();
}
function zeigeSchritt(){
  const kap = aktKap, sch = kap.schritte[aktSchritt];
  S.ort = {kapitel:kap.id, schritt:aktSchritt};
  let neu = !S.karten[sch.karte];
  kartenProtokoll(sch.karte);
  if(!S.kapitel[kap.id].besucht) S.kapitel[kap.id].besucht = [];
  if(!S.kapitel[kap.id].besucht.includes(aktSchritt)){ S.kapitel[kap.id].besucht.push(aktSchritt); neu = true; }
  if(neu) merke(); else { try{ localStorage.setItem(SPEICHERKEY, JSON.stringify(S)); }catch(e){} }
  const app = $("#app"); app.innerHTML = "";
  app.append(el("div",{class:"kapitelkopf"},
    el("div",{class:"badge"}, String(sch.karte)),
    el("div",{}, el("div",{class:"thema"}, kap.thema), el("h1",{}, kap.titel))));
  const punkte = el("div",{class:"punkte"});
  kap.schritte.forEach((s,i)=>{
    const b = el("button",{class:"punkt", title:s.name, onclick:()=>{ aktSchritt=i; zeigeSchritt(); }});
    if((S.kapitel[kap.id].besucht||[]).includes(i)) b.classList.add("besucht");
    if(s.fertig && s.fertig()) b.classList.add("erledigt");
    if(i===aktSchritt) b.classList.add("aktiv");
    punkte.append(b);
  });
  app.append(punkte);
  const karte = el("div",{class:"karte"});
  sch.zeige(karte);
  app.append(karte);
  $("#zurueck").disabled = aktSchritt===0;
  $("#weiter").textContent = aktSchritt===kap.schritte.length-1 ? "Zur Themenkarte" : "Weiter →";
  window.scrollTo(0,0);
}
$("#zurueck").addEventListener("click", ()=>{ if(aktSchritt>0){ aktSchritt--; zeigeSchritt(); } });

  if(aktSchritt < aktKap.schritte.length-1){ aktSchritt++; zeigeSchritt(); } else zeigeThemen();
});
function pruefeKapitelFertig(){
  const kap = aktKap;
  const alle = kap.pflicht.every(id => { const u = S.uebungen[id]; return u && (u.geloest || u.loesungGezeigt); })
             && kap.heftPflicht.every(id => S.heft[id] && S.heft[id].erledigt);
  // Karten als erledigt markieren
  for(const nr of kap.karten){
    const ok = kap.pflicht.filter(id => id.startsWith(nr+"-")).every(id => { const u=S.uebungen[id]; return u && (u.geloest||u.loesungGezeigt); });
    if(ok && S.karten[nr] && !S.karten[nr].erledigt) S.karten[nr].erledigt = jetzt();
  }
  if(alle && !S.kapitel[kap.id].fertig){ S.kapitel[kap.id].fertig = jetzt(); merke(); return true; }
  return false;
}

/* teil = {id, karte, titel, frage(html), typ:"zahl"|"wahl"|"mehr"|"felder", ...} */
function baueTeil(t){
  const u = uebung(t.id, t);
  const box = el("div",{class:"teil" + (u.geloest ? " richtig":"")});
  box.append(el("div",{class:"frage", html:t.frage}));
  const rueck = el("div",{class:"rueck hidden"});
  const tippBox = el("div",{class:"tipp hidden", html:"<b>Tipp:</b> " + t.tipp});
  const loesBox = el("div",{class:"loesungzeigen hidden", html:"<b>Lösung:</b> " + t.loesung});
  const links = el("div",{class:"links"});
  const tippKnopf = el("button",{class:"linkknopf", onclick:()=>{ tippBox.classList.remove("hidden"); tippKnopf.remove(); if(!u.tipp){ u.tipp=true; u.tippZeit=jetzt(); merke(); } }}, "Tipp anzeigen");
  const loesKnopf = el("button",{class:"linkknopf hidden", onclick:()=>{ loesBox.classList.remove("hidden"); loesKnopf.remove(); if(!u.loesungGezeigt){ u.loesungGezeigt=true; u.loesungZeit=jetzt(); merke(); pruefeKapitelFertig(); } }}, "Lösung anzeigen");
  if(t.tipp && !u.geloest) links.append(tippKnopf);
  links.append(loesKnopf);
  if(u.tipp && !u.geloest){ tippBox.classList.remove("hidden"); tippKnopf.remove(); }
  if(u.loesungGezeigt){ loesBox.classList.remove("hidden"); }
  else if(u.versuche>=3 && !u.geloest) loesKnopf.classList.remove("hidden");

  function auswerten(richtig, antwortText){
    u.versuche++;
    if(u.ersterVersuchRichtig===null) u.ersterVersuchRichtig = richtig;
    if(richtig){
      u.geloest = jetzt();
      box.classList.add("richtig");
      rueck.className = "rueck gut"; rueck.innerHTML = t.lob || "Richtig!";
      tippKnopf.remove(); loesKnopf.remove();
      if(t.nachher) rueck.innerHTML += " " + t.nachher;
    }else{
      if(u.falsch.length < 8) u.falsch.push(antwortText);
      rueck.className = "rueck nochnicht";
      rueck.innerHTML = (typeof t.fehler==="function" ? t.fehler(antwortText) : null) || "Noch nicht. Prüfe deine Rechnung noch einmal.";
      if(u.versuche>=3 && !u.loesungGezeigt) loesKnopf.classList.remove("hidden");
    }
    if(t.beiAuswertung) t.beiAuswertung(richtig);
    merke(); pruefeKapitelFertig();
  }

  if(t.typ==="zahl" || t.typ==="felder"){
    const felder = t.typ==="zahl" ? [{einheit:t.einheit, wert:t.wert, tol:t.tol}] : t.felder;
    const reihe = el("div",{class:"eingabe"});
    const inputs = felder.map(f => {
      const i = el("input",{type:"text", inputmode:"decimal", autocomplete:"off", "aria-label":f.einheit||"Antwort"});
      if(u.geloest) { i.value = fmt(f.wert); i.disabled = true; }
      reihe.append(i); if(f.einheit) reihe.append(el("span",{class:"einheit"}, f.einheit));
      i.addEventListener("keydown", e => { if(e.key==="Enter") pruefen(); });
      return i;
    });
    const pk = el("button",{class:"knopf voll klein", onclick:()=>pruefen()}, "Prüfen");
    if(!u.geloest) reihe.append(pk);
    function pruefen(){
      if(u.geloest) return;
      const werte = inputs.map(i => zahl(i.value));
      if(werte.some(isNaN)){ rueck.className="rueck nochnicht"; rueck.textContent="Bitte gib eine Zahl ein."; return; }
      const ok = werte.every((w,k) => Math.abs(w - felder[k].wert) <= (felder[k].tol ?? 0.001));
      auswerten(ok, inputs.map(i=>i.value.trim()).join(" | "));
      if(ok){ inputs.forEach(i=>i.disabled=true); pk.remove(); }
    }
    box.append(reihe);
  }
  if(t.typ==="wahl" || t.typ==="mehr"){
    const mehr = t.typ==="mehr";
    const wahl = el("div",{class: mehr ? "chips" : "wahl"});
    const gewaehlt = new Set();
    const knoepfe = t.optionen.map((o,k) => {
      const b = el("button",{onclick:()=>{
        if(u.geloest) return;
        if(mehr){ gewaehlt.has(k) ? gewaehlt.delete(k) : gewaehlt.add(k); b.classList.toggle("gewaehlt"); }
        else{ knoepfe.forEach(x=>x.classList.remove("gewaehlt")); b.classList.add("gewaehlt"); gewaehlt.clear(); gewaehlt.add(k); pruefen(); }
      }}, o);
      wahl.append(b); return b;
    });
    const richtigeSet = new Set([].concat(t.richtig));
    if(u.geloest) knoepfe.forEach((b,k)=>{ if(richtigeSet.has(k)) b.classList.add("ist-richtig"); });
    function pruefen(){
      if(u.geloest) return;
      if(gewaehlt.size===0){ rueck.className="rueck nochnicht"; rueck.textContent="Wähle zuerst aus."; return; }
      const ok = gewaehlt.size===richtigeSet.size && [...gewaehlt].every(k=>richtigeSet.has(k));
      auswerten(ok, [...gewaehlt].map(k=>t.optionen[k]).join(" + "));
      if(ok) knoepfe.forEach((b,k)=>{ b.classList.remove("gewaehlt"); if(richtigeSet.has(k)) b.classList.add("ist-richtig"); });
    }
    box.append(wahl);
    const pz = el("div",{style:"margin-top:8px"}, el("button",{class:"knopf voll klein", onclick:()=>{ pruefen(); if(u.geloest) pz.remove(); }}, "Prüfen"));
    if(mehr && !u.geloest) box.append(pz);
  }
  if(u.geloest){ rueck.className = "rueck gut"; rueck.innerHTML = "Erledigt." + (t.nachher ? " " + t.nachher : ""); }
  box.append(rueck, tippBox, loesBox, links);
  return box;
}
function aufgabenkopf(nr, stufe, piktogramm="✏️"){
  return el("div",{class:"aufgabenkopf"}, el("span",{style:"font-size:22px"}, piktogramm), el("b",{}, "Aufgabe " + nr), el("span",{class:"stufe"}, stufe));
}

/* ---- Säulendiagramm als SVG ---- */
function saeulen({werte, namen, max, schritt, linie, linieText, hoehe=230, breite=460, farbe="var(--d1)", titel, einheit}){
  const ns = "http://www.w3.org/2000/svg";
  const L=46, R=linieText?92:14, O=titel?34:14, U=34, h=hoehe-O-U, w=breite-L-R, n=werte.length, bw=Math.min(64, w/n*0.55);
  let s = `<svg xmlns="${ns}" viewBox="0 0 ${breite} ${hoehe}" width="100%" style="max-width:${breite}px" role="img" aria-label="${titel||"Säulendiagramm"}">`;
  if(titel) s += `<text x="${breite/2}" y="20" text-anchor="middle" font-weight="700" font-size="15" fill="#1d2a30">${titel}</text>`;
  for(let y=0;y<=max;y+=schritt){ const yy=O+h-h*y/max;
    s += `<line x1="${L}" x2="${L+w}" y1="${yy}" y2="${yy}" stroke="#e3e9ec"/><text x="${L-6}" y="${yy+5}" text-anchor="end" font-size="13" fill="#555">${y}</text>`; }
  if(einheit) s += `<text x="12" y="${O+h/2}" font-size="13" fill="#555" transform="rotate(-90 12 ${O+h/2})" text-anchor="middle">${einheit}</text>`;
  werte.forEach((v,i)=>{ const x=L+w*(i+0.5)/n-bw/2, hh=h*v/max;
    s += `<rect x="${x}" y="${O+h-hh}" width="${bw}" height="${hh}" fill="${farbe}" rx="2"/>`; });
  if(linie!=null) s += `<line x1="${L}" x2="${L+w}" y1="${O+h-h*linie/max}" y2="${O+h-h*linie/max}" stroke="var(--d2)" stroke-width="2.5" stroke-dasharray="7 5"/>`;
  werte.forEach((v,i)=>{ const x=L+w*(i+0.5)/n-bw/2, hh=h*v/max;
    s += `<text x="${x+bw/2}" y="${O+h-hh-6}" text-anchor="middle" font-size="13" fill="#1d2a30" stroke="#fff" stroke-width="4" paint-order="stroke">${v}</text>`;
    s += `<text x="${x+bw/2}" y="${O+h+20}" text-anchor="middle" font-size="14" fill="#1d2a30">${namen[i]}</text>`; });
  s += `<line x1="${L}" x2="${L+w}" y1="${O+h}" y2="${O+h}" stroke="#555"/>`;
  if(linie!=null){ const yy=O+h-h*linie/max;
    if(linieText){ const [a,...b] = linieText.split(" "); s += `<text x="${L+w+6}" y="${yy-3}" font-size="13" font-weight="700" fill="var(--d2)">${a}</text><text x="${L+w+6}" y="${yy+13}" font-size="13" font-weight="700" fill="var(--d2)">${b.join(" ")}</text>`; } }
  return s + `</svg>`;
}

      el("table",{class:"daten", html:"<tr><th>Mo</th><th>Di</th><th>Mi</th><th>Do</th><th>Fr</th><th>Sa</th><th>So</th></tr><tr><td>180</td><td>150</td><td>210</td><td>165</td><td>240</td><td>300</td><td>290</td></tr>"}),
      baueTeil({id:"23-2a", karte:23, titel:"A2 a) Bildschirmzeit pro Tag", typ:"zahl", wert:219.29, tol:0.06, einheit:"Minuten",
        frage:"a) Berechne das arithmetische Mittel der Bildschirmzeit pro Tag. Runde auf eine Stelle nach dem Komma.",
        tipp:"Die Summe der sieben Werte ist 1535 Minuten.", loesung:"1535 : 7 ≈ 219,3 Minuten",
        fehler:a=>{ const z=zahl(a); return z===1535 ? "Das ist die Summe. Teile sie noch durch die Anzahl der Tage." : (Math.abs(z-219)<0.6 ? "Fast! Runde auf eine Stelle nach dem Komma." : null); }}),
      baueTeil({id:"23-2b", karte:23, titel:"A2 b) in Stunden und Minuten", typ:"felder", felder:[{wert:3, einheit:"Stunden"},{wert:39, tol:0.6, einheit:"Minuten"}],
        frage:"b) Gib das Ergebnis in Stunden und Minuten an. Runde auf ganze Minuten.",
        tipp:"1 Stunde hat 60 Minuten. Wie oft passen 60 Minuten in 219 Minuten? Was bleibt übrig?", loesung:"219 Minuten = 180 Minuten + 39 Minuten = 3 Stunden 39 Minuten"}));
  }});

  /* 6 Aufgabe 3 (Karte 24) */
  K.schritte.push({name:"Aufgabe 3", karte:24, fertig:alleGeloest(["24-3a","24-3b"]), zeige(k){
    k.append(aufgabenkopf(3,"Standard"),
      el("p",{}, "Notenspiegel einer Mathearbeit:"),
      el("table",{class:"daten", html:"<tr><th>Note</th><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr><tr><th>Anzahl</th><td>3</td><td>6</td><td>8</td><td>5</td><td>2</td><td>1</td></tr>"}),
      baueTeil({id:"24-3a", karte:24, titel:"A3 a) Anzahl Lernende", typ:"zahl", wert:25, einheit:"Lernende",
        frage:"a) Wie viele Lernende schrieben mit?", tipp:"Addiere die Zahlen in der Zeile „Anzahl“.", loesung:"3 + 6 + 8 + 5 + 2 + 1 = 25"}),
      baueTeil({id:"24-3b", karte:24, titel:"A3 b) Notendurchschnitt", typ:"zahl", wert:3,
        frage:"b) Berechne den Notendurchschnitt.",
        tipp:"Nimm jede Note mit ihrer Anzahl mal: 1 · 3, 2 · 6, … Addiere die Produkte und teile durch 25.",
        loesung:"3 + 12 + 24 + 20 + 10 + 6 = 75; 75 : 25 = 3,0",
        fehler:a=>{ const z=zahl(a); return z===3.5 ? "So rechnet Tim in Teil c). Beachte, wie oft jede Note vorkommt." : (z===75 ? "75 ist die Summe aller Noten. Teile noch durch die Anzahl der Lernenden." : null); }}),
      el("div",{class:"teil"}, el("div",{class:"frage"}, "c) Tim rechnet (1 + 2 + 3 + 4 + 5 + 6) : 6 = 3,5. Erkläre seinen Fehler."),
        el("div",{class:"tipp", html:"📒 Diese Teilaufgabe machst du <b>im Heft</b>. Am Ende des Kapitels kannst du deine Antwort mit der Musterlösung vergleichen."})));
  }});

  /* 7 Aufgabe 4 */
  K.schritte.push({name:"Aufgabe 4", karte:24, fertig:alleGeloest(["24-4a","24-4b"]), zeige(k){
    k.append(aufgabenkopf(4,"Standard"),
      el("p",{}, "Geschwister in der Klasse 7a. Diese Umfrage kennst du von Karte 17."),
      el("table",{class:"daten", html:"<tr><th>Geschwister</th><td>0</td><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>Anzahl</th><td>4</td><td>10</td><td>7</td><td>3</td><td>1</td></tr>"}),
      baueTeil({id:"24-4a", karte:24, titel:"A4 a) Mittelwert Geschwister", typ:"zahl", wert:1.48, tol:0.006, einheit:"Geschwister",
        frage:"a) Berechne den Mittelwert der Geschwisterzahl.",
        tipp:"0 · 4 + 1 · 10 + 2 · 7 + 3 · 3 + 4 · 1 = 37. Wie viele Kinder wurden befragt?",
        loesung:"0 + 10 + 14 + 9 + 4 = 37; 37 : 25 = 1,48 Geschwister",
        fehler:a=>{ const z=zahl(a); return z===2 ? "Du hast (0 + 1 + 2 + 3 + 4) : 5 gerechnet. Beachte die Anzahl in der Tabelle." : (z===37 ? "37 ist die Summe aller Geschwister. Teile noch durch die Anzahl der Kinder." : null); }}),
      baueTeil({id:"24-4b", karte:24, titel:"A4 b) Bedeutung von 1,48", typ:"wahl",
        frage:"b) Kann ein Kind 1,48 Geschwister haben? Was bedeutet die Zahl?",
        optionen:["Ja, denn so hat es die Rechnung ergeben.",
                  "Nein. Die Zahl ist eine Rechengröße: Im Mittel kommen auf jedes Kind etwa 1,5 Geschwister. 100 Kinder hätten zusammen etwa 148 Geschwister.",
                  "Nein. Die Rechnung muss falsch sein, weil keine Kommazahl herauskommen darf."], richtig:1,
        tipp:"Das arithmetische Mittel verteilt die Summe gleichmäßig. Muss dabei eine ganze Zahl herauskommen?",
        loesung:"Nein. 1,48 ist eine Rechengröße. 100 Kinder haben zusammen etwa 148 Geschwister."}));
  }});

  /* 8 Aufgabe 5 */
  K.schritte.push({name:"Aufgabe 5", karte:24, fertig:alleGeloest(["24-5a","24-5b","24-5c"]), zeige(k){
    k.append(aufgabenkopf(5,"Standard"),
      el("p",{}, "Fehler im Diktat:  1,  2,  9,  0,  1,  7,  8,  5,  3"),
      baueTeil({id:"24-5a", karte:24, titel:"A5 a) Mittel der Fehlerzahlen", typ:"zahl", wert:4, einheit:"Fehler",
        frage:"a) Berechne das arithmetische Mittel der Fehlerzahlen.", tipp:"Es sind 9 Werte. Ihre Summe ist 36.", loesung:"36 : 9 = 4 Fehler"}),
      baueTeil({id:"24-5b", karte:24, titel:"A5 b) neuer Mittelwert mit 24", typ:"zahl", wert:6, einheit:"Fehler",
        frage:"b) Ein weiteres Kind hatte 24 Fehler. Berechne den neuen Mittelwert.",
        tipp:"Die neue Summe ist 36 + 24. Wie viele Kinder sind es jetzt?", loesung:"(36 + 24) : 10 = 60 : 10 = 6 Fehler",
        fehler:a=>{ const z=zahl(a); return Math.abs(z-60/9)<0.01 ? "Jetzt sind es 10 Kinder, nicht mehr 9." : null; }}),
      baueTeil({id:"24-5c", karte:24, titel:"A5 c) Was fällt auf?", typ:"wahl",
        frage:"c) Was fällt dir auf?",
        optionen:["Das arithmetische Mittel bleibt fast gleich.",
                  "Ein einziger sehr hoher Wert (Ausreißer) erhöht das arithmetische Mittel stark.",
                  "Das arithmetische Mittel ist jetzt einer der Werte aus der Liste."], richtig:1,
        tipp:"Vergleiche 4 und 6. Wodurch kommt der große Unterschied?", loesung:"Ein einziger sehr hoher Wert (Ausreißer) erhöht das arithmetische Mittel stark."}));
  }});

  /* 9 Aufgabe 6 Knobeln */
  K.schritte.push({name:"Aufgabe 6 (Knobeln)", karte:24, freiwillig:true, fertig:alleGeloest(["24-6"]), zeige(k){
    k.append(aufgabenkopf(6,"Knobeln · freiwillig","🧩"),
      el("p",{}, "Lena hat in vier Tests die Noten 2, 3, 2 und 4."),
      baueTeil({id:"24-6", karte:24, titel:"A6 Knobeln: Note für 2,6", typ:"zahl", wert:2,
        frage:"Welche Note braucht sie im fünften Test, damit ihr Durchschnitt genau 2,6 ist?",
        tipp:"Wie groß muss die Summe aller fünf Noten sein, wenn der Durchschnitt 2,6 ist?",
        loesung:"Summe: 5 · 2,6 = 13. Bisher: 2 + 3 + 2 + 4 = 11. 13 − 11 = 2. Lena braucht eine 2."}));
  }});

  /* 10 Training mit Zufallszahlen */
  K.schritte.push({name:"Training", karte:24, zeige(k){
    const u = uebung("24-training", {karte:24, titel:"Training mit Zufallszahlen (freiwillig)"});
    if(u.geschafft==null) u.geschafft = 0;
    k.append(el("div",{class:"kicker"}, "Training · freiwillig"), el("h2",{}, "Noch mehr üben"),
      el("p",{}, "Hier bekommst du immer neue Zahlen. Übe so lange, bis du dich sicher fühlst."));
    const feld = el("div");
    k.append(feld);
    function neu(){
      delete S.uebungen["24-training-aktuell"];
      let werte, n, s;
      do{ n = 4 + Math.floor(Math.random()*3); werte = Array.from({length:n}, ()=>1+Math.floor(Math.random()*20)); s = werte.reduce((a,b)=>a+b,0); }
      while( (s*10) % n !== 0 );     // Ergebnis mit höchstens einer Stelle nach dem Komma
      const m = s/n;
      feld.innerHTML = "";
      feld.append(el("p",{style:"font-size:22px;letter-spacing:.04em"}, werte.join(",   ")),
        baueTeil({id:"24-training-aktuell", karte:24, titel:"Training", typ:"zahl", wert:m,
          frage:"Berechne das arithmetische Mittel.", tipp:`Die Summe ist ${s}. Es sind ${n} Werte.`, loesung:`${s} : ${n} = ${fmt(m)}`,
          lob:"Richtig!",
          beiAuswertung:richtig => { u.versuche++; if(richtig){ u.geschafft++; if(!u.geloest) u.geloest = jetzt(); } u.zuletzt = jetzt(); }}),
        el("div",{style:"margin-top:12px"}, el("button",{class:"knopf", onclick:neu}, "Neue Aufgabe")));
    }
    neu();
  }});

  /* 11 Im Heft */
  K.schritte.push({name:"Im Heft", karte:24, fertig:()=>K.heftPflicht.every(id=>S.heft[id]&&S.heft[id].erledigt), zeige(k){
    k.append(el("div",{class:"kicker"}, "Im Heft"), el("h2",{}, "📒 Das machst du auf Papier"));
    function heftAufgabe(id, titel, text, muster){
      const h = S.heft[id] || {};
      const box = el("div",{class:"heftaufgabe"}, el("b",{}, titel), el("p",{style:"margin:6px 0", html:text}));
      const musterBox = el("div",{class:"loesungzeigen" + (h.erledigt?"":" hidden"), html:"<b>Musterlösung:</b> " + muster});
      const cb = el("input",{type:"checkbox"}); cb.checked = !!h.erledigt;
      cb.addEventListener("change", ()=>{
        S.heft[id] = {erledigt: cb.checked ? jetzt() : null};
        musterBox.classList.toggle("hidden", !cb.checked);
        merke(); pruefeKapitelFertig();
      });
      box.append(el("label",{}, cb, "Erledigt"));
      if(muster) box.append(musterBox);
      return box;
    }
    k.append(
      heftAufgabe("23-merke", "Merkkasten übertragen", "Übertrage den Merkkasten zum arithmetischen Mittel in deinen Hefter.", "Vergleiche mit dem Merkkasten auf Karte 23."),
      heftAufgabe("24-3c", "Aufgabe 3 c)", "Tim rechnet (1 + 2 + 3 + 4 + 5 + 6) : 6 = 3,5. Erkläre seinen Fehler in ganzen Sätzen.",
        "Tim beachtet nicht, wie oft jede Note vorkommt. Es gab acht Dreien, aber nur eine Sechs. Er muss jede Note mit ihrer Anzahl malnehmen und durch 25 teilen."));
  }});

  /* 12 Abschluss */
  K.schritte.push({name:"Fertig", karte:24, zeige(k){
    pruefeKapitelFertig();
    const fertig = S.kapitel.mittelwert && S.kapitel.mittelwert.fertig;
    if(fertig){
      k.append(el("div",{class:"fertigbild"}, el("div",{class:"gross"},"✓"),
        el("h2",{}, "Kapitel geschafft!"),
        el("p",{}, "Du kannst jetzt das arithmetische Mittel berechnen, auch aus einer Häufigkeitstabelle."),
        el("p",{}, el("button",{class:"knopf warm voll", onclick:speichereDatei}, "Spielstand jetzt speichern"))));
    }else{
      const offen = K.schritte.map((s,i)=>({s,i})).filter(({s})=>s.fertig && !s.freiwillig && !s.fertig());
      k.append(el("h2",{}, "Fast geschafft"), el("p",{}, "Diese Teile sind noch offen:"));
      const liste = el("div",{class:"chips"});
      offen.forEach(({s,i}) => liste.append(el("button",{onclick:()=>{ aktSchritt=i; zeigeSchritt(); }}, s.name)));
      k.append(liste, el("p",{class:"ladehinweis", style:"margin-top:16px"}, "Aufgabe 6 und das Training sind freiwillig."),
        el("p",{}, el("button",{class:"knopf warm", onclick:speichereDatei}, "Zwischenstand speichern")));
    }
  }});
})();

/* Start */
zeigeStart();
