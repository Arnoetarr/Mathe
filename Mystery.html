<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akte Pinguin</title>
<style>
:root{--paper:#f3ead3;--card:#fbf6e8;--ink:#2b2420;--soft:#6d6052;--line:#cbbc98;--red:#b3261e;--ok:#2e6b3a;--mark:#fff3b0;--grey:#a79c8a;
--k0:#b3261e;--k1:#2f5d8a;--k2:#2e6b3a;--k3:#a8691b;--pw:100vw}
@media (prefers-color-scheme:dark){:root{--paper:#1d1a16;--card:#28241e;--ink:#ece1c8;--soft:#a99c86;--line:#4b4336;--red:#e5645a;--ok:#7cc48a;--mark:#4a431f;--grey:#6f6657;
--k0:#e5645a;--k1:#7fb0de;--k2:#7cc48a;--k3:#e0a659}}
@media (min-width:1000px){:root{--pw:min(540px,46vw)}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 Georgia,"Times New Roman",serif}
main{max-width:760px;margin:0 auto;padding:18px 16px 90px}
h1,h2,h3,.mono,button,select,caption{font-family:"Courier New",Courier,monospace}
h1{font-size:2rem;margin:.2em 0 0;letter-spacing:.04em;text-transform:uppercase}
h2{font-size:1.35rem;margin:.2em 0 .1em}
h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.12em;margin:1.8em 0 .5em;border-bottom:2px solid var(--ink);padding-bottom:3px}
.sub{color:var(--soft);margin:0 0 1em}
.mono{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
button{font-size:.95rem;cursor:pointer;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:9px 14px}
button:hover{background:var(--mark)}
button.primary{background:var(--ink);color:var(--paper)}
button.primary:hover{background:var(--red);border-color:var(--red)}
button.link{border:0;background:none;padding:4px 0;text-decoration:underline}
button.small{padding:5px 9px;font-size:.82rem}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.cases{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.cases button{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;box-shadow:3px 3px 0 var(--line)}
.cases .nr{font-size:1.5rem;font-weight:bold}
.cases .t{font-family:Georgia,serif;font-size:1.05rem}
.stars{color:var(--red);letter-spacing:2px;font-size:.85rem}
.stamp{display:inline-block;border:3px solid var(--ok);color:var(--ok);padding:1px 8px;border-radius:4px;transform:rotate(-6deg);font:bold .8rem "Courier New",monospace;letter-spacing:.12em}
details{background:var(--card);border:1px dashed var(--line);border-radius:4px;padding:8px 14px;margin:0 0 18px}
summary{cursor:pointer;font-family:"Courier New",monospace}
details ul{padding-left:1.1em;margin:.6em 0}
.intro{background:var(--card);border-left:5px solid var(--red);padding:12px 14px;margin:12px 0}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(138px,1fr))}
.fc,.fc:hover{border:0;background:none;padding:0;text-align:left;perspective:900px;border-radius:9px;display:block}
.fc .in{display:grid;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc .f,.fc .bk{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:2px solid var(--ink);border-top:9px solid var(--k);border-radius:9px;padding:10px;min-height:132px;box-shadow:3px 3px 0 var(--line);display:flex;flex-direction:column}
.fc .f{align-items:center;justify-content:center;text-align:center;gap:4px}
.fc .em{font-size:2.6rem;line-height:1.1}
.fc b{font-family:"Courier New",monospace;font-size:.98rem}
.fc .turn{font:.68rem "Courier New",monospace;color:var(--soft);letter-spacing:.08em;text-transform:uppercase;margin-top:auto}
.fc .bk{transform:rotateY(180deg);font-family:Georgia,serif;font-size:.86rem;line-height:1.4;gap:4px}
.fc .bk b{color:var(--k)}
.fc.on .in{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.fc .in{transition:none}}
.k0{--k:var(--k0)}.k1{--k:var(--k1)}.k2{--k:var(--k2)}.k3{--k:var(--k3)}
h3.kh{border-color:var(--k)}
ol.clues{padding-left:1.4em;margin:0}
ol.clues li{padding:5px 4px;cursor:pointer;border-radius:3px}
ol.clues li.done{text-decoration:line-through;color:var(--soft)}
.say{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px 12px;margin:6px 0;cursor:pointer}
.say.done{opacity:.55;text-decoration:line-through}
.say b{font-family:"Courier New",monospace}
.note{font-size:.92rem;color:var(--soft);margin:.3em 0 .6em}
.answer{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
select{font-size:1rem;padding:9px 8px;border:2px solid var(--ink);border-radius:4px;background:var(--card);color:var(--ink);max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{font-family:"Courier New",monospace;margin:.7em 0;min-height:1.4em}
.msg.bad{color:var(--red)}
.outro{background:var(--card);border:3px double var(--ok);padding:12px 14px;margin:12px 0}
.hint{background:var(--mark);padding:8px 12px;border-radius:4px;margin:10px 0}
footer{margin-top:40px;font-size:.8rem;color:var(--soft);border-top:1px solid var(--line);padding-top:10px}
/* Notizbuch */
#fab{position:fixed;right:14px;bottom:14px;z-index:5;box-shadow:3px 3px 0 var(--line);font-weight:bold}
#nb{position:fixed;z-index:6;left:0;right:0;bottom:0;height:62vh;background:var(--paper);border-top:3px solid var(--ink);display:flex;flex-direction:column;box-shadow:0 -6px 18px rgba(0,0,0,.25)}
#nb[hidden],#fab[hidden]{display:none}
.nbh{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.nbh b{font-family:"Courier New",monospace;letter-spacing:.08em;text-transform:uppercase;margin-right:auto}
.nbb{overflow:auto;padding:10px 12px 24px;flex:1;background-image:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);background-attachment:local}
body.nbo{padding-bottom:62vh}
@media (min-width:1000px){
  #nb{left:auto;top:0;height:auto;width:var(--pw);border-top:0;border-left:3px solid var(--ink);box-shadow:-6px 0 18px rgba(0,0,0,.18)}
  body.nbo{padding-bottom:0;padding-right:var(--pw)}
}
table.lg{border-collapse:collapse;background:var(--card)}
table.lg th{font:normal .74rem/1.15 Georgia,serif;padding:0}
table.lg th.ct{font:.62rem "Courier New",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--k);padding:2px;text-align:center;background:var(--paper)}
table.lg th.v{vertical-align:bottom;padding:4px 0 3px;border:1px solid var(--line);border-top:3px solid var(--k)}
table.lg th.v .vn{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:block;margin:0 auto 3px}
table.lg th.v .ve{display:block;font-size:1rem;text-align:center}
table.lg th.r{text-align:left;white-space:nowrap;padding:0 6px 0 5px;max-width:92px;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);border-left:3px solid var(--k)}
table.lg td{padding:0;border:1px solid var(--soft)}
table.lg .bl{border-left:3px solid var(--ink)}
table.lg .bt{border-top:3px solid var(--ink)}
table.lg .br{border-right:3px solid var(--ink)}
table.lg .bb{border-bottom:3px solid var(--ink)}
table.lg th.none{background:var(--paper);border:0}
.c,.c:hover{width:var(--cs);height:var(--cs);padding:0;border:0;border-radius:0;background:var(--card);font:bold calc(var(--cs)*.62)/1 "Courier New",monospace;display:block}
.c[data-v="1"]{color:var(--red)}
.c[data-v="2"]{color:var(--ok);background:var(--mark)}
.c[data-v="3"]{color:var(--grey);font-weight:normal}
.leg{font-size:.78rem;color:var(--soft);margin:6px 0 16px;background:var(--paper);display:inline-block;padding:0 4px}
.leg i{font-style:normal;font-weight:bold}
table.ft{border-collapse:collapse;width:100%;table-layout:fixed;background:var(--card)}
table.ft th{font:.7rem "Courier New",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--k);border:1px solid var(--ink);border-top:4px solid var(--k);padding:3px}
table.ft td{border:1px solid var(--ink);padding:0}
table.ft input{width:100%;border:0;background:transparent;color:var(--ink);font:.88rem Georgia,serif;padding:7px 5px}
table.ft input:focus{outline:2px solid var(--red);outline-offset:-2px;background:var(--mark)}
.nbt{font:.72rem "Courier New",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:0 0 4px;background:var(--paper);display:inline-block;padding:0 4px}
/* Erweiterungen */
h3.seth{margin-top:2.2em}
.stamp.gold{border-color:var(--k3);color:var(--k3)}
button:disabled{opacity:.5;cursor:default}
button:disabled:hover{background:var(--card)}
.nbh{flex-wrap:wrap}
.gw{overflow-x:auto;max-width:100%;padding-bottom:4px}
table.lg th.r{position:sticky;left:0;z-index:1;background:var(--card)}
.c.as{box-shadow:inset 0 0 0 2px var(--k1)}
.hint b.mono{font-size:.72rem}
.au{list-style:none;padding:0;display:grid;gap:8px}
.au li{background:var(--card);border-left:5px solid var(--ok);padding:8px 12px}
.au li.bad{border-color:var(--red)}
#print{display:none}
@media print{
  :root{--paper:#fff;--card:#fff;--ink:#000;--soft:#444;--line:#999;--red:#b3261e;--ok:#2e6b3a;--mark:#fff;--grey:#888;--k0:#b3261e;--k1:#2f5d8a;--k2:#2e6b3a;--k3:#a8691b}
  body,body.nbo{background:#fff;font-size:10.5pt;line-height:1.4;padding:0}
  body>*:not(#print){display:none!important}
  #print{display:block}
  .pg{break-after:page}
  .pg:last-child{break-after:auto}
  #print h2{margin:0 0 4px}
  #print h3{margin:.9em 0 .35em;font-size:.8rem;break-after:avoid}
  #print .intro{padding:6px 10px;margin:6px 0}
  .pl{columns:2;column-gap:18px;list-style:none;padding:0;margin:0;font-size:9.5pt}
  .pl li{break-inside:avoid;margin:0 0 3px}
  #print ol.clues li{padding:1px 4px;cursor:auto}
  #print .say{padding:3px 8px;margin:3px 0;break-inside:avoid}
  #print table.lg{break-inside:avoid}
  #print table.lg th.r{position:static;max-width:none}
  #print .note{break-after:avoid;margin:0 0 4px}
  #print .leg{margin:4px 0 0}
  .pa{line-height:2.2;margin:0}
  .pa .ln{display:inline-block;width:14em;border-bottom:1px solid #000}
}
</style>
</head>
<body>
<main id="app"></main>
<button id="fab" data-act="nb" hidden>📓 Notizbuch</button>
<aside id="nb" aria-label="Notizbuch" hidden></aside>
<div id="print"></div>
<script>
/* =====================================================================
   AKTE PINGUIN · Eigene Fälle bauen
   Jeder Fall ist ein Eintrag in CASES:
     id, set (Nummer der Akte, ab 0), level (1–5), title, intro, outro
     cats     Kategorien. Die erste enthält die Verdächtigen. Jeder Eintrag
              hat e (Emoji), n (Name, im Fall eindeutig), d (Kartentext).
     guilt    Name des Eintrags, der die schuldige Person verrät
              (entfällt bei Fällen mit Aussagen, dort ist es die lügende Person)
     clues    Hinweise: t (Text) und r (Regel, kann bei reinem Erzähltext fehlen)
     statements  Aussagen: who (Name), text, r (Regel)
     hints    Tipps in Stufen
     sol      Auflösung als Namen: [Person, Eintrag aus Kategorie 2, …]
   Regeln:
     ["=", A, B]            A und B gehören zur selben Person
     ["!", A, B]            A und B gehören nicht zur selben Person
     ["<", A, B, Kat]       A liegt in der Kategorie Kat vor B (z. B. Uhrzeit)
     ["+", A, B, n, Kat]    B liegt in Kat genau n Schritte nach A
     ["and", …] ["or", …] ["not", Regel]
     "@" steht für die schuldige Person.
   Prüfen: Seite öffnen und unten „Fälle prüfen“ wählen (oder #pruefen
   an die Adresse hängen). Jeder Fall wird vollständig durchgerechnet.
   ===================================================================== */
const SETS = ['Zoo, Riff und Tierschule', 'Burg Bröselstein', 'Raumstation Kartoffel 7', 'Schloss Schlotterfels', 'Wichtelwerkstatt am Nordpol'];
const CASES = [
{"id":"f1","set":0,"level":1,"title":"Der Fischstäbchen-Coup","intro":"Großalarm im Zoo. Aus dem Kiosk sind 37 Fischstäbchen verschwunden, und zwar samt Remoulade. Die Zoodirektorin tobt, die Robben weinen. Drei Tiere wurden zur Tatzeit außerhalb ihrer Gehege gesehen. Wer am Kiosk war, hat die Fischstäbchen auf dem Gewissen.","cats":[{"name":"Verdächtige","items":[{"e":"🐧","n":"Pauli","d":"Pinguin. Trägt immer Frack und behauptet, das sei angeboren."},{"e":"🦓","n":"Zacharias","d":"Zebra. Hält sich für ein Pferd im Schlafanzug."},{"e":"🦥","n":"Fridolin","d":"Faultier. Wurde zuletzt 2019 bei einer schnellen Bewegung beobachtet."}]},{"name":"Gegenstand","items":[{"e":"🎒","n":"Rucksack","d":"Fassungsvermögen laut Hersteller 20 Liter oder 37 Fischstäbchen."},{"e":"🛒","n":"Einkaufswagen","d":"Braucht einen Euro als Pfand. Rollt immer leicht nach links."},{"e":"☂️","n":"Regenschirm","d":"Gelb mit Entenkopf-Griff. Seit drei Jahren im Fundbüro vermisst."}]},{"name":"Ort","items":[{"e":"🏪","n":"Kiosk","d":"Verkauft Pommes, Eis und Fischstäbchen. Die Remoulade kostet extra."},{"e":"🐑","n":"Streichelzoo","d":"Hier darf man die Ziegen kraulen. Die Ziegen kraulen nie zurück."},{"e":"🦩","n":"Flamingoteich","d":"Flaches Wasser, rosa Bewohner, erstaunlich viel Geschnatter."}]}],"guilt":"Kiosk","clues":[{"t":"Die Fischstäbchen verschwanden aus dem Kiosk."},{"t":"Zacharias verbrachte den ganzen Nachmittag im Streichelzoo und ließ sich kraulen.","r":["=","Zacharias","Streichelzoo"]},{"t":"Wer den Einkaufswagen dabeihatte, wurde am Flamingoteich gesehen.","r":["=","Einkaufswagen","Flamingoteich"]},{"t":"Pauli hatte keinen Einkaufswagen. Seine Flossen reichen nicht bis zum Griff.","r":["!","Pauli","Einkaufswagen"]},{"t":"Zacharias trug keinen Rucksack. Er findet, Streifen und Rucksack tragen auf.","r":["!","Zacharias","Rucksack"]}],"hints":["Fang mit dem Einkaufswagen an. Wer kann ihn gehabt haben?","Zacharias war im Streichelzoo, Pauli kommt nicht an den Griff. Der Einkaufswagen war also bei Fridolin am Flamingoteich.","Für Pauli bleibt nur der Kiosk. Zacharias trug keinen Rucksack."],"outro":"Pauli war am Kiosk und stopfte alle 37 Fischstäbchen in seinen Rucksack. Bei der Festnahme sagte er nur: „Ich bin ein Pinguin. Was habt ihr erwartet?“ Fridolin schlief übrigens im Einkaufswagen und hat vom ganzen Fall nichts mitbekommen.","sol":["Pauli","Rucksack","Kiosk"]},
{"id":"f2","set":0,"level":1,"title":"Zwölf Kugeln Stracciatella","intro":"Strandbad Möwenstein, 14 Uhr. In der Eisdiele fehlen zwölf Kugeln Stracciatella. In der leeren Eiswanne klebt ein einzelnes Haar von einem falschen Schnurrbart. Wer den Schnurrbart trug, hat das Eis gefuttert.","cats":[{"name":"Verdächtige","items":[{"e":"🐦","n":"Mechthild","d":"Möwe. Hat in drei Strandbädern Pommesverbot."},{"e":"🦀","n":"Karl-Heinz","d":"Krabbe. Geht grundsätzlich seitwärts, auch Problemen aus dem Weg."},{"e":"🦭","n":"Sören","d":"Seehund. Sieht immer unschuldig aus, was ihn verdächtig macht."}]},{"name":"Verkleidung","items":[{"e":"🕶️","n":"Sonnenbrille","d":"Verspiegelt und drei Nummern zu groß."},{"e":"🥸","n":"Schnurrbart","d":"Zum Ankleben, Modell „Walross“. Juckt ab der zweiten Stunde."},{"e":"👒","n":"Strohhut","d":"Mit breiter Krempe. Fliegt bei Windstärke 3 davon."}]},{"name":"Ort","items":[{"e":"🍦","n":"Eisdiele","d":"Zwölf Sorten, davon elf vorrätig. Ausgerechnet Stracciatella fehlt."},{"e":"🏖️","n":"Strandkorb","d":"Nummer 14, gestreift. Der Bezug knarzt bei jeder Bewegung."},{"e":"🗼","n":"Leuchtturm","d":"Rot-weiß geringelt, 214 Stufen und oben eine schöne Aussicht."}]}],"guilt":"Schnurrbart","clues":[{"t":"In der leeren Eiswanne klebte ein Haar von einem falschen Schnurrbart."},{"t":"Karl-Heinz trug keinen falschen Schnurrbart. Mit seinen Scheren schneidet er alles ab, was ihm unter die Nase kommt.","r":["!","Karl-Heinz","Schnurrbart"]},{"t":"Wer die Sonnenbrille trug, saß oben auf dem Leuchtturm.","r":["=","Sonnenbrille","Leuchtturm"]},{"t":"Sören war nicht auf dem Leuchtturm. 214 Stufen sind nichts für Flossen.","r":["!","Sören","Leuchtturm"]},{"t":"Karl-Heinz war auch nicht auf dem Leuchtturm. Seitwärts kommt man keine Wendeltreppe hoch.","r":["!","Karl-Heinz","Leuchtturm"]},{"t":"Wer den Strohhut trug, wurde nicht an der Eisdiele gesehen.","r":["!","Strohhut","Eisdiele"]}],"hints":["Wer kann auf dem Leuchtturm gewesen sein?","Auf dem Leuchtturm saß die Sonnenbrille. Zwei der drei kommen dort gar nicht hoch.","Mechthild trug also die Sonnenbrille. Karl-Heinz hatte keinen Schnurrbart. Was bleibt für ihn?"],"outro":"Sören stand mit falschem Schnurrbart an der Eisdiele und löffelte zwölf Kugeln Stracciatella direkt aus der Wanne. Karl-Heinz lag mit Strohhut im Strandkorb und hat alles verschlafen. Mechthild hat vom Leuchtturm aus alles gesehen und nichts gesagt. Sie hofft noch auf die Waffeln.","sol":["Sören","Schnurrbart","Eisdiele"]},
{"id":"f3","set":0,"level":2,"title":"Der Liebesbrief im Kelpwald","intro":"Seeotterdame Ottilie ist verliebt, und zwar in Hartmut, einen Weißen Hai mit 300 Zähnen und einem weichen Herzen. Ihr Liebesbrief lag fertig im Kelpwald, auf Seetang geschrieben und mit einem Kussmund versiegelt. Jetzt ist er weg. Drei Meeresbewohner haben ausgesagt. Zwei sagen die Wahrheit, eine Person lügt. Wer lügt, hat den Brief.","cats":[{"name":"Verdächtige","items":[{"e":"🦑","n":"Torben","d":"Tintenfisch und Briefträger. Stellt mit acht Armen zu und verwechselt trotzdem alle Hausnummern."},{"e":"🐡","n":"Gisela","d":"Kugelfisch und pensionierte Deutschlehrerin. Bläst sich bei jedem Kommafehler auf."},{"e":"🦞","n":"Hubert","d":"Hummer. Kneift erst und fragt dann."}]},{"name":"Gegenstand","items":[{"e":"🐚","n":"Muschelhandy","d":"Das neueste Modell. Rauscht beim Telefonieren wie das Meer."},{"e":"🤿","n":"Taucherbrille","d":"Beschlägt ständig, was unter Wasser eigentlich niemand erklären kann."},{"e":"🛟","n":"Schwimmring","d":"Mit Entenmuster. Wird von Erwachsenen angeblich nur „für die Kinder“ gekauft."}]},{"name":"Ort","items":[{"e":"🌿","n":"Kelpwald","d":"Hohe Algen, grünes Dämmerlicht. Ein beliebter Treffpunkt für Verliebte."},{"e":"🪸","n":"Korallenriff","d":"Bunt, laut und immer voll. Die Innenstadt des Meeres."},{"e":"⚓","n":"Schiffswrack","d":"Ein gesunkener Fischkutter namens „Erika“. Dient inzwischen als Postamt."}]}],"clues":[{"t":"Der Brief lag im Kelpwald. Wer ihn genommen hat, war also dort.","r":["=","@","Kelpwald"]},{"t":"Wer das Muschelhandy hatte, war am Korallenriff. Nur dort gibt es Empfang.","r":["=","Muschelhandy","Korallenriff"]},{"t":"Der Schwimmring trieb am Schiffswrack.","r":["=","Schwimmring","Schiffswrack"]}],"statements":[{"who":"Torben","text":"Ich war am Schiffswrack und habe Post sortiert.","r":["=","Torben","Schiffswrack"]},{"who":"Gisela","text":"Hubert hatte die Taucherbrille. Ich habe es genau gesehen.","r":["=","Hubert","Taucherbrille"]},{"who":"Hubert","text":"Torben war nicht im Kelpwald. Der verheddert sich da immer.","r":["!","Torben","Kelpwald"]}],"hints":["Aus den Hinweisen folgt, welcher Gegenstand im Kelpwald war.","Nimm an, Torben lügt. Dann müsste er im Kelpwald gewesen sein. Was sagt Hubert dazu?","Lügt Hubert, dann wäre Torben im Kelpwald gewesen. Dort war aber schon Hubert selbst."],"outro":"Gisela hat gelogen. Sie hatte die Taucherbrille selbst auf der Nase und den Brief in der Flosse. Stehlen wollte sie ihn gar nicht. Sie hat mit Rotstift elf Rechtschreibfehler angestrichen („Hei“ schreibt man mit ai) und ihn dann zurückgelegt. Hartmut hat den Brief trotzdem bekommen und vor Rührung drei Zähne verloren. Fortsetzung folgt in Fall 6.","sol":["Gisela","Taucherbrille","Kelpwald"]},
{"id":"f4","set":0,"level":2,"title":"Die verschwundene Mathearbeit","intro":"Die Klasse 7b der Tierschule Eichengrund hat eine Mathearbeit geschrieben. Alle 24 Hefte lagen im Lehrerzimmer, bereit zur Korrektur. Nach der großen Pause sind sie weg. Die Klasse wirkt erstaunlich gefasst. Wer im Lehrerzimmer war, hat die Hefte verschwinden lassen.","cats":[{"name":"Verdächtige","items":[{"e":"🦝","n":"Ronny","d":"Waschbär und Hausmeister. Wäscht alles, auch Dinge, die man nicht waschen sollte."},{"e":"🦉","n":"Edeltraud","d":"Eule und Bibliothekarin. Sagt zu allem „Schuhu“, meint aber „Psst“."},{"e":"🐹","n":"Hagen","d":"Hamster aus der 7b. Hat für die Arbeit nicht gelernt und die Backen voller Spickzettel."},{"e":"🐐","n":"Zora","d":"Ziege und Referendarin. Hat immer Hunger, auch auf Dinge ohne Nährwert."}]},{"name":"Gegenstand","items":[{"e":"🧳","n":"Rollkoffer","d":"Ein Rad eiert. Man hört ihn schon drei Flure vorher."},{"e":"✂️","n":"Schere","d":"Bastelschere mit runder Spitze. Schneidet Papier und sonst gar nichts."},{"e":"☕","n":"Kaffeetasse","d":"Aufschrift „Beste Lehrkraft der Welt“. Selbst gekauft."},{"e":"🍂","n":"Laubbläser","d":"Lautstärke wie ein startendes Flugzeug. Liebling des Hausmeisters."}]},{"name":"Ort","items":[{"e":"🚪","n":"Lehrerzimmer","d":"Zutritt nur für Lehrkräfte. Riecht nach Kaffee und Korrekturstress."},{"e":"🤸","n":"Turnhalle","d":"Riecht nach Gummimatten. Irgendwo quietscht immer ein Turnschuh."},{"e":"🖨️","n":"Kopierraum","d":"Der Kopierer meldet seit 2019 „Papierstau in Fach 2“."},{"e":"🚲","n":"Fahrradkeller","d":"Dunkel, kühl und voller Fahrräder, die niemandem gehören wollen."}]}],"guilt":"Lehrerzimmer","clues":[{"t":"Die Hefte verschwanden aus dem Lehrerzimmer."},{"t":"Ronny hatte den Laubbläser dabei, wie an jedem Tag seit 2011.","r":["=","Ronny","Laubbläser"]},{"t":"Der Laubbläser dröhnte den ganzen Vormittag im Fahrradkeller.","r":["=","Laubbläser","Fahrradkeller"]},{"t":"Edeltraud war im Kopierraum und hat 300 Arbeitsblätter kopiert, alle schief.","r":["=","Edeltraud","Kopierraum"]},{"t":"Wer den Rollkoffer zog, war in der Turnhalle.","r":["=","Rollkoffer","Turnhalle"]},{"t":"Zora hatte weder den Rollkoffer noch die Schere.","r":["and",["!","Zora","Rollkoffer"],["!","Zora","Schere"]]}],"hints":["Ronny und sein Laubbläser sind schnell verortet.","Wer kann dann noch den Rollkoffer in die Turnhalle gezogen haben?","Für Zora bleiben nur ein Gegenstand und nur ein Ort."],"outro":"Zora war mit ihrer Kaffeetasse im Lehrerzimmer und hat alle 24 Hefte aufgegessen. „Ich wollte nur am ersten knabbern“, gab sie zu, „aber Bruchrechnung schmeckt überraschend nussig.“ Hagen war mit dem Rollkoffer in der Turnhalle und ist unschuldig. Die Arbeit wird nachgeschrieben. Die 7b ist jetzt deutlich weniger gefasst.","sol":["Zora","Kaffeetasse","Lehrerzimmer"]},
{"id":"f5","set":0,"level":3,"title":"Die Karaoke-Katastrophe","intro":"Waldfest, 20 Uhr, die Stimmung ist prächtig. Dann spielt die Karaoke-Maschine nur noch ein einziges Lied, nämlich „Alle meine Entchen“, in Dauerschleife und doppelter Lautstärke. Die Enten sind begeistert, alle anderen verzweifelt. Im Kassettenfach klebt ein Kaugummi. Die Maschine steht mitten auf dem Festplatz, dort kommen alle einmal vorbei. Ihr Standort verrät also nichts. Wer den Kaugummi hatte, war es.","cats":[{"name":"Verdächtige","items":[{"e":"🦡","n":"Detlef","d":"Dachs. Singt seit Jahren denselben Schlager und trifft dabei keinen Ton."},{"e":"🐗","n":"Wilma","d":"Wildschwein. Grunzt beim Lachen und lacht viel."},{"e":"🦊","n":"Ferdinand","d":"Fuchs und Tontechniker. Schlau, aber nur bis 22 Uhr."},{"e":"🦔","n":"Ingeborg","d":"Igel. Darf seit dem Vorfall mit dem Planschbecken nichts Aufblasbares mehr betreten."}]},{"name":"Gegenstand","items":[{"e":"🪛","n":"Schraubenzieher","d":"Kreuzschlitz, mittelgroß. Passt grundsätzlich nie zur Schraube."},{"e":"🍬","n":"Kaugummi","d":"Erdbeergeschmack. Die Sorte, die nach vier Minuten nach nichts mehr schmeckt."},{"e":"🪣","n":"Wassereimer","d":"Zehn Liter, blau. Gehört der Feuerwehr und wird dringend zurückerwartet."},{"e":"🪗","n":"Akkordeon","d":"Hat 120 Bässe. Gespielt werden davon höchstens drei."}]},{"name":"Ort","items":[{"e":"🎤","n":"Bühne","d":"Sechs Bretter auf Bierkisten. Wackelt im Takt mit."},{"e":"🌭","n":"Bratwurststand","d":"Die Schlange reicht bis zum Waldrand. Senf kostet nichts."},{"e":"🏰","n":"Hüpfburg","d":"Form eines Schlosses, Farbe eines Bonbons. Schuhe bitte ausziehen."},{"e":"🎛️","n":"Mischpult","d":"Vierzig Regler. Im Wald weiß nur einer, wofür sie gut sind."}]}],"guilt":"Kaugummi","clues":[{"t":"Im Kassettenfach der Karaoke-Maschine klebte ein Kaugummi."},{"t":"Detlef stand entweder auf der Bühne oder am Mischpult.","r":["or",["=","Detlef","Bühne"],["=","Detlef","Mischpult"]]},{"t":"Das Akkordeon war auf der Bühne zu hören, leider.","r":["=","Akkordeon","Bühne"]},{"t":"Wer am Bratwurststand war, hatte den Wassereimer. Der Grill brannte nämlich.","r":["=","Bratwurststand","Wassereimer"]},{"t":"Ferdinand saß den ganzen Abend am Mischpult.","r":["=","Ferdinand","Mischpult"]},{"t":"Wer auf der Hüpfburg war, hatte keinen Schraubenzieher. Spitze Gegenstände sind dort verboten.","r":["!","Hüpfburg","Schraubenzieher"]},{"t":"Ingeborg war entweder auf der Hüpfburg oder am Mischpult.","r":["or",["=","Ingeborg","Hüpfburg"],["=","Ingeborg","Mischpult"]]}],"hints":["Ferdinand besetzt das Mischpult. Damit lösen sich beide Entweder-oder-Hinweise sofort auf.","Detlef stand auf der Bühne, Ingeborg war auf der Hüpfburg. Für Wilma bleibt nur ein Ort.","Auf der Hüpfburg gab es keinen Schraubenzieher. Akkordeon und Wassereimer sind vergeben."],"outro":"Ingeborg hatte den Kaugummi. Auf dem Weg zur Hüpfburg wollte sie ihn nur kurz „zwischenparken“, und das Kassettenfach stand gerade offen. Auf der Hüpfburg hat sie eigentlich Hausverbot. Stacheln zählen nämlich auch als spitze Gegenstände. Die Hüpfburg ist jetzt ein Hüpfteppich.","sol":["Ingeborg","Kaugummi","Hüpfburg"]},
{"id":"f6","set":0,"level":3,"title":"Hochzeit am Riff","intro":"Ottilie und Hartmut heiraten. (Wer Fall 3 gelöst hat, kennt die Vorgeschichte.) Seeotter und Hai, das ganze Riff ist gerührt. Dann der Schock. Aus der dreistöckigen Algen-Sahne-Torte fehlt ein riesiges Stück, und zwar bevor das Brautpaar sie anschneiden konnte. Hartmut schwört, dass er es nicht war. Vier Gäste haben ausgesagt, genau eine Person lügt. Wer lügt, hat genascht.","cats":[{"name":"Verdächtige","items":[{"e":"🐙","n":"Konstanze","d":"Krake und Trauzeugin. Hält acht Taschentücher gleichzeitig."},{"e":"🐠","n":"Kevin","d":"Clownfisch und DJ. Seine Witze sind schlechter als seine Musik."},{"e":"🐢","n":"Thusnelda","d":"Schildkröte und Standesbeamtin, 140 Jahre alt. Ihre Trauungen dauern im Schnitt vier Stunden."},{"e":"🐬","n":"Dustin","d":"Delfin und Hochzeitsfotograf. Grinst auf jedem Foto, auch auf denen, die er selbst macht."}]},{"name":"Gegenstand","items":[{"e":"🍰","n":"Tortenheber","d":"Silbern und frisch poliert. Liegt gut in Hand, Flosse und Tentakel."},{"e":"🎉","n":"Konfettikanone","d":"Schießt Konfetti aus getrocknetem Seetang. Biologisch abbaubar."},{"e":"🤿","n":"Schnorchel","d":"Unter Wasser völlig nutzlos. Gilt am Riff trotzdem als schick."},{"e":"🤳","n":"Selfiestick","d":"Ausziehbar bis 1,20 Meter. Trifft dabei meistens einen Nachbarn."}]},{"name":"Ort","items":[{"e":"🍽️","n":"Buffet","d":"Algensalat, Planktonhäppchen und in der Mitte die Torte."},{"e":"🪩","n":"Tanzfläche","d":"Eine Diskokugel aus Perlmutt dreht sich. Die Strömung gibt den Takt vor."},{"e":"📸","n":"Fotobox","d":"Mit Verkleidungskiste. Der Piratenhut ist am beliebtesten."},{"e":"🧥","n":"Garderobe","d":"Hier hängen 200 Jacken, obwohl unter Wasser niemand eine trägt."}]}],"clues":[{"t":"Die Torte stand am Buffet. Wer genascht hat, war dort.","r":["=","@","Buffet"]},{"t":"Am Tortenheber klebte Sahne. Wer genascht hat, hatte ihn in der Hand.","r":["=","@","Tortenheber"]},{"t":"Der Selfiestick war in der Fotobox.","r":["=","Selfiestick","Fotobox"]},{"t":"Auf der Tanzfläche wurde die Konfettikanone abgefeuert, insgesamt elfmal.","r":["=","Konfettikanone","Tanzfläche"]}],"statements":[{"who":"Konstanze","text":"Kevin war in der Garderobe und hat dort für seinen Auftritt geübt.","r":["=","Kevin","Garderobe"]},{"who":"Kevin","text":"Konstanze war auf der Tanzfläche. Acht Arme, null Taktgefühl.","r":["=","Konstanze","Tanzfläche"]},{"who":"Thusnelda","text":"Dustin hatte die Konfettikanone. Ich habe es ganz langsam und deutlich gesehen.","r":["=","Dustin","Konfettikanone"]},{"who":"Dustin","text":"Ich war in der Fotobox, wo denn sonst?","r":["=","Dustin","Fotobox"]}],"hints":["Wer genascht hat, war am Buffet. Welche Aussagen stellen jemanden an einen anderen Ort?","Prüfe jede Person einzeln. Wenn sie lügt, sagen alle anderen die Wahrheit. Passt das zusammen?","Lügt Dustin, dann hätte er laut Thusnelda die Konfettikanone gehabt. Die war aber auf der Tanzfläche."],"outro":"Thusnelda hat gelogen. Sie stand mit dem Tortenheber am Buffet und hat sich ein Stück genehmigt. Aufgefallen ist es nur, weil sie dafür drei Stunden gebraucht hat und immer noch kaute, als die Riffpolizei kam. Ottilie und Hartmut haben ihr verziehen. Die Trauung dauerte danach weitere vier Stunden.","sol":["Thusnelda","Tortenheber","Buffet"]},
{"id":"f7","set":0,"level":4,"title":"Das blaue Lama","intro":"Lothar, das Schulmaskottchen der Tierschule Eichengrund, ist ein Lama. Bis gestern war er beige. Heute Morgen steht er himmelblau im Flur und ist beleidigt. Neben ihm liegen Brezelkrümel. Wer die Brezel gegessen hat, hat auch Lothar gefärbt. Diesmal gibt es drei Dinge zu klären, nämlich Gegenstand, Aufenthaltsort und Pausensnack der schuldigen Person.","cats":[{"name":"Verdächtige","items":[{"e":"🦜","n":"Pedro","d":"Papagei. Wiederholt alles, was man sagt, besonders Geheimnisse."},{"e":"🦫","n":"Birte","d":"Biberin. Hat die Schulbank aus der 6a aufgegessen und nennt das Werken."},{"e":"🦎","n":"Chantal","d":"Chamäleon. Passt sich farblich jeder Ausrede an."},{"e":"🦇","n":"Friedhelm","d":"Fledermaus. Sieht tagsüber fast nichts und gibt das nie zu."}]},{"name":"Gegenstand","items":[{"e":"🖌️","n":"Pinsel","d":"Breit und borstig. Haart mehr als das Lama."},{"e":"🔫","n":"Wasserpistole","d":"Modell „Supernass 3000“. Reichweite acht Meter."},{"e":"🧴","n":"Sprühdose","d":"Himmelblau, seidenmatt. Vor Gebrauch bitte gut schütteln."},{"e":"🪣","n":"Farbeimer","d":"Fünf Liter, ziemlich schwer. Der Henkel schneidet in die Pfote."}]},{"name":"Ort","items":[{"e":"🎨","n":"Kunstraum","d":"Überall Farbkleckse. Den Boden hält man dort für ein Kunstwerk."},{"e":"🛝","n":"Schulhof","d":"Zwei Tischtennisplatten, ein Klettergerüst und ein Dauerstreit um den Ball."},{"e":"🧪","n":"Chemieraum","d":"Riecht nach Schwefel. Die Schutzbrillen sind alle zerkratzt."},{"e":"🍝","n":"Mensa","d":"Heute gibt es Nudeln. Es gibt immer Nudeln."}]},{"name":"Snack","items":[{"e":"🥨","n":"Brezel","d":"Mit grobem Salz. Krümelt bei jedem Bissen."},{"e":"🍎","n":"Apfel","d":"Rotbackig und sehr knackig. Man hört ihn im ganzen Flur."},{"e":"🥕","n":"Möhre","d":"Frisch aus dem Schulgarten und noch ein bisschen erdig."},{"e":"🧀","n":"Käsebrötchen","d":"Doppelt belegt. Riecht bis in den dritten Stock."}]}],"guilt":"Brezel","clues":[{"t":"Neben dem blauen Lama lagen Brezelkrümel."},{"t":"Chantal war in der Mensa.","r":["=","Chantal","Mensa"]},{"t":"Wer den Farbeimer schleppte, war im Kunstraum und aß dabei eine Möhre.","r":["and",["=","Farbeimer","Kunstraum"],["=","Farbeimer","Möhre"]]},{"t":"Pedro aß einen Apfel.","r":["=","Pedro","Apfel"]},{"t":"Die Wasserpistole wurde auf dem Schulhof benutzt.","r":["=","Wasserpistole","Schulhof"]},{"t":"Wer in der Mensa war, aß ein Käsebrötchen. Die Nudeln wollte wieder niemand.","r":["=","Mensa","Käsebrötchen"]},{"t":"Pedro hatte weder Pinsel noch Sprühdose.","r":["and",["!","Pedro","Pinsel"],["!","Pedro","Sprühdose"]]},{"t":"Birte war nicht im Chemieraum. Sie hat dort Hausverbot, seit sie den Labortisch probiert hat.","r":["!","Birte","Chemieraum"]},{"t":"Im Chemieraum wurde kein Pinsel benutzt.","r":["!","Chemieraum","Pinsel"]}],"hints":["Pedro bleibt nur ein einziger Gegenstand.","Pedro war mit der Wasserpistole auf dem Schulhof. Wer kann dann den Farbeimer gehabt haben? Diese Person war im Kunstraum.","Für Friedhelm bleibt der Chemieraum. Dort wurde kein Pinsel benutzt."],"outro":"Friedhelm war es. Er wollte mit der Sprühdose eigentlich die Tür vom Chemieraum blau lackieren, als Überraschung für den Hausmeister. Tagsüber sieht er aber fast nichts. Lothar stand eben ungünstig vor der Tür und hielt still, weil er dachte, es gäbe eine Massage. Die Farbe ist abwaschbar. Lothars Stolz leider weniger.","sol":["Friedhelm","Sprühdose","Chemieraum","Brezel"]},
{"id":"f8","set":0,"level":4,"title":"Die Gurke auf dem Siegerpodest","intro":"Sportfest der Tierschule Eichengrund. Der goldene Pokal steht auf dem Siegerpodest und wartet auf die Siegerehrung. Als Direktorin Dr. Uhu das Tuch wegzieht, liegt dort eine Salatgurke. Der Pokal ist weg. Vier Sportskanonen haben ausgesagt, genau eine Person lügt. Wer lügt, hat den Pokal vertauscht.","cats":[{"name":"Verdächtige","items":[{"e":"🐆","n":"Günther","d":"Gepard. Hat heute zum ersten Mal ein Rennen verloren und spricht nicht darüber."},{"e":"🐌","n":"Sabine","d":"Schnecke. Hat heute zum ersten Mal ein Rennen gewonnen und spricht über nichts anderes."},{"e":"🦘","n":"Kalle","d":"Känguru. Hat einen Beutel und findet, das gehe niemanden etwas an."},{"e":"🦩","n":"Fabienne","d":"Flamingo. Steht seit 2017 auf einem Bein, weil sie das andere schont."}]},{"name":"Gegenstand","items":[{"e":"⏱️","n":"Stoppuhr","d":"Misst auf die Hundertstelsekunde genau. Piept bei jedem Knopfdruck."},{"e":"🪢","n":"Springseil","d":"Drei Meter lang. Verknotet sich sogar im Schrank."},{"e":"🎒","n":"Turnbeutel","d":"Riecht nach Turnhalle. Niemand weiß so genau, was drin ist."},{"e":"📣","n":"Megafon","d":"Macht jede Stimme zehnmal lauter. Leider auch die falschen Töne."}]},{"name":"Ort","items":[{"e":"🏆","n":"Siegerpodest","d":"Drei Stufen. Die oberste ist am rutschigsten."},{"e":"🚿","n":"Umkleide","d":"Riecht nach Deo und nassen Handtüchern. Ein Spind klemmt immer."},{"e":"🏝️","n":"Sandgrube","d":"Weitsprung-Anlage. Der Sand findet seinen Weg in jeden Schuh."},{"e":"🧃","n":"Getränkestand","d":"Apfelschorle für 50 Cent. Der Becher hat Pfand."}]},{"name":"Trikot","items":[{"e":"🔴","n":"Rot","d":"Leuchtet wie eine Tomate. Man sieht es schon vom Parkplatz."},{"e":"🟡","n":"Gelb","d":"Kanariengelb. Zieht im Sommer sämtliche Insekten an."},{"e":"🟢","n":"Grün","d":"Grasgrün. Auf dem Rasen ist man damit fast unsichtbar."},{"e":"🟣","n":"Lila","d":"Kräftiges Lila. Eine Sonderanfertigung auf eigenen Wunsch."}]}],"clues":[{"t":"Am Siegerpodest stand nur eine einzige Person, und die trug laut einer Zeugin ein grünes Trikot.","r":["=","Siegerpodest","Grün"]},{"t":"Wer die Stoppuhr hatte, trug Rot.","r":["=","Stoppuhr","Rot"]},{"t":"Das Megafon war an der Sandgrube im Einsatz.","r":["=","Megafon","Sandgrube"]},{"t":"Fabienne trug Lila, passend zu den Federn. Fast passend.","r":["=","Fabienne","Lila"]}],"statements":[{"who":"Günther","text":"Ich stand am Getränkestand und trug Rot. Ich habe nur getrunken, vier Liter.","r":["and",["=","Günther","Getränkestand"],["=","Günther","Rot"]]},{"who":"Sabine","text":"Fabienne war in der Umkleide. Sie hat zwei Stunden für ein Bein gebraucht.","r":["=","Fabienne","Umkleide"]},{"who":"Kalle","text":"Ich hatte das Springseil. Mehr hatte ich nicht dabei, ehrlich.","r":["=","Kalle","Springseil"]},{"who":"Fabienne","text":"Sabine hatte das Megafon. Man hat sie bis in die Nachbarstadt gehört.","r":["=","Sabine","Megafon"]}],"hints":["Wer Rot trug, hatte die Stoppuhr. Fabienne trug Lila und kann deshalb nicht am Siegerpodest gestanden haben.","Nimm nacheinander an, dass Günther, Sabine oder Fabienne lügt. Jedes Mal landet jemand im falschen Trikot am Siegerpodest oder mit dem Megafon am falschen Ort.","Lügt Sabine, dann bleibt für Fabienne nur das Siegerpodest. Dort trug man aber Grün."],"outro":"Kalle hat gelogen. Ein Springseil hatte er nie, er hatte den Turnbeutel, und im Turnbeutel steckte der Pokal. „Ich wollte ihn nur mal halten“, sagte er. „Ich werde immer Vierter.“ Die Gurke stammt aus seinem Pausenbrot. Dr. Uhu hat entschieden, dass es ab sofort auch einen Pokal für Platz vier gibt. Er hat die Form einer Gurke.","sol":["Kalle","Turnbeutel","Siegerpodest","Grün"]},
{"id":"f9","set":0,"level":5,"title":"Der Knochen aus Saal 3","intro":"Naturkundemuseum, lange nach Feierabend. Um 22 Uhr schrillt der Alarm. Dem Brachiosaurus fehlt ein Oberschenkelknochen, zwei Meter lang und rund 150 Millionen Jahre alt. Vier Tiere waren an diesem Abend im Haus, jedes zu einer anderen vollen Stunde und an genau einem Ort. Wer um 22 Uhr da war, hat den Knochen.","cats":[{"name":"Verdächtige","items":[{"e":"🐕","n":"Dagobert","d":"Dackel und Nachtwächter. Sehr pflichtbewusst, solange es nichts zu apportieren gibt."},{"e":"🐦","n":"Elsbeth","d":"Elster. Sammelt alles, was glänzt, und nennt es Leihgabe."},{"e":"🐈","n":"Karlo","d":"Kater. Schläft 18 Stunden am Tag und ist in den übrigen sechs müde."},{"e":"🐀","n":"Roswitha","d":"Ratte und Museumsführerin. Kennt jeden Gang, auch die in den Wänden."}]},{"name":"Gegenstand","items":[{"e":"🔦","n":"Taschenlampe","d":"Der Lichtkegel flackert. Die Batterien sind fast leer."},{"e":"🪶","n":"Staubwedel","d":"Aus echten Straußenfedern. Kitzelt beim Staubwischen in der Nase."},{"e":"🪜","n":"Leiter","d":"Aus Aluminium. Hat acht Sprossen, eine davon wackelt."},{"e":"🔍","n":"Lupe","d":"Vergrößert zehnfach. Riesig wirkt damit vor allem das eigene Auge."}]},{"name":"Ort","items":[{"e":"🦕","n":"Dinosauriersaal","d":"Saal 3. Das Skelett des Brachiosaurus reicht bis unter die Decke."},{"e":"🏺","n":"Ägyptensaal","d":"Sarkophage, Hieroglyphen und eine Mumie, die angeblich manchmal niest."},{"e":"🛍️","n":"Museumsshop","d":"Radiergummis in Dinoform, Postkarten und Plüschtiere mit Preisschild."},{"e":"🕸️","n":"Dachboden","d":"Spinnweben, alte Kisten und ein ausgestopfter Dodo mit strengem Blick."}]},{"name":"Uhrzeit","items":[{"e":"🕗","n":"20 Uhr","d":"Das Museum hat gerade geschlossen. Die letzte Schulklasse ist weg."},{"e":"🕘","n":"21 Uhr","d":"Der Putzdienst ist durch. In den Sälen brennt nur noch Notlicht."},{"e":"🕙","n":"22 Uhr","d":"Es ist stockdunkel. Genau jetzt schrillt der Alarm."},{"e":"🕚","n":"23 Uhr","d":"Die Polizei ist unterwegs. Im Gebälk knackt es."}]}],"guilt":"22 Uhr","clues":[{"t":"Der Alarm ging um 22 Uhr los."},{"t":"Elsbeth war als Erste im Haus, nämlich schon um 20 Uhr.","r":["=","Elsbeth","20 Uhr"]},{"t":"Die Leiter wurde genau eine Stunde nach Elsbeths Besuch benutzt.","r":["+","Elsbeth","Leiter",1,"Uhrzeit"]},{"t":"Wer die Taschenlampe hatte, kam später als die Person mit dem Staubwedel.","r":["<","Staubwedel","Taschenlampe","Uhrzeit"]},{"t":"Wer um 23 Uhr kam, war auf dem Dachboden. Dort knarrte es.","r":["=","23 Uhr","Dachboden"]},{"t":"Roswitha war im Ägyptensaal und kam früher als Dagobert.","r":["and",["=","Roswitha","Ägyptensaal"],["<","Roswitha","Dagobert","Uhrzeit"]]},{"t":"Im Museumsshop hat jemand mit der Lupe die Preisschilder studiert.","r":["=","Museumsshop","Lupe"]},{"t":"Karlo hatte weder Leiter noch Staubwedel. Beides riecht nach Arbeit.","r":["and",["!","Karlo","Leiter"],["!","Karlo","Staubwedel"]]},{"t":"Elsbeth hatte keinen Staubwedel. Fremde Federn findet sie unheimlich.","r":["!","Elsbeth","Staubwedel"]}],"hints":["Elsbeth kam um 20 Uhr, die Leiter um 21 Uhr. Wer kann die Leiter gehabt haben?","Karlo trägt keine Leiter, und Roswitha kam vor Dagobert. Also war Roswitha um 21 Uhr da.","Elsbeth kam als Erste. Die Taschenlampe kann sie deshalb nicht gehabt haben, den Staubwedel auch nicht."],"outro":"Dagobert, der Nachtwächter persönlich. Um 22 Uhr wollte er im Dinosauriersaal nur Staub wedeln. Dann stand er vor dem größten Knochen seines Lebens. „Ich bin auch nur ein Hund“, sagte er bei der Vernehmung. Der Knochen wurde im Museumsgarten gefunden, ordentlich vergraben und mit einem Schildchen versehen. Darauf stand „Für später“.","sol":["Dagobert","Staubwedel","Dinosauriersaal","22 Uhr"]},
{"id":"f10","set":0,"level":5,"title":"Die Goldene Gurke","intro":"Gala der Meisterdetektive. Der Ehrenpreis des Abends ist die Goldene Gurke, gestiftet von Direktorin Dr. Uhu (siehe Fall 8). Als der Tresor geöffnet wird, ist er leer. Auf der Gästeliste stehen ausgerechnet fünf alte Bekannte, die alle schon einmal etwas angestellt haben. Jede Person kam zu einer anderen vollen Stunde und blieb an einem Ort. Fünf Aussagen, genau eine ist gelogen. Wer lügt, hat die Gurke.","cats":[{"name":"Verdächtige","items":[{"e":"🐧","n":"Pauli","d":"Pinguin, bekannt aus Fall 1. Beteuert, er sei „resozialisiert“, und kann das Wort sogar buchstabieren."},{"e":"🐡","n":"Gisela","d":"Kugelfisch, bekannt aus Fall 3. Hat die Einladungskarte korrigiert zurückgeschickt."},{"e":"🐐","n":"Zora","d":"Ziege, bekannt aus Fall 4. Wurde gebeten, die Tischdeko nicht zu essen."},{"e":"🐕","n":"Dagobert","d":"Dackel, bekannt aus Fall 9. Arbeitet inzwischen im Museumsgarten, unter Aufsicht."},{"e":"🦘","n":"Kalle","d":"Känguru, bekannt aus Fall 8. Besitzt seit Kurzem einen Pokal in Gurkenform."}]},{"name":"Gegenstand","items":[{"e":"🎩","n":"Zylinder","d":"Schwarz, hoch und innen hohl. Bei Zauberern sehr beliebt."},{"e":"🎀","n":"Glitzerfliege","d":"Besteht aus 400 Pailletten. Blendet bei direktem Licht."},{"e":"🥂","n":"Kindersekt","d":"Prickelt wie echter Sekt und schmeckt nach Traube."},{"e":"🎈","n":"Luftballon","d":"Goldfarben, mit Helium gefüllt. Hält eine Schnur und sonst nichts aus."},{"e":"🎻","n":"Geigenkasten","d":"Lang, schwarz und abschließbar. Bietet Platz für eine Geige oder für etwas Ähnliches."}]},{"name":"Ort","items":[{"e":"🟥","n":"Roter Teppich","d":"Zwanzig Meter Samt. Links und rechts warten die Fotografen."},{"e":"💃","n":"Ballsaal","d":"Kronleuchter, Parkett und ein Streichquartett, das nur Walzer kann."},{"e":"🍳","n":"Küche","d":"Hier werden 300 Häppchen angerichtet. Zutritt nur mit Kochmütze."},{"e":"🌙","n":"Balkon","d":"Mit Blick auf den Stadtpark. Abends wird es dort kühl."},{"e":"🔐","n":"Tresorraum","d":"Stahltür, Zahlenschloss und drinnen ein Samtkissen in Gurkenform."}]},{"name":"Uhrzeit","items":[{"e":"🕕","n":"18 Uhr","d":"Einlass. Die Garderobe ist noch leer."},{"e":"🕖","n":"19 Uhr","d":"Sektempfang. Die ersten Häppchen sind schon weg."},{"e":"🕗","n":"20 Uhr","d":"Die Eröffnungsrede beginnt. Sie dauert länger als geplant."},{"e":"🕘","n":"21 Uhr","d":"Das Streichquartett spielt den dritten Walzer."},{"e":"🕙","n":"22 Uhr","d":"Gleich soll die Preisverleihung beginnen."}]}],"clues":[{"t":"Zora kam als Erste, schon um 18 Uhr, und wich den ganzen Abend nicht von der Tanzfläche im Ballsaal.","r":["and",["=","Zora","18 Uhr"],["=","Zora","Ballsaal"]]},{"t":"Wer den Zylinder trug, kam genau eine Stunde nach Zora.","r":["+","Zora","Zylinder",1,"Uhrzeit"]},{"t":"Die Person im Tresorraum kam später als die Person in der Küche, aber früher als die Person auf dem Balkon.","r":["and",["<","Küche","Tresorraum","Uhrzeit"],["<","Tresorraum","Balkon","Uhrzeit"]]},{"t":"Der Luftballon schwebte über dem Balkon.","r":["=","Luftballon","Balkon"]},{"t":"Wer als Letztes kam, blieb gleich auf dem roten Teppich stehen und posierte.","r":["=","22 Uhr","Roter Teppich"]},{"t":"Im Ballsaal wurde Kindersekt getrunken.","r":["=","Ballsaal","Kindersekt"]},{"t":"Dagobert hatte keinen Geigenkasten. Mit so kurzen Beinen schleift der nur über den Boden.","r":["!","Dagobert","Geigenkasten"]},{"t":"Gisela hatte weder Geigenkasten noch Glitzerfliege.","r":["and",["!","Gisela","Geigenkasten"],["!","Gisela","Glitzerfliege"]]}],"statements":[{"who":"Pauli","text":"Ich war in der Küche. Nur gucken, nichts anfassen. Ehrenwort!","r":["=","Pauli","Küche"]},{"who":"Gisela","text":"Dagobert kam als Letzter. Unpünktlichkeit schreibt man übrigens mit ü.","r":["=","Dagobert","22 Uhr"]},{"who":"Zora","text":"Pauli trug den Zylinder. Der sah lecker aus.","r":["=","Pauli","Zylinder"]},{"who":"Dagobert","text":"Gisela kam später als Kalle. Ich habe beide am Geruch erkannt.","r":["<","Kalle","Gisela","Uhrzeit"]},{"who":"Kalle","text":"Ich hatte den Luftballon dabei. Für die Stimmung.","r":["=","Kalle","Luftballon"]}],"hints":["Ordne zuerst die Uhrzeiten. Zora kam um 18 Uhr, der Zylinder um 19 Uhr, die letzte Person stand auf dem roten Teppich.","Küche, Tresorraum und Balkon liegen in dieser Reihenfolge bei 19, 20 und 21 Uhr. Der Zylinder war also in der Küche.","Gisela darf weder im Tresorraum noch auf dem roten Teppich landen. Prüfe, ob das noch aufgeht, wenn Kalle wirklich den Luftballon hatte."],"outro":"Kalle hat gelogen. Einen Luftballon hatte er nie. Er stand um 20 Uhr mit dem Geigenkasten im Tresorraum, und im Kasten lag die Goldene Gurke, direkt neben seinem Pokal in Gurkenform. „Ich wollte, dass er nicht mehr so allein ist“, schluchzte Kalle. Die Jury war gerührt und stellte beide Gurken nebeneinander aus. Pauli war tatsächlich unschuldig. In der Küche fehlen seitdem allerdings 37 Fischstäbchen. Die Ermittlungen laufen.","sol":["Kalle","Geigenkasten","Tresorraum","20 Uhr"]},
{"id":"b1","set":1,"level":1,"title":"Der Pudding des Königs","intro":"Burg Bröselstein, kurz vor dem Festmahl. König Kasimir der Hungrige freut sich seit drei Tagen auf seinen Vanillepudding. Jetzt steht in der Burgküche nur noch die leere Schüssel, sauber ausgeleckt. Wer in der Burgküche war, hat den Pudding verputzt.","cats":[{"name":"Verdächtige","items":[{"e":"🛡️","n":"Kunibert","d":"Ritter. Seine Rüstung quietscht so laut, dass er noch nie jemanden überrascht hat."},{"e":"🃏","n":"Trixi","d":"Hofnärrin. Lacht über ihre eigenen Witze am lautesten."},{"e":"🐉","n":"Fauchi","d":"Burgdrache. Speit kein Feuer mehr, seit er auf Kamillentee umgestiegen ist."}]},{"name":"Gegenstand","items":[{"e":"🥄","n":"Löffel","d":"Aus Holz und so groß wie ein Paddel. Eigentlich für den Suppenkessel gedacht."},{"e":"🪕","n":"Laute","d":"Hat nur noch vier Saiten. Für Trixis Lieder reichen zwei."},{"e":"🪖","n":"Helm","d":"Mit Federbusch. Innen überraschend geräumig."}]},{"name":"Ort","items":[{"e":"🍲","n":"Burgküche","d":"Hier brodelt immer irgendwas. Meistens ist es Rübensuppe."},{"e":"🏰","n":"Turm","d":"Hat 117 Stufen und oben ein Fenster ohne Scheibe."},{"e":"🐴","n":"Stall","d":"Riecht nach Heu. Die Pferde heißen alle Blitz."}]}],"guilt":"Burgküche","clues":[{"t":"Der Pudding verschwand aus der Burgküche."},{"t":"Trixi übte den ganzen Nachmittag oben auf dem Turm ihre Witze.","r":["=","Trixi","Turm"]},{"t":"Wer den Löffel dabeihatte, war im Stall.","r":["=","Löffel","Stall"]},{"t":"Fauchi hatte keinen Löffel. Seine Krallen sind zu groß für den Stiel.","r":["!","Fauchi","Löffel"]},{"t":"Trixi trug keinen Helm. Die Narrenkappe passt nicht darunter.","r":["!","Trixi","Helm"]}],"hints":["Fang mit dem Löffel an. Wer kann ihn gehabt haben?","Trixi war auf dem Turm, Fauchi kann keinen Löffel halten. Der Löffel war also bei Kunibert im Stall.","Für Fauchi bleibt nur die Burgküche. Trixi trug keinen Helm."],"outro":"Fauchi war in der Burgküche. Den Pudding hat er in Kuniberts Helm gekippt und in einem Zug ausgeschlürft. „Drachen brauchen Nachtisch“, erklärte er und rülpste eine kleine Vanillewolke. Kunibert hat im Stall sein Pferd mit dem Löffel gefüttert und sucht seitdem seinen Helm.","sol":["Fauchi","Helm","Burgküche"]},
{"id":"b2","set":1,"level":3,"title":"Die Baguette-Lanze","intro":"Großes Ritterturnier auf Burg Bröselstein. Ritter Kunibert reitet an, senkt die Lanze und stellt fest, dass er ein Baguette in der Hand hält. Es ist knusprig, aber als Waffe ungeeignet. Die echte Lanze lag bis zum Morgen in der Rüstkammer. Wer in der Rüstkammer war, hat sie vertauscht.","cats":[{"name":"Verdächtige","items":[{"e":"👸","n":"Adelheid","d":"Burgfräulein. Strickt Schals für alle, auch für die Kanonen."},{"e":"🧒","n":"Wenzel","d":"Knappe. Soll Rüstungen polieren und poliert lieber seine Ausreden."},{"e":"👩‍🍳","n":"Brunhilde","d":"Burgköchin. Kocht seit 30 Jahren Rübensuppe und nennt sie jeden Tag anders."},{"e":"🧙","n":"Balduin","d":"Hofzauberer. Kann Wasser in Wasser verwandeln."}]},{"name":"Gegenstand","items":[{"e":"🧶","n":"Strickzeug","d":"Zwei Nadeln und ein Knäuel in Rosa. Der Schal ist schon elf Meter lang."},{"e":"🪄","n":"Zauberstab","d":"Funkt beim Schwingen. Meistens passiert danach nichts."},{"e":"🧺","n":"Wäschekorb","d":"Randvoll mit nassen Socken. Sie gehören alle dem König."},{"e":"🥄","n":"Suppenkelle","d":"Fasst einen halben Liter. Riecht für immer nach Rüben."}]},{"name":"Ort","items":[{"e":"⚔️","n":"Rüstkammer","d":"Schwerter, Schilde und eine Lanze. Normalerweise."},{"e":"🐸","n":"Burggraben","d":"Grünes Wasser und sehr viele Frösche. Einer behauptet, ein Prinz zu sein."},{"e":"👑","n":"Thronsaal","d":"Der Thron hat ein Sitzkissen. Der König besteht darauf."},{"e":"🥖","n":"Backstube","d":"Hier duftet es nach frischem Brot. Heute fehlt ein Baguette."}]}],"guilt":"Rüstkammer","clues":[{"t":"Die Lanze wurde in der Rüstkammer gegen ein Baguette getauscht."},{"t":"Brunhilde war entweder in der Backstube oder am Burggraben.","r":["or",["=","Brunhilde","Backstube"],["=","Brunhilde","Burggraben"]]},{"t":"Wer den Zauberstab hatte, war in der Backstube.","r":["=","Zauberstab","Backstube"]},{"t":"Adelheid saß den ganzen Vormittag im Thronsaal.","r":["=","Adelheid","Thronsaal"]},{"t":"Am Burggraben wurde kein Wäschekorb gesehen.","r":["!","Burggraben","Wäschekorb"]},{"t":"Balduin war entweder im Thronsaal oder in der Backstube.","r":["or",["=","Balduin","Thronsaal"],["=","Balduin","Backstube"]]},{"t":"Im Thronsaal klapperten Stricknadeln.","r":["=","Thronsaal","Strickzeug"]}],"hints":["Adelheid besetzt den Thronsaal. Damit lösen sich beide Entweder-oder-Hinweise auf.","Balduin war in der Backstube, Brunhilde am Burggraben. Für Wenzel bleibt nur ein Ort.","Am Burggraben gab es keinen Wäschekorb, und Strickzeug und Zauberstab sind vergeben. Was hatte Brunhilde dabei?"],"outro":"Wenzel war mit dem Wäschekorb in der Rüstkammer. Er brauchte dringend eine Stange für die nassen Socken des Königs, und die Lanze war genau lang genug. Damit niemand etwas merkt, legte er ein Baguette an ihren Platz. Kunibert hat das Turnier trotzdem gewonnen. Sein Gegner musste so lachen, dass er vom Pferd fiel.","sol":["Wenzel","Wäschekorb","Rüstkammer"]},
{"id":"b3","set":1,"level":4,"title":"Der klebrige Thron","intro":"König Kasimir will aufstehen und kann nicht. Jemand hat den Thron mit Honig bestrichen, und zwar gründlich. Der König klebt seit gestern fest und ist entsprechend gelaunt. Gestern war jede der vier verdächtigen Personen zu einer anderen Tageszeit unterwegs und blieb an einem Ort. Vier Aussagen, genau eine ist gelogen. Wer lügt, hat den Honig verteilt.","cats":[{"name":"Verdächtige","items":[{"e":"🛡️","n":"Kunibert","d":"Ritter. Fegt freiwillig den Burghof, weil er dabei so schön nachdenken kann."},{"e":"🃏","n":"Trixi","d":"Hofnärrin. Findet, ein König, der nicht aufstehen kann, sei der beste Witz des Jahres."},{"e":"🐉","n":"Fauchi","d":"Burgdrache. Schläft tagsüber und ist nachts für die Beleuchtung zuständig."},{"e":"🧙","n":"Balduin","d":"Hofzauberer. Sucht seit Jahren den Burgschatz und findet immer nur seine Brille."}]},{"name":"Gegenstand","items":[{"e":"🍯","n":"Honigtopf","d":"Waldhonig, extra zäh. Der Deckel fehlt."},{"e":"🧹","n":"Besen","d":"Verliert bei jedem Schwung drei Borsten."},{"e":"🔥","n":"Fackel","d":"Brennt etwa zwei Stunden. Raucht dabei für vier."},{"e":"🗺️","n":"Schatzkarte","d":"Zeigt ein großes X. Leider ohne den Rest der Karte."}]},{"name":"Ort","items":[{"e":"👑","n":"Thronsaal","d":"Hier steht der Thron. Seit Neuestem glänzt er verdächtig."},{"e":"⛓️","n":"Verlies","d":"Feucht und dunkel. Einziger Gefangener ist ein beleidigter Kürbis."},{"e":"🏰","n":"Burghof","d":"Kopfsteinpflaster, ein Brunnen und sehr viel Laub."},{"e":"📜","n":"Turmzimmer","d":"Balduins Studierstube. Überall Zettel, auf denen „Nicht vergessen“ steht."}]},{"name":"Tageszeit","items":[{"e":"🐓","n":"Hahnenschrei","d":"Der Hahn kräht um fünf. Beliebt macht ihn das nicht."},{"e":"🔔","n":"Mittagsläuten","d":"Zwölf Schläge. Danach gibt es Rübensuppe."},{"e":"🍞","n":"Abendbrot","d":"Brot, Käse und die Reste der Rübensuppe."},{"e":"🌙","n":"Mitternacht","d":"Die Burg schläft. Nur die Eulen haben Dienst."}]}],"clues":[{"t":"Der Thron steht im Thronsaal. Wer den Honig verteilt hat, war also dort.","r":["=","@","Thronsaal"]},{"t":"Wer die Fackel trug, war erst um Mitternacht unterwegs.","r":["=","Fackel","Mitternacht"]},{"t":"Der Besen war früher im Einsatz als der Honigtopf.","r":["<","Besen","Honigtopf","Tageszeit"]},{"t":"Die Schatzkarte lag im Turmzimmer.","r":["=","Schatzkarte","Turmzimmer"]},{"t":"Wer im Turmzimmer war, kam zum Abendbrot.","r":["=","Turmzimmer","Abendbrot"]}],"statements":[{"who":"Kunibert","text":"Fauchi kam erst um Mitternacht. Vorher schnarcht er, das hört man bis in den Hof.","r":["=","Fauchi","Mitternacht"]},{"who":"Trixi","text":"Ich war im Verlies und habe dem Kürbis Witze erzählt.","r":["=","Trixi","Verlies"]},{"who":"Fauchi","text":"Balduin hatte die Schatzkarte. Er hielt sie verkehrt herum.","r":["=","Balduin","Schatzkarte"]},{"who":"Balduin","text":"Kunibert stand mit dem Besen im Burghof. Es hat bis zu mir hochgestaubt.","r":["and",["=","Kunibert","Besen"],["=","Kunibert","Burghof"]]}],"hints":["Wer lügt, war im Thronsaal. Prüfe, wen eine andere Aussage an einen anderen Ort stellt.","Balduin stellt Kunibert in den Burghof. Die Schatzkarte lag im Turmzimmer, und Fauchi gibt sie Balduin. Beide können also nicht im Thronsaal gewesen sein.","Bleiben Trixi und Fauchi. Lügt Fauchi, dann hätte Balduin die Schatzkarte nicht gehabt und wäre trotzdem im Turmzimmer gelandet. Das passt nicht zusammen."],"outro":"Trixi hat gelogen. Im Verlies war sie nie, dort saß Fauchi mit seiner Fackel und leistete dem Kürbis Gesellschaft. Trixi schlich zum Mittagsläuten mit dem Honigtopf in den Thronsaal. „Ein König, der sitzen bleibt, hört meine Witze endlich mal bis zum Ende“, sagte sie. Der König hat inzwischen alle 214 gehört. Er wünscht sich die Rübensuppe zurück.","sol":["Trixi","Honigtopf","Thronsaal","Mittagsläuten"]},
{"id":"r1","set":2,"level":2,"title":"Schwebende Spaghetti","intro":"Raumstation Kartoffel 7, Mittagspause. Plötzlich schweben die Spaghetti aus den Tellern, die Soße hinterher. Jemand hat auf der Kommandobrücke die künstliche Schwerkraft ausgeschaltet. Drei Besatzungsmitglieder haben ausgesagt. Zwei sagen die Wahrheit, eine Person lügt. Wer lügt, hat den Knopf gedrückt.","cats":[{"name":"Verdächtige","items":[{"e":"🤖","n":"Rosti","d":"Bordroboter. Rostet bei Stress und piept, wenn ihm etwas peinlich ist."},{"e":"👽","n":"Glibb","d":"Austauschschüler vom Planeten Blubb. Hat drei Augen und trotzdem nie etwas gesehen."},{"e":"👩‍🚀","n":"Luna","d":"Kapitänin. Hat die Station nach ihrem Lieblingsgemüse benannt."}]},{"name":"Gegenstand","items":[{"e":"🔧","n":"Schraubenschlüssel","d":"Größe 13. Passt auf jede Schraube, die gerade nicht locker ist."},{"e":"🧴","n":"Sprühflasche","d":"Mit Wasser gefüllt. Im All sprüht sie in alle Richtungen gleichzeitig."},{"e":"🎧","n":"Kopfhörer","d":"Spielen Walgesänge. Glibb hält das für Nachrichten von zu Hause."}]},{"name":"Ort","items":[{"e":"🕹️","n":"Kommandobrücke","d":"Hundert Knöpfe. Der große rote ist für die Schwerkraft."},{"e":"🌱","n":"Gewächshaus","d":"Hier wachsen Tomaten, Salat und eine sehr ehrgeizige Kartoffel."},{"e":"🛏️","n":"Schlafkabine","d":"Schlafsäcke an der Wand. Wer sich nicht anschnallt, wacht woanders auf."}]}],"clues":[{"t":"Der Schwerkraftknopf ist auf der Kommandobrücke. Wer ihn gedrückt hat, war dort.","r":["=","@","Kommandobrücke"]},{"t":"Die Sprühflasche war im Gewächshaus.","r":["=","Sprühflasche","Gewächshaus"]},{"t":"Der Schraubenschlüssel lag in der Schlafkabine. Dort klemmt ein Schlafsack.","r":["=","Schraubenschlüssel","Schlafkabine"]}],"statements":[{"who":"Rosti","text":"Luna war im Gewächshaus und hat die Tomaten besprüht.","r":["=","Luna","Gewächshaus"]},{"who":"Glibb","text":"Ich war in der Schlafkabine. Alle drei Augen zu.","r":["=","Glibb","Schlafkabine"]},{"who":"Luna","text":"Glibb hatte die Kopfhörer auf. Man hat die Wale bis in den Flur gehört.","r":["=","Glibb","Kopfhörer"]}],"hints":["Aus den Hinweisen folgt, welcher Gegenstand auf der Kommandobrücke war.","Auf der Brücke waren die Kopfhörer. Nimm an, Rosti lügt. Was sagt Luna dazu?","Lügt Luna, dann widerspricht ihr Rosti. Es bleibt nur eine Person."],"outro":"Glibb hat gelogen. Er saß mit Kopfhörern auf der Kommandobrücke und wollte nur die Lautstärke hochdrehen. Der große rote Knopf sah für ihn genauso aus wie alle anderen. Die Spaghetti wurden mit dem Staubsauger eingefangen. Sie schmecken jetzt ein bisschen nach Teppich.","sol":["Glibb","Kopfhörer","Kommandobrücke"]},
{"id":"r2","set":2,"level":3,"title":"Die leere Keksdose","intro":"In der Bordküche der Kartoffel 7 steht die Keksdose mit dem Notvorrat, 200 Schokokekse für schlechte Tage. Heute ist die Dose leer. Das Türprotokoll zeigt, dass in jeder Schicht genau ein Besatzungsmitglied in der Küche war. Der Krümelsensor schlug in der Spätschicht an. Wer in der Spätschicht kam, hat die Kekse gegessen. Diesmal gibt es keine Orte, dafür eine Reihenfolge.","cats":[{"name":"Verdächtige","items":[{"e":"🤖","n":"Rosti","d":"Bordroboter. Isst offiziell nichts. Inoffiziell hat er ein Krümelfach."},{"e":"👽","n":"Glibb","d":"Austauschschüler vom Planeten Blubb. Trinkt alles durch den Strohhalm, auch Suppe."},{"e":"👩‍🚀","n":"Luna","d":"Kapitänin. Hat den Notvorrat persönlich abgezählt, zweimal."},{"e":"🐈‍⬛","n":"Komet","d":"Bordkatze. Schwebt am liebsten quer durch den Flur und tut, als wäre das Absicht."}]},{"name":"Gegenstand","items":[{"e":"🥾","n":"Magnetstiefel","d":"Halten an jeder Wand. Das Ausziehen dauert zehn Minuten."},{"e":"🔦","n":"Taschenlampe","d":"Für Stromausfälle. Im All sind die besonders dunkel."},{"e":"🥤","n":"Strohhalm","d":"Dreifach geknickt und einen halben Meter lang."},{"e":"🧶","n":"Wollknäuel","d":"Rot und ziemlich zerzaust. Schwebt gern davon."}]},{"name":"Schicht","items":[{"e":"🌅","n":"Frühschicht","d":"Beginnt mit Kaffee aus der Tube."},{"e":"☀️","n":"Mittagsschicht","d":"Es gibt Spaghetti, wenn sie auf dem Teller bleiben."},{"e":"🌇","n":"Spätschicht","d":"Die Station wird ruhig. In der Küche knistert es."},{"e":"🌙","n":"Nachtschicht","d":"Alle schlafen. Fast alle."}]}],"guilt":"Spätschicht","clues":[{"t":"Der Krümelsensor schlug in der Spätschicht an."},{"t":"Glibb kam in der Nachtschicht.","r":["=","Glibb","Nachtschicht"]},{"t":"Wer in der Nachtschicht kam, hatte den Strohhalm dabei.","r":["=","Nachtschicht","Strohhalm"]},{"t":"Rosti kam genau eine Schicht nach Luna.","r":["+","Luna","Rosti",1,"Schicht"]},{"t":"Die Magnetstiefel waren früher in der Küche als das Wollknäuel.","r":["<","Magnetstiefel","Wollknäuel","Schicht"]},{"t":"Rosti hatte weder Taschenlampe noch Wollknäuel. Wolle verheddert sich in seinen Zahnrädern.","r":["and",["!","Rosti","Taschenlampe"],["!","Rosti","Wollknäuel"]]},{"t":"Komet hatte keine Taschenlampe. Er sieht im Dunkeln bestens.","r":["!","Komet","Taschenlampe"]}],"hints":["Glibb hatte den Strohhalm. Was bleibt dann für Rosti übrig?","Rosti trug die Magnetstiefel, Komet hatte das Wollknäuel. Rosti kam also vor Komet.","Luna, Rosti und Komet teilen sich Früh-, Mittags- und Spätschicht. Rosti kam direkt nach Luna und vor Komet."],"outro":"Komet war in der Spätschicht in der Küche. Eigentlich jagte er nur seinem Wollknäuel hinterher, und das schwebte ausgerechnet in die Keksdose. „Die Kekse standen im Weg“, hätte er gesagt, wenn Katzen etwas sagen würden. Luna hat einen neuen Notvorrat bestellt. Die Lieferung dauert vier Monate.","sol":["Komet","Wollknäuel","Spätschicht"]},
{"id":"r3","set":2,"level":5,"title":"Der reimende Bordcomputer","intro":"Seit heute Nachmittag antwortet der Bordcomputer der Kartoffel 7 nur noch in Reimen. Auf die Frage nach dem Kurs sagt er: „Ich flieg mal hier, ich flieg mal dort, Hauptsache, wir sind bald fort.“ Jemand hat im Computerraum an den Einstellungen gedreht. Fünf Besatzungsmitglieder waren unterwegs, jedes zu einer anderen vollen Stunde und an genau einem Ort. Wer im Computerraum war, ist schuld am Gedicht.","cats":[{"name":"Verdächtige","items":[{"e":"🤖","n":"Rosti","d":"Bordroboter. Hält den Bordcomputer für seinen großen Bruder."},{"e":"👽","n":"Glibb","d":"Austauschschüler vom Planeten Blubb. Lernt gerade Deutsch und hat sechs Ellenbogen."},{"e":"👩‍🚀","n":"Luna","d":"Kapitänin. Möchte einfach nur wissen, wohin die Station fliegt."},{"e":"🐈‍⬛","n":"Komet","d":"Bordkatze. Läuft gern über Tastaturen und schaut dabei unschuldig."},{"e":"🧑‍🔬","n":"Quark","d":"Bordwissenschaftler. Erforscht, warum Toast auch im All auf die Butterseite fällt."}]},{"name":"Gegenstand","items":[{"e":"🔧","n":"Schraubenschlüssel","d":"Größe 13. Rostis liebstes Werkzeug."},{"e":"🎧","n":"Kopfhörer","d":"Spielen immer noch Walgesänge."},{"e":"🧶","n":"Wollknäuel","d":"Inzwischen voller Kekskrümel."},{"e":"🧪","n":"Reagenzglas","d":"Der Inhalt ist grün und blubbert. Niemand weiß, ob das so sein soll."},{"e":"🍌","n":"Banane","d":"Schon etwas braun. Im All reift alles schneller, sagt Quark."}]},{"name":"Ort","items":[{"e":"💻","n":"Computerraum","d":"Blinkende Lichter und eine Tastatur mit 400 Tasten."},{"e":"🌱","n":"Gewächshaus","d":"Die ehrgeizige Kartoffel ist inzwischen so groß wie ein Fußball."},{"e":"🍽️","n":"Bordküche","d":"Die Keksdose ist immer noch leer."},{"e":"🚪","n":"Luftschleuse","d":"Zwei Türen. Es darf immer nur eine offen sein."},{"e":"🔭","n":"Sternwarte","d":"Ein Fernrohr und ein Sitzsack. Der Sitzsack wird öfter benutzt."}]},{"name":"Uhrzeit","items":[{"e":"🕐","n":"13 Uhr","d":"Die Mittagspause ist vorbei."},{"e":"🕑","n":"14 Uhr","d":"Zeit für das tägliche Funkgespräch mit der Erde."},{"e":"🕒","n":"15 Uhr","d":"Kaffeepause. Der Kaffee kommt aus der Tube."},{"e":"🕓","n":"16 Uhr","d":"Die Sonne geht auf, zum elften Mal an diesem Tag."},{"e":"🕔","n":"17 Uhr","d":"Schichtwechsel. Niemand will die Spätschicht."}]}],"guilt":"Computerraum","clues":[{"t":"Am Bordcomputer wurde im Computerraum gedreht."},{"t":"Rosti war als Erster unterwegs, schon um 13 Uhr.","r":["=","Rosti","13 Uhr"]},{"t":"Rosti war nicht in der Sternwarte. Sternenlicht blendet seine Sensoren.","r":["!","Rosti","Sternwarte"]},{"t":"Das Reagenzglas war im Gewächshaus.","r":["=","Reagenzglas","Gewächshaus"]},{"t":"Wer in der Sternwarte war, kam genau eine Stunde vor der Person im Gewächshaus.","r":["+","Sternwarte","Gewächshaus",1,"Uhrzeit"]},{"t":"Im Computerraum war jemand später als im Gewächshaus.","r":["<","Gewächshaus","Computerraum","Uhrzeit"]},{"t":"Wer als Letztes unterwegs war, um 17 Uhr, ging in die Bordküche.","r":["=","17 Uhr","Bordküche"]},{"t":"In der Bordküche lag ein Wollknäuel.","r":["=","Bordküche","Wollknäuel"]},{"t":"Rosti hatte seinen Schraubenschlüssel dabei.","r":["=","Rosti","Schraubenschlüssel"]},{"t":"Luna hatte die Kopfhörer auf und kam früher als Quark.","r":["and",["=","Luna","Kopfhörer"],["<","Luna","Quark","Uhrzeit"]]},{"t":"Glibb hatte weder Reagenzglas noch Wollknäuel.","r":["and",["!","Glibb","Reagenzglas"],["!","Glibb","Wollknäuel"]]},{"t":"Komet hatte kein Reagenzglas. Er hat einmal daran geschnuppert, das reicht ihm.","r":["!","Komet","Reagenzglas"]}],"hints":["Ordne zuerst die Orte nach Uhrzeiten. Die Bordküche liegt bei 17 Uhr, und Sternwarte, Gewächshaus und Computerraum kommen in dieser Reihenfolge.","Rosti kam um 13 Uhr und war nicht in der Sternwarte. Also war er in der Luftschleuse. Sternwarte, Gewächshaus und Computerraum liegen damit bei 14, 15 und 16 Uhr.","Im Gewächshaus war das Reagenzglas, in der Bordküche das Wollknäuel. Komet und Glibb scheiden für das Reagenzglas aus. Luna kam früher als Quark."],"outro":"Glibb war um 16 Uhr im Computerraum. Er wollte dem Bordcomputer nur ein Gedicht aus seiner Deutsch-Hausaufgabe zeigen. Dabei rutschte er auf seiner eigenen Bananenschale aus und landete mit allen sechs Ellenbogen auf der Tastatur. Der Computer reimt noch immer. Luna hat sich daran gewöhnt und gibt ihre Befehle inzwischen im Kreuzreim.","sol":["Glibb","Banane","Computerraum","16 Uhr"]},
{"id":"s1","set":3,"level":1,"title":"Die Kette, die nicht mehr rasselt","intro":"Schloss Schlotterfels, kurz vor Mitternacht. Schlossgespenst Gundula will wie jede Nacht mit ihrer Kette rasseln. Die Kette gleitet aber lautlos über den Boden, denn jemand hat sie geölt. Gundula ist empört, schließlich spukt es sich ohne Rasseln nur halb so schön. Wer das Ölkännchen hatte, war es.","cats":[{"name":"Verdächtige","items":[{"e":"🧛","n":"Vladimir","d":"Vampir und Vegetarier. Trinkt nur Tomatensaft und wird bei Knoblauchbrot trotzdem nervös."},{"e":"💀","n":"Knut","d":"Skelett. Klappert beim Gehen und friert das ganze Jahr."},{"e":"🧙‍♀️","n":"Hildegard","d":"Hexe. Ihr Besen hat seit der letzten Prüfung eine Hupe."}]},{"name":"Gegenstand","items":[{"e":"🛢️","n":"Ölkännchen","d":"Mit langem Schnabel. Tropft schon beim Hinsehen."},{"e":"🕯️","n":"Kerzenleuchter","d":"Fünf Arme, vier Kerzen. Eine hat Gundula ausgepustet."},{"e":"🧹","n":"Besen","d":"Fliegt 30 km/h, bergab auch 35."}]},{"name":"Ort","items":[{"e":"⚰️","n":"Gruft","d":"Kühl, still und überraschend gemütlich. Der Sarg hat eine Leselampe."},{"e":"🕸️","n":"Dachkammer","d":"Hier hängt Gundulas Kette, wenn sie nicht gebraucht wird."},{"e":"🍲","n":"Schlossküche","d":"Im Kessel blubbert etwas Grünes. Es ist Erbsensuppe."}]}],"guilt":"Ölkännchen","clues":[{"t":"Die Kette wurde mit einem Ölkännchen geölt."},{"t":"Vladimir verlässt die Gruft nie vor Mitternacht.","r":["=","Vladimir","Gruft"]},{"t":"Wer den Besen dabeihatte, war in der Schlossküche.","r":["=","Besen","Schlossküche"]},{"t":"Knut war nicht in der Schlossküche. Der Dampf lässt seine Knochen beschlagen.","r":["!","Knut","Schlossküche"]},{"t":"In der Gruft gab es kein Ölkännchen.","r":["!","Gruft","Ölkännchen"]}],"hints":["Fang mit dem Besen an. Wer kann in der Schlossküche gewesen sein?","Vladimir war in der Gruft, Knut meidet die Küche. Der Besen gehörte also zu Hildegard.","In der Gruft gab es kein Ölkännchen. Was hatte Vladimir dann dabei?"],"outro":"Knut hatte das Ölkännchen. Eigentlich wollte er in der Dachkammer nur seine quietschenden Knie ölen. Die Kette hing direkt daneben, und ohne Augen sieht Knut eben nicht besonders gut. Gundula spukt vorerst mit einer Fahrradklingel. Die Schlossbewohner finden das deutlich unheimlicher.","sol":["Knut","Ölkännchen","Dachkammer"]},
{"id":"s2","set":3,"level":3,"title":"Zwölf Flaschen Tomatensaft","intro":"Vampir Vladimir öffnet seinen Vorratsschrank im Weinkeller und erstarrt. Alle zwölf Flaschen Tomatensaft sind leer, Jahrgang letzte Woche. Auf dem Boden steht eine große rote Pfütze. Vier Schlossbewohner haben ausgesagt, genau eine Person lügt. Wer lügt, war am Saft.","cats":[{"name":"Verdächtige","items":[{"e":"👻","n":"Gundula","d":"Schlossgespenst. Kann durch Wände gehen und vergisst deshalb ständig, wo die Türen sind."},{"e":"💀","n":"Knut","d":"Skelett. Seit Kurzem frisch geölt und stolz darauf."},{"e":"🧙‍♀️","n":"Hildegard","d":"Hexe. Trinkt ausschließlich Brennnesseltee, drei Kannen am Tag."},{"e":"🐺","n":"Wolfgang","d":"Werwolf. Verwandelt sich bei Vollmond und haart das ganze übrige Jahr."}]},{"name":"Gegenstand","items":[{"e":"🥛","n":"Becher","d":"Aus Zinn. Fasst genau eine Flasche Tomatensaft."},{"e":"🏮","n":"Laterne","d":"Flackert unheimlich. Das liegt am Wackelkontakt."},{"e":"🧹","n":"Besen","d":"Parkt grundsätzlich im Halteverbot."},{"e":"🪞","n":"Spiegel","d":"Zeigt alle Schlossbewohner außer Vladimir."}]},{"name":"Ort","items":[{"e":"🍷","n":"Weinkeller","d":"Hier lagert Vladimirs Tomatensaft. Wein gibt es schon lange keinen mehr."},{"e":"🖼️","n":"Ahnengalerie","d":"Zwanzig Gemälde. Die Augen folgen einem, weil dahinter jemand steht."},{"e":"🕰️","n":"Turmuhr","d":"Schlägt um Mitternacht dreizehnmal. Nachgezählt hat bisher nur Knut."},{"e":"🥀","n":"Schlossgarten","d":"Verwelkte Rosen und ein Brunnen voller Fledermäuse."}]}],"clues":[{"t":"Der Saft stand im Weinkeller. Wer am Saft war, war also dort.","r":["=","@","Weinkeller"]},{"t":"Die Laterne leuchtete oben an der Turmuhr.","r":["=","Laterne","Turmuhr"]},{"t":"Der Spiegel hing in der Ahnengalerie.","r":["=","Spiegel","Ahnengalerie"]},{"t":"Im Schlossgarten lehnte ein Besen am Brunnen.","r":["=","Besen","Schlossgarten"]}],"statements":[{"who":"Gundula","text":"Ich schwebte im Schlossgarten und habe Fledermäuse gezählt.","r":["=","Gundula","Schlossgarten"]},{"who":"Knut","text":"Wolfgang stand in der Ahnengalerie und hat sein Fell bewundert.","r":["=","Wolfgang","Ahnengalerie"]},{"who":"Hildegard","text":"Knut hatte die Laterne. Er hat damit durch seine eigenen Rippen geleuchtet.","r":["=","Knut","Laterne"]},{"who":"Wolfgang","text":"Hildegard war nicht im Weinkeller. Hexen trinken nur Brennnesseltee.","r":["!","Hildegard","Weinkeller"]}],"hints":["Wer lügt, war im Weinkeller. Suche Aussagen, die jemanden an einen anderen Ort stellen.","Knut stellt Wolfgang in die Ahnengalerie, Wolfgang hält Hildegard vom Weinkeller fern. Die Laterne war an der Turmuhr, und Hildegard gibt sie Knut.","Für Wolfgang, Hildegard und Knut bürgt jeweils eine andere Person. Wer bleibt übrig?"],"outro":"Gundula hat gelogen. Sie war im Weinkeller und wollte endlich wissen, wie Tomatensaft schmeckt. Zwölf Becher hat sie getrunken, und zwölf Becher sind einfach durch sie hindurchgelaufen. Daher die Pfütze. „Schmeckt nach nichts“, lautete ihr Urteil. Im Schlossgarten war in Wahrheit Hildegard, ihr Besen lehnte am Brunnen. Vladimir trinkt bis zur nächsten Lieferung Rote-Bete-Saft und ist sehr tapfer.","sol":["Gundula","Becher","Weinkeller"]},
{"id":"s3","set":3,"level":4,"title":"Die Geisterstunde fällt aus","intro":"Im Schloss Schlotterfels warten alle auf Mitternacht, denn dann beginnt die Geisterstunde. Die Turmuhr steht aber seit Stunden auf 23:59 Uhr. Jemand hat sie angehalten. Auf der Treppe zum Uhrwerk sind frische Kakaoflecken. Wer Kakao getrunken hat, hat die Uhr gestoppt. Diesmal gibt es drei Dinge zu klären, nämlich Gegenstand, Aufenthaltsort und Getränk der schuldigen Person.","cats":[{"name":"Verdächtige","items":[{"e":"🧛","n":"Vladimir","d":"Vampir und Vegetarier. Hat wieder Tomatensaft im Haus und bewacht ihn persönlich."},{"e":"💀","n":"Knut","d":"Skelett. Trinkt viel, behält aber wenig."},{"e":"🧙‍♀️","n":"Hildegard","d":"Hexe. Kocht nachts, weil der Kessel dann besser zieht."},{"e":"🐺","n":"Wolfgang","d":"Werwolf. Braucht zehn Stunden Schlaf und bekommt im Schloss höchstens vier."}]},{"name":"Gegenstand","items":[{"e":"⏰","n":"Wecker","d":"Klingelt wie eine Feuerwehr. Die Schlummertaste ist abgenutzt."},{"e":"🔧","n":"Schraubenschlüssel","d":"Verrostet, aber noch brauchbar."},{"e":"🥄","n":"Kochlöffel","d":"So lang wie ein Arm. Rührt auch Dinge um, die zurückrühren."},{"e":"🛏️","n":"Kissen","d":"Mit Gänsefedern gefüllt. Die Gans spukt gelegentlich."}]},{"name":"Ort","items":[{"e":"🕰️","n":"Turmuhr","d":"Hinter dem Zifferblatt drehen sich hundert Zahnräder. Heute stehen sie still."},{"e":"⚰️","n":"Gruft","d":"Vladimirs Schlafzimmer. Der Sarg hat inzwischen auch ein Bücherregal."},{"e":"🍲","n":"Schlossküche","d":"Im Kessel blubbert es. Heute ist es wirklich etwas Grünes."},{"e":"🥀","n":"Schlossgarten","d":"Der Brunnen tropft, das Gartentor quietscht."}]},{"name":"Getränk","items":[{"e":"🍅","n":"Tomatensaft","d":"Frisch geliefert. Zwölf Flaschen, alle noch voll."},{"e":"🍵","n":"Brennnesseltee","d":"Brennt nicht mehr, schmeckt aber so."},{"e":"☕","n":"Kakao","d":"Mit Sahnehaube. Kleckert beim Treppensteigen."},{"e":"🥛","n":"Milch","d":"Soll gut für die Knochen sein."}]}],"guilt":"Kakao","clues":[{"t":"Auf der Treppe zum Uhrwerk waren Kakaoflecken."},{"t":"Vladimir trank Tomatensaft, wie immer.","r":["=","Vladimir","Tomatensaft"]},{"t":"Wer den Kochlöffel hatte, stand in der Schlossküche und trank Brennnesseltee.","r":["and",["=","Kochlöffel","Schlossküche"],["=","Kochlöffel","Brennnesseltee"]]},{"t":"Hildegard trank Brennnesseltee.","r":["=","Hildegard","Brennnesseltee"]},{"t":"Im Schlossgarten wurde mit dem Schraubenschlüssel am Gartentor geschraubt.","r":["=","Schlossgarten","Schraubenschlüssel"]},{"t":"Wer im Schlossgarten war, trank Milch.","r":["=","Schlossgarten","Milch"]},{"t":"Wolfgang hatte weder Kissen noch Schraubenschlüssel.","r":["and",["!","Wolfgang","Kissen"],["!","Wolfgang","Schraubenschlüssel"]]},{"t":"Das Kissen lag in der Gruft.","r":["=","Kissen","Gruft"]}],"hints":["Hildegard trank Brennnesseltee. Was folgt daraus für ihren Gegenstand und ihren Ort?","Für Wolfgang bleibt nur ein Gegenstand. Wer im Schlossgarten schraubte, trank Milch. Vladimir kann das nicht gewesen sein.","Knut war im Schlossgarten, Vladimir mit dem Kissen in der Gruft. Welcher Ort und welches Getränk bleiben für Wolfgang?"],"outro":"Wolfgang war es. Er stieg mit Kakao und Wecker zur Turmuhr hinauf und klemmte den Wecker zwischen die Zahnräder. „Wenn es nie Mitternacht wird, kann ich endlich mal durchschlafen“, gähnte er. Die Geisterstunde wurde am nächsten Abend nachgeholt und dauerte zum Ausgleich zwei Stunden. Wolfgang hat sie verschlafen.","sol":["Wolfgang","Wecker","Turmuhr","Kakao"]},
{"id":"w1","set":4,"level":2,"title":"Die Zimtstern-Lücke","intro":"Nordpol, Wichtelwerkstatt, noch 23 Tage bis Weihnachten. In der Backstube kühlen 80 Zimtsterne auf dem Blech aus. Als Oberwichtelin Thekla nachzählt, liegt dort nur noch ein einziger, und der ist angebissen. Wer in der Backstube war, hat genascht.","cats":[{"name":"Verdächtige","items":[{"e":"🧝","n":"Fiete","d":"Wichtel. Verpackt 300 Geschenke am Tag und findet danach die Schere nicht mehr."},{"e":"🧝‍♀️","n":"Smilla","d":"Wichtelin. Sortiert die Wunschzettel nach Handschrift, von lesbar bis Kunstwerk."},{"e":"🦌","n":"Raimund","d":"Rentier. Kann fliegen, hat aber Höhenangst."},{"e":"⛄","n":"Eberhard","d":"Schneemann. Arbeitet am liebsten draußen und meidet alles über null Grad."}]},{"name":"Gegenstand","items":[{"e":"🎀","n":"Geschenkband","d":"Rot mit goldenen Sternen. Auf einer Rolle sind 400 Meter."},{"e":"🛷","n":"Schlitten","d":"Der kleine Übungsschlitten. Hat Stützkufen."},{"e":"🔔","n":"Glöckchen","d":"Bimmelt bei jeder Bewegung. Anschleichen ist damit unmöglich."},{"e":"🍪","n":"Keksdose","d":"Blech mit Schneemann-Motiv. Verdächtig schwer."}]},{"name":"Ort","items":[{"e":"🧁","n":"Backstube","d":"Der Ofen läuft seit Oktober. Hier sind es 30 Grad."},{"e":"🎁","n":"Packstation","d":"Berge von Geschenkpapier. Irgendwo darunter ist ein Tisch."},{"e":"🛖","n":"Stall","d":"Neun Boxen, frisches Heu und ein Flugplan an der Wand."},{"e":"✉️","n":"Poststelle","d":"Jeden Tag kommen 40 Säcke Wunschzettel an."}]}],"guilt":"Backstube","clues":[{"t":"Die Zimtsterne verschwanden aus der Backstube."},{"t":"Raimund hat den Stall den ganzen Tag nicht verlassen.","r":["=","Raimund","Stall"]},{"t":"Der Schlitten stand im Stall.","r":["=","Schlitten","Stall"]},{"t":"Wer das Geschenkband hatte, war an der Packstation.","r":["=","Geschenkband","Packstation"]},{"t":"Smilla hatte weder Geschenkband noch Keksdose.","r":["and",["!","Smilla","Geschenkband"],["!","Smilla","Keksdose"]]},{"t":"Eberhard hatte kein Geschenkband. Mit Astfingern lässt sich keine Schleife binden.","r":["!","Eberhard","Geschenkband"]},{"t":"In der Poststelle bimmelte ein Glöckchen.","r":["=","Poststelle","Glöckchen"]}],"hints":["Raimund und der Schlitten sind schnell verortet. Was bleibt dann für Smilla?","Smilla hatte das Glöckchen und war damit in der Poststelle. Wer kann das Geschenkband gehabt haben?","Fiete war mit dem Geschenkband an der Packstation. Welcher Ort bleibt für Eberhard?"],"outro":"Eberhard war in der Backstube, ausgerechnet er. Er wollte die Zimtsterne nur in seine Keksdose retten, „bevor sie jemand isst“. Unterwegs hat er dann 79 Stück selbst gerettet. Bei 30 Grad ist er dabei um zwanzig Zentimeter geschrumpft. Die Wichtel haben ihn draußen wieder aufgebaut. Er trägt jetzt eine Möhre mit Zimtgeschmack.","sol":["Eberhard","Keksdose","Backstube"]},
{"id":"w2","set":4,"level":4,"title":"Das Einhorn für Opa Heinz","intro":"An der Packstation hat jemand die Adressetiketten vertauscht. Opa Heinz aus Buxtehude bekommt jetzt ein Einhorn-Malbuch, und die kleine Mia bekommt eine Heizdecke. Die vertauschten Etiketten stammen alle von derselben Etikettenrolle. Fünf Werkstattmitglieder haben ausgesagt, genau eine Person lügt. Wer lügt, hat die Etiketten geklebt.","cats":[{"name":"Verdächtige","items":[{"e":"🧝","n":"Fiete","d":"Wichtel. Öffnet in der Poststelle alle Umschläge, auch die, auf denen „Privat“ steht."},{"e":"🧝‍♀️","n":"Smilla","d":"Wichtelin. Kennt alle Adressen der Welt auswendig, außer ihrer eigenen."},{"e":"🦌","n":"Raimund","d":"Rentier. Nascht Zuckerstangen und behauptet, das sei Flugbenzin."},{"e":"⛄","n":"Eberhard","d":"Schneemann. Wieder auf volle Größe gebracht und seitdem sehr vorsichtig."},{"e":"🐻‍❄️","n":"Ingrid","d":"Eisbärin und Nachtwächterin. Trinkt Punsch gegen die Kälte, die ihr gar nichts ausmacht."}]},{"name":"Gegenstand","items":[{"e":"🏷️","n":"Etikettenrolle","d":"Enthält 500 Adressaufkleber. Sie kleben an allem, vor allem an Fingern."},{"e":"✂️","n":"Schere","d":"Fietes verschwundene Schere. Sie lag die ganze Zeit in seiner Tasche."},{"e":"🍭","n":"Zuckerstange","d":"Rot-weiß geringelt und an einem Ende angeknabbert."},{"e":"💡","n":"Lichterkette","d":"Zwanzig Meter lang und einmal komplett verknotet."},{"e":"🍵","n":"Punschbecher","d":"Dampft und riecht nach Zimt. Kinderpunsch, versteht sich."}]},{"name":"Ort","items":[{"e":"🎁","n":"Packstation","d":"Hier bekommt jedes Paket sein Etikett. Normalerweise das richtige."},{"e":"🧁","n":"Backstube","d":"Die Zimtsterne werden inzwischen bewacht."},{"e":"🛖","n":"Stall","d":"Die Rentiere üben Starts. Landungen kommen nächste Woche dran."},{"e":"✉️","n":"Poststelle","d":"Heute sind es 43 Säcke Wunschzettel."},{"e":"🛷","n":"Schlittengarage","d":"Hier parkt der große Schlitten. An der Wand hängen die Lichterketten."}]}],"clues":[{"t":"Die Etiketten wurden an der Packstation vertauscht. Wer es war, stand dort und hatte die Etikettenrolle.","r":["and",["=","@","Packstation"],["=","@","Etikettenrolle"]]},{"t":"Im Stall lag eine angeknabberte Zuckerstange.","r":["=","Stall","Zuckerstange"]},{"t":"In der Backstube stand ein Punschbecher.","r":["=","Backstube","Punschbecher"]},{"t":"Die Lichterkette war in der Schlittengarage.","r":["=","Lichterkette","Schlittengarage"]}],"statements":[{"who":"Fiete","text":"Raimund war im Stall. Er hat Starts geübt, im Stehen.","r":["=","Raimund","Stall"]},{"who":"Smilla","text":"Fiete hatte die Etikettenrolle. Ich habe sie an seinem Ärmel kleben sehen.","r":["=","Fiete","Etikettenrolle"]},{"who":"Raimund","text":"Ingrid saß in der Backstube und hat Punsch getrunken.","r":["=","Ingrid","Backstube"]},{"who":"Eberhard","text":"Fiete war in der Poststelle. Er hat Umschläge aufgeschnitten.","r":["=","Fiete","Poststelle"]},{"who":"Ingrid","text":"Eberhard hat in der Schlittengarage die Lichterkette entwirrt.","r":["=","Eberhard","Lichterkette"]}],"hints":["Wer lügt, stand an der Packstation. Suche für jede Person eine fremde Aussage, die sie woanders hinstellt.","Fiete bürgt für Raimund, Raimund für Ingrid, Eberhard für Fiete. Die Lichterkette war in der Schlittengarage, und Ingrid gibt sie Eberhard.","Vier Personen haben jemanden, der für sie bürgt. Für die fünfte spricht niemand, und ihre eigene Aussage widerspricht Eberhard."],"outro":"Smilla hat gelogen. Die Etikettenrolle klebte an ihrem eigenen Ärmel. Sie hatte so schnell geklebt, dass sie zwei Stapel verwechselte, und wollte es dann lieber Fiete in die Schuhe schieben. Die Sache ging gut aus. Opa Heinz hat das Einhorn-Malbuch komplett ausgemalt und wünscht sich nächstes Jahr Band zwei. Mia benutzt die Heizdecke als Höhle.","sol":["Smilla","Etikettenrolle","Packstation"]},
