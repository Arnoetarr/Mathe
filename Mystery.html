{"id":"w3","set":4,"level":5,"title":"Die Spritztour","intro":"Am Morgen steht der große Schlitten schief in der Garage. Der Kilometerzähler zeigt 4000 Kilometer mehr als gestern, und auf dem Sitz liegt Sand. Jemand hat in der Nacht eine Spritztour gemacht. Vor der Garage führen Skispuren durch den Schnee. Fünf Werkstattmitglieder waren nachts in der Garage, jedes zu einer anderen Stunde. Fünf Aussagen, genau eine ist gelogen. Wer lügt, saß am Lenkseil. Diesmal gibt es keine Orte, dafür Uhrzeit und Schuhwerk.","cats":[{"name":"Verdächtige","items":[{"e":"🧝","n":"Fiete","d":"Wichtel. Geht früh schlafen und steht noch früher wieder auf."},{"e":"🧝‍♀️","n":"Smilla","d":"Wichtelin. Behauptet, am Nordpol sei es ihr zu warm."},{"e":"🦌","n":"Raimund","d":"Rentier. Träumt seit Jahren von einem Urlaub am Strand."},{"e":"⛄","n":"Eberhard","d":"Schneemann. Macht nachts Kontrollgänge, damit ihn niemand für faul hält."},{"e":"🐻‍❄️","n":"Ingrid","d":"Eisbärin und Nachtwächterin. Kontrolliert stündlich, außer wenn der Punsch alle ist."}]},{"name":"Gegenstand","items":[{"e":"🔦","n":"Stirnlampe","d":"Leuchtet 50 Meter weit. Blendet vor allem die Person, die sie trägt."},{"e":"☕","n":"Thermoskanne","d":"Hält Punsch zwölf Stunden warm."},{"e":"🧣","n":"Schal","d":"Vier Meter lang. Von Burgfräulein Adelheid gestrickt und per Post geschickt."},{"e":"🗺️","n":"Landkarte","d":"Weltkarte mit einem Kreuz bei einer Insel im Süden."},{"e":"🥕","n":"Möhre","d":"Ersatznase oder Proviant, je nachdem, wem sie gehört."}]},{"name":"Uhrzeit","items":[{"e":"🕙","n":"22 Uhr","d":"In der Werkstatt geht das Licht aus."},{"e":"🕚","n":"23 Uhr","d":"Die Rentiere schnarchen im Chor."},{"e":"🕛","n":"Mitternacht","d":"Es schneit leise."},{"e":"🕐","n":"1 Uhr","d":"Die Nordlichter flackern grün."},{"e":"🕑","n":"2 Uhr","d":"Jetzt ist es am Nordpol am stillsten."}]},{"name":"Schuhe","items":[{"e":"🥿","n":"Pantoffeln","d":"Mit Bommeln. Rutschen auf Eis hervorragend."},{"e":"⛸️","n":"Schlittschuhe","d":"Frisch geschliffen. Auf dem Garagenboden sehr laut."},{"e":"🥾","n":"Gummistiefel","d":"Zwei Nummern zu groß und innen nass."},{"e":"🎿","n":"Skier","d":"Lang, schmal und frisch gewachst."},{"e":"🩴","n":"Badelatschen","d":"Gelb mit Palmenmuster. Am Nordpol eher selten."}]}],"clues":[{"t":"Vor der Garage waren Skispuren. Wer die Spritztour gemacht hat, trug also Skier.","r":["=","@","Skier"]},{"t":"Die Stirnlampe war früher in der Garage als die Thermoskanne.","r":["<","Stirnlampe","Thermoskanne","Uhrzeit"]},{"t":"Die Gummistiefel kamen genau um Mitternacht.","r":["=","Gummistiefel","Mitternacht"]},{"t":"Wer die Möhre dabeihatte, trug Badelatschen.","r":["=","Möhre","Badelatschen"]},{"t":"Die Schlittschuhe kamen genau eine Stunde nach den Pantoffeln.","r":["+","Pantoffeln","Schlittschuhe",1,"Uhrzeit"]},{"t":"Wer die Landkarte hatte, trug Skier.","r":["=","Landkarte","Skier"]}],"statements":[{"who":"Fiete","text":"Eberhard kam um Mitternacht. Das macht er jede Nacht so.","r":["=","Eberhard","Mitternacht"]},{"who":"Smilla","text":"Fiete war als Erster da, schon um 22 Uhr.","r":["=","Fiete","22 Uhr"]},{"who":"Raimund","text":"Ich hatte die Möhre dabei. Als Proviant. Äh, für den Weg zur Garage.","r":["=","Raimund","Möhre"]},{"who":"Eberhard","text":"Ingrid kam vor mir und hatte ihre Thermoskanne dabei.","r":["and",["<","Ingrid","Eberhard","Uhrzeit"],["=","Ingrid","Thermoskanne"]]},{"who":"Ingrid","text":"Smilla kam um 1 Uhr. Ich bin extra wach geblieben.","r":["=","Smilla","1 Uhr"]}],"hints":["Fiete, Smilla und Ingrid nennen feste Uhrzeiten. Nimm zuerst an, dass alle drei stimmen, und trage sie ein.","Die Gummistiefel kamen um Mitternacht. Wer um Mitternacht da war, kann also keine Skier getragen haben.","Lügt Ingrid, dann kam sie laut Eberhard um 23 Uhr. Pantoffeln und Schlittschuhe passen dann nur auf 22 und 23 Uhr, und für Ingrid bleiben keine Skier. Prüfe Smilla und Fiete genauso."],"outro":"Raimund hat gelogen. Eine Möhre hatte er nie dabei, dafür die Landkarte mit dem Kreuz. Um 2 Uhr schnallte er die Skier ab, spannte sich selbst vor den Schlitten und flog einmal bis ans Meer. „Ich wollte nur kurz die Hufe in den Sand stecken“, gab er zu. Die Möhre gehörte Smilla, die in Badelatschen einen Nachtsnack suchte. Der Weihnachtsmann hat Raimund verziehen. Im Januar fliegt die ganze Werkstatt in den Urlaub, diesmal mit Erlaubnis.","sol":["Raimund","Landkarte","2 Uhr","Skier"]}

    if (op === '<') { const a = ent(r[1]), b = ent(r[2]), k = catIdx(r[3]); return S => S.pos[k][a(S)] < S.pos[k][b(S)]; }
    if (op === '+') { const a = ent(r[1]), b = ent(r[2]), n = r[3], k = catIdx(r[4]); return S => S.pos[k][b(S)] - S.pos[k][a(S)] === n; }
    const sub = r.slice(1).map(rule);
    if (op === 'or') return S => sub.some(f => f(S));

    if (sts.length) {
      let liar = -1, cnt = 0;
      for (const s of sts) if (!s.f(S)) { cnt++; liar = s.who; if (cnt > 1) return; }
      if (cnt !== 1) return;
      S.cul = liar;
    } else S.cul = g(S);
    for (const f of late) if (!f(S)) return;
    out.push([S.cul].concat(S.pos.slice(1).map(p => p[S.cul])));
  };
  const rec = (k, p) => {
    if (out.length >= max) return;
    if (k === K) return leaf();
    if (p === n) { for (const f of early[k]) if (!f(S)) return; return rec(k + 1, 0); }
    for (let j = 0; j < n; j++) if (S.inv[k][j] < 0) { S.inv[k][j] = p; S.pos[k][p] = j; rec(k, p + 1); S.inv[k][j] = -1; S.pos[k][p] = -1; }
  };
  rec(1, 0);
  return out;
}
function audit(c) {
  const err = [], red = []; let sols = [];
  try {
    const cp = compile(c);
    if (cp.dup.length) err.push('Doppelte Namen: ' + cp.dup.join(', '));
    if (c.solIdx.indexOf(-1) >= 0) err.push('Die Auflösung enthält unbekannte Namen');
    if ((c.statements || []).some(s => s.who < 0)) err.push('Eine Aussage stammt von einer unbekannten Person');
    if (!c.statements && !c.guilt) err.push('Es fehlt „guilt“ oder eine Liste von Aussagen');
    if (!err.length) {
      sols = solve(c, -1, 3);
      if (sols.length === 1) c.clues.forEach((x, i) => { if (x.r && solve(c, i, 2).length === 1) red.push(i + 1); });
    }
  } catch (e) { err.push(e.message); }
  const match = sols.length === 1 && sols[0].every((v, k) => v === c.solIdx[k]);
  return { err, n: sols.length, sols, match, red };
}

// ---------- Oberfläche ----------
if (typeof document !== 'undefined') (function () {
const KEY = 'aktePinguin.v2';
const fresh = () => ({ solved: {}, grid: {}, struck: {}, notes: {}, tries: {}, first: {}, snap: {} });
let st = fresh();
try { Object.assign(st, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const $ = id => document.getElementById(id);
const app = $('app'), nb = $('nb'), fab = $('fab');
const SYM = ['', '✗', '✓', '✗'];
let cur = -1, hintN = 0;
const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const stamp = c => st.solved[c.id] ? (st.first[c.id] ? '<span class="stamp gold">Auf Anhieb</span>' : '<span class="stamp">Gelöst</span>') : '';

function showNb(on) {
  nb.hidden = !on; fab.hidden = on || cur < 0;
  document.body.classList.toggle('nbo', on);
}

function menu() {
  cur = -1; showNb(false);
  const done = CASES.filter(c => st.solved[c.id]).length;
  const row = (c, i) => `<li><button data-open="${i}"><span class="nr">${i + 1}</span>
      <span><span class="t">${c.title}</span><br><span class="stars" aria-label="Schwierigkeit ${c.level} von 5">${stars(c.level)}</span></span>
      ${stamp(c) || '<span></span>'}</button></li>`;
  app.innerHTML = `
    <p class="mono">Ermittlungsbüro für harmlose Vergehen</p>
    <h1>Akte Pinguin</h1>
    <p class="sub">${CASES.length} Logikkrimis in ${SETS.length} Akten. ${done} von ${CASES.length} Fällen gelöst.</p>
    <details${done ? '' : ' open'}><summary>So wird ermittelt</summary><ul>
      <li>Zu jeder verdächtigen Person gehört aus jeder Kategorie genau ein Eintrag, zum Beispiel ein Gegenstand und ein Ort. Nichts kommt doppelt vor.</li>
      <li>Die Anklage fragt immer nach der schuldigen Person und nach dem, was auf sie zutrifft. Der Tatort kann woanders liegen.</li>
      <li>Die Karten lassen sich antippen und umdrehen.</li>
      <li>Im Notizbuch trägst du ein, was du weißt. Es bleibt beim Scrollen sichtbar.</li>
      <li>Im Gitter setzt einmal Tippen ein rotes ✗ (passt nicht), zweimal ein ✓ (passt), dreimal leert das Feld.</li>
      <li>Ein ✓ füllt Zeile und Spalte seines Blocks mit grauen ✗. Nimmst du das ✓ zurück, verschwinden sie wieder. Rote ✗ bleiben stehen.</li>
      <li>Mit „Annahme“ merkt sich das Notizbuch den Stand des Gitters. Führt dein Versuch in einen Widerspruch, bringt „Verwerfen“ den alten Stand zurück.</li>
      <li>Erledigte Hinweise kannst du antippen und durchstreichen.</li>
      <li>In Fällen mit Aussagen lügt genau eine Person. Alle anderen sagen die Wahrheit.</li>
      <li>Tipps gibt es in Stufen. Fehlversuche bei der Anklage werden gezählt. Wer ohne Fehlversuch löst, bekommt den Stempel „Auf Anhieb“.</li>
    </ul></details>
    ${SETS.map((name, si) => {
      const l = CASES.map((c, i) => [c, i]).filter(x => x[0].set === si);
      return l.length ? `<h3 class="seth">Akte ${si + 1} · ${name}</h3><ul class="cases">${l.map(x => row(x[0], x[1])).join('')}</ul>` : '';
    }).join('')}
    <footer>Alle Fälle, Figuren und Vergehen sind frei erfunden. Niemand kam zu Schaden, nur ein paar Fischstäbchen.
      <br><button class="link" data-act="printall">Alle Fälle drucken</button> · <button class="link" data-act="audit">Fälle prüfen</button> · <button class="link" data-act="wipe">Alle Spielstände löschen</button></footer>`;
  scrollTo(0, 0);
}

function grid(c, print) {
  const n = c.cats.length, cols = [], rows = [0];
  for (let k = 1; k < n; k++) cols.push(k);
  for (let k = n - 1; k > 1; k--) rows.push(k);
  const m = c.cats[0].items.length, total = cols.length * m;
  const cs = print ? '22px' : `clamp(30px,calc((var(--pw) - 128px)/${total}),38px)`;
  let h = `<table class="lg" style="--cs:${cs}"><thead><tr><th class="none"></th>${
    cols.map(k => `<th class="ct k${k}" colspan="${m}">${c.cats[k].name}</th>`).join('')}</tr><tr><th class="none"></th>${
    cols.map(k => c.cats[k].items.map(x => `<th class="v k${k}"><span class="vn">${x.n}</span><span class="ve">${x.e}</span></th>`).join('')).join('')}</tr></thead><tbody>`;
  rows.forEach((a, ri) => {
    const valid = cols.length - ri;
    c.cats[a].items.forEach((x, i) => {
      h += `<tr><th class="r k${a}" title="${esc(x.n)}">${x.e} ${x.n}</th>`;
      for (let ci = 0; ci < valid; ci++) {
        const b = cols[ci];
        c.cats[b].items.forEach((y, j) => {
          const cl = [j === 0 && 'bl', i === 0 && 'bt', ci === valid - 1 && j === m - 1 && 'br', i === m - 1 && 'bb'].filter(Boolean).join(' ');
          h += `<td class="${cl}"><button class="c" data-k="${a}.${i}-${b}.${j}" aria-label="${esc(x.n)} und ${esc(y.n)}"></button></td>`;
        });
      }
      h += '</tr>';
    });
  });
  return h + '</tbody></table>';
}

function paint() {
  const id = CASES[cur].id, g = st.grid[id] || {}, snap = st.snap[id];
  const ch = Object.keys(g).filter(k => g[k] === 2).map(k => k.split(/[.-]/));
  nb.querySelectorAll('.c').forEach(b => {
    const k = b.dataset.k; let v = g[k] || 0;
    if (!v) { const [a, i, bb, j] = k.split(/[.-]/); if (ch.some(x => x[0] === a && x[2] === bb && (x[1] === i || x[3] === j))) v = 3; }
    b.dataset.v = v; b.textContent = SYM[v];
    b.classList.toggle('as', !!snap && (snap[k] || 0) !== (g[k] || 0));
  });
}

function notebook(c) {
  const notes = st.notes[c.id] || (st.notes[c.id] = c.cats[0].items.map(p => c.cats.map((_, k) => k ? '' : p.n)));
  const snap = st.snap[c.id];
  nb.innerHTML = `<div class="nbh"><b>📓 Notizbuch</b>${snap
      ? '<button class="small" data-act="keep">Behalten</button><button class="small" data-act="drop">Verwerfen</button>'
      : '<button class="small" data-act="assume">Annahme</button>'}<button class="small" data-act="reset">Leeren</button><button class="small" data-act="nb" aria-label="Notizbuch schließen">✕</button></div>
    <div class="nbb">${snap ? '<p class="hint" style="margin-top:0">Annahme läuft. Was du seitdem geändert hast, ist blau umrandet. „Verwerfen“ stellt den Stand von vorher wieder her, „Behalten“ übernimmt alles.</p>' : ''}
    <p class="nbt">Ermittlungsgitter</p><div class="gw">${grid(c)}</div>
    <p class="leg"><i style="color:var(--red)">✗</i> selbst gesetzt · <i style="color:var(--grey)">✗</i> automatisch · <i style="color:var(--ok)">✓</i> passt</p><br>
    <p class="nbt">Eigene Notizen</p>
    <table class="ft"><thead><tr>${c.cats.map((k, ci) => `<th class="k${ci}">${ci ? k.name : 'Person'}</th>`).join('')}</tr></thead><tbody>${
      notes.map((r, ri) => `<tr>${c.cats.map((k, ci) => `<td><input data-n="${ri}.${ci}" value="${esc(r[ci] || '')}" aria-label="${ci ? k.name : 'Person'}, Zeile ${ri + 1}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  paint();
}

const card = (x, k) => `<button class="fc k${k}" data-flip aria-pressed="false"><span class="in">
  <span class="f"><span class="em">${x.e}</span><b>${x.n}</b><span class="turn">umdrehen ↻</span></span>
  <span class="bk"><b>${x.e} ${x.n}</b><span>${x.d || ''}</span></span></span></button>`;

const sayings = (c, struck) => c.statements ? `<h3>Aussagen</h3><p class="note">Genau eine dieser Aussagen ist gelogen. Wer lügt, war es.</p>` +
  c.statements.map((s, k) => { const p = c.cats[0].items[s.who];
    return `<div class="say ${struck.includes('s' + k) ? 'done' : ''}" data-s="s${k}"><b>${p.e} ${p.n}:</b> „${s.text}“</div>`; }).join('') : '';

const triesText = c => st.tries[c.id] ? `Fehlversuche bisher: ${st.tries[c.id]}` : '';

function openCase(i) {
  cur = i; hintN = 0;
  const c = CASES[i], struck = st.struck[c.id] || [];
  const cl = c.clues.map((x, k) => `<li data-s="c${k}" class="${struck.includes('c' + k) ? 'done' : ''}">${x.t}</li>`).join('');
  app.innerHTML = `
    <div class="row"><button data-act="back">← Alle Fälle</button><button class="small" data-act="print">Drucken</button><span id="stp">${stamp(c)}</span></div>
    <p class="mono" style="margin:14px 0 0">Akte ${c.set + 1} · ${SETS[c.set]}<br>Fall ${i + 1} · <span class="stars">${stars(c.level)}</span></p>
    <h2>${c.title}</h2>
    <div class="intro">${c.intro}</div>
    ${c.cats.map((k, ci) => `<h3 class="kh k${ci}">${k.name}</h3><div class="cards">${k.items.map(x => card(x, ci)).join('')}</div>`).join('')}
    <h3>Hinweise</h3><ol class="clues">${cl}</ol>
    ${sayings(c, struck)}
    <p class="row" style="margin-top:16px"><button data-act="hint">Tipp anzeigen (1 von ${c.hints.length})</button></p>
    <div id="hint"></div>
    <h3>Anklage</h3><p class="note">Gesucht ist, wer es war und was auf genau diese Person zutrifft.</p>
    <div class="answer">${c.cats.map((k, ci) => `<select data-a="${ci}" aria-label="${k.q}"><option value="">${k.q}</option>${
      k.items.map((x, j) => `<option value="${j}">${x.e} ${x.n}</option>`).join('')}</select>`).join('')}</div>
    <button class="primary" data-act="check">Anklage erheben</button>
    <div class="msg" id="msg" role="status"></div>
    <p class="note" id="tries">${triesText(c)}</p>
    <div id="outro">${st.solved[c.id] ? outro(c, i) : ''}</div>`;
  notebook(c);
  showNb(innerWidth >= 1000);
  scrollTo(0, 0);
}

function outro(c, i) {
  const who = c.cats[0].items[c.solIdx[0]];
  const rest = c.solIdx.slice(1).map((v, k) => { const x = c.cats[k + 1].items[v]; return `${x.e} ${x.n}`; }).join(', ');
  return `<div class="outro"><p class="mono" style="margin:0 0 6px">Auflösung</p><b>${who.e} ${who.n}</b> (${rest})<p style="margin:.6em 0 0">${c.outro}</p></div>
    <p class="row">${i + 1 < CASES.length ? `<button class="primary" data-open="${i + 1}">Nächster Fall →</button>` : '<span class="stamp">Alle Akten geschlossen</span>'}
    <button data-act="back">Zur Übersicht</button></p>`;
}

// ---------- Drucken ----------
function printHtml(c, i) {
  return `<section class="pg"><p class="mono">Akte ${c.set + 1} · ${SETS[c.set]} · Fall ${i + 1} · ${stars(c.level)}</p>
    <h2>${c.title}</h2><div class="intro">${c.intro}</div>
    ${c.cats.map((k, ci) => `<h3 class="kh k${ci}">${k.name}</h3><ul class="pl">${k.items.map(x => `<li><b>${x.e} ${x.n}</b> ${x.d || ''}</li>`).join('')}</ul>`).join('')}
    <h3>Hinweise</h3><ol class="clues">${c.clues.map(x => `<li>${x.t}</li>`).join('')}</ol>
    ${sayings(c, [])}
    <h3>Ermittlungsgitter</h3>${grid(c, true)}
    <p class="leg">✗ passt nicht · ✓ passt</p>
    <h3>Anklage</h3><p class="pa">${c.cats.map(k => `${k.q} <span class="ln"></span>`).join('<br>')}</p></section>`;
}
function doPrint(list, withSol) {
  let h = list.map(i => printHtml(CASES[i], i)).join('');
  if (withSol) h += `<section class="pg"><h2>Lösungen</h2><ol class="clues">${list.map(i => { const c = CASES[i]; return `<li value="${i + 1}"><b>${c.title}:</b> ${c.sol.join(', ')}</li>`; }).join('')}</ol></section>`;
  $('print').innerHTML = h;
  window.print();
}

// ---------- Fallprüfung ----------
function auditView() {
  cur = -1; showNb(false);
  app.innerHTML = `<div class="row"><button data-act="back">← Alle Fälle</button></div>
    <h2>Fallprüfung</h2>
    <p class="sub">Jeder Fall wird vollständig durchgerechnet. Er besteht, wenn genau eine Lösung möglich ist und sie zur hinterlegten Auflösung passt. Entbehrliche Hinweise sind kein Fehler, sie machen einen Fall nur leichter.</p>
    <ul class="au" id="au"></ul><p class="msg" id="aus">Prüfung läuft.</p>`;
  const ul = $('au'), names = (c, s) => s.map((v, k) => c.cats[k].items[v].n).join(', ');
  let i = 0, bad = 0;
  const step = () => {
    if ($('au') !== ul) return;
    if (i >= CASES.length) { $('aus').textContent = bad ? `${bad} Fälle brauchen Nacharbeit.` : `Alle ${CASES.length} Fälle sind eindeutig lösbar.`; return; }
    const c = CASES[i], r = audit(c), ok = !r.err.length && r.match;
    if (!ok) bad++;
    const txt = r.err.length ? esc(r.err.join('. '))
      : r.n === 0 ? 'Keine Lösung möglich. Die Hinweise widersprechen sich.'
      : r.n > 1 ? `Mehrere Lösungen möglich, zum Beispiel ${r.sols.slice(0, 2).map(s => names(c, s)).join(' oder ')}.`
      : r.match ? `Eindeutig: ${names(c, r.sols[0])}`
      : `Eindeutig, aber die hinterlegte Auflösung weicht ab. Berechnet: ${names(c, r.sols[0])}`;
    ul.insertAdjacentHTML('beforeend', `<li class="${ok ? '' : 'bad'}"><b>${ok ? '✓' : '✗'} Fall ${i + 1} · ${c.title}</b><br>${txt}${r.red.length ? `<br><span class="note">Entbehrlich: Hinweis ${r.red.join(', ')}</span>` : ''}</li>`);
    i++; setTimeout(step, 0);
  };
  setTimeout(step, 30);
}

document.addEventListener('click', e => {
  const t = e.target;
  const op = t.closest('[data-open]');
  if (op) return openCase(+op.dataset.open);
  const fl = t.closest('[data-flip]');
  if (fl) { fl.setAttribute('aria-pressed', fl.classList.toggle('on')); return; }
  const act = t.closest('[data-act]');
  const c = CASES[cur];
  if (act) {
    const a = act.dataset.act;
    if (a === 'back') return menu();
    if (a === 'audit') return auditView();
    if (a === 'nb') return showNb(nb.hidden);
    if (a === 'print') return doPrint([cur], false);
    if (a === 'printall') return doPrint(CASES.map((_, i) => i), confirm('Soll am Ende eine Seite mit allen Lösungen mitgedruckt werden?'));
    if (a === 'wipe') { if (confirm('Wirklich alle Spielstände löschen?')) { st = fresh(); save(); menu(); } return; }
    if (a === 'reset') { if (confirm('Gitter und Notizen dieses Falls leeren?')) { st.grid[c.id] = {}; delete st.notes[c.id]; delete st.snap[c.id]; save(); notebook(c); } return; }
    if (a === 'assume') { st.snap[c.id] = Object.assign({}, st.grid[c.id] || {}); save(); notebook(c); return; }
    if (a === 'keep') { delete st.snap[c.id]; save(); notebook(c); return; }
    if (a === 'drop') { st.grid[c.id] = st.snap[c.id] || {}; delete st.snap[c.id]; save(); notebook(c); return; }
    if (a === 'hint') {
      hintN = Math.min(hintN + 1, c.hints.length);
      $('hint').innerHTML = c.hints.slice(0, hintN).map((h, k) => `<div class="hint"><b class="mono">Tipp ${k + 1}</b><br>${h}</div>`).join('');
      if (hintN < c.hints.length) act.textContent = `Nächster Tipp (${hintN + 1} von ${c.hints.length})`;
      else { act.textContent = 'Alle Tipps angezeigt'; act.disabled = true; }
      return;
    }
    if (a === 'check') {
      const msg = $('msg');
      const v = [...app.querySelectorAll('select[data-a]')].map(s => s.value);
      if (v.includes('')) { msg.className = 'msg bad'; msg.textContent = 'Die Anklage ist noch unvollständig.'; return; }
      const ok = v.every((x, k) => +x === c.solIdx[k]);
      if (!ok) {
        if (!st.solved[c.id]) { st.tries[c.id] = (st.tries[c.id] || 0) + 1; save(); }
        msg.className = 'msg bad'; msg.textContent = 'Das hält vor Gericht nicht stand. Die Ermittlungen gehen weiter.';
        $('tries').textContent = triesText(c); return;
      }
      if (!st.solved[c.id]) { st.solved[c.id] = true; if (!st.tries[c.id]) st.first[c.id] = true; save(); }
      msg.className = 'msg'; msg.textContent = st.first[c.id] ? 'Volltreffer auf Anhieb. Fall gelöst!' : 'Volltreffer. Fall gelöst!';
      $('stp').innerHTML = stamp(c);
      const o = $('outro'); o.innerHTML = outro(c, cur); o.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    return;
  }
  const cell = t.closest('.c');
  if (cell && nb.contains(cell)) {
    const g = st.grid[c.id] || (st.grid[c.id] = {}), k = cell.dataset.k;
    const v = ((g[k] || 0) + 1) % 3;
    if (v) g[k] = v; else delete g[k];
    save(); paint(); return;
  }
  const s = t.closest('[data-s]');
  if (s && app.contains(s)) {
    const arr = st.struck[c.id] || (st.struck[c.id] = []);
    const k = s.dataset.s, at = arr.indexOf(k);
    if (at < 0) arr.push(k); else arr.splice(at, 1);
    s.classList.toggle('done', at < 0); save();
  }
});
nb.addEventListener('input', e => {
  const n = e.target.dataset.n; if (!n) return;
  const [r, k] = n.split('.'); st.notes[CASES[cur].id][r][k] = e.target.value; save();
});

if (location.hash === '#pruefen') auditView(); else menu();
})();
if (typeof module !== 'undefined') module.exports = { CASES, SETS, solve, audit };

</script>
