:root{
  --akzent:#1F6F8B; --akzenthell:#E8F2F5; --warm:#E8833A; --warmhell:#FDF0E6;
  --gruen:#2E8B57; --gruenhell:#E6F4EC; --gruentext:#1E6B3A;
  --grau:#666; --linie:#d5dee2; --text:#1d2a30; --bg:#f6f8f9; --weiss:#fff;
  --d1:#1F6F8B; --d2:#E8833A; --d3:#8DB600; --d4:#F2C14E; --d5:#9B5DE5; --d6:#A0A0A0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Andika,system-ui,sans-serif;font-size:18px;line-height:1.5;color:var(--text);background:var(--bg)}
button,input,select{font:inherit}
.hidden{display:none!important}
sup,sub{line-height:0}

header.top{position:sticky;top:0;z-index:20;background:var(--weiss);border-bottom:3px solid var(--akzent);
  display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
header.top .titel{font-weight:700;color:var(--akzent);font-size:20px;cursor:pointer}
header.top .wer{color:var(--grau);font-size:16px}
header.top .platz{flex:1}
.knopf{border:2px solid var(--akzent);background:var(--weiss);color:var(--akzent);border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:700}
.knopf:hover{background:var(--akzenthell)}
.knopf.voll{background:var(--akzent);color:#fff}
.knopf.voll:hover{background:#185a71}
.knopf.warm{border-color:var(--warm);color:var(--warm)}
.knopf.warm.voll{background:var(--warm);color:#fff}
.knopf:disabled{opacity:.45;cursor:default}
.knopf.klein{padding:4px 10px;font-size:15px}
#speichern.ungespeichert{border-color:var(--warm);color:#fff;background:var(--warm)}
#speichern.ungespeichert::after{content:" •"}
main{max-width:960px;margin:0 auto;padding:20px 16px 120px}

.startbox{max-width:560px;margin:40px auto;background:var(--weiss);border-radius:16px;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.startbox h1{margin:0 0 4px;color:var(--akzent);font-size:34px}
.startbox p.unter{margin:0 0 20px;color:var(--grau)}
.feld{display:block;margin:14px 0}
.feld span{display:block;font-weight:700;margin-bottom:4px}
.feld input{width:100%;padding:10px 12px;border:2px solid var(--linie);border-radius:10px}
.feld input:focus{outline:none;border-color:var(--akzent)}
.trenn{display:flex;align-items:center;gap:10px;color:var(--grau);margin:22px 0}
.trenn::before,.trenn::after{content:"";flex:1;height:1px;background:var(--linie)}
.meldung{padding:10px 14px;border-radius:10px;margin:12px 0}
.meldung.fehler{background:var(--warmhell);color:#8a4210}
.ladehinweis{font-size:15px;color:var(--grau)}

.gruss{font-size:26px;font-weight:700;color:var(--akzent);margin:6px 0 2px}
.gruppe{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.gruppe h2{margin:0;font-size:20px}
.gruppe .streifen{width:10px;height:26px;border-radius:3px;background:var(--akzent)}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.kachel{position:relative;background:var(--weiss);border:2px solid var(--linie);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;text-align:left;cursor:pointer;color:inherit;width:100%}
.kachel:hover:not(.zu){border-color:var(--akzent)}
.kachel.zu{cursor:default;opacity:.7}
.kachel .nr{flex:none;min-width:48px;height:40px;padding:0 6px;background:var(--akzent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:16px}
.kachel.analog .nr{background:var(--grau)}
.kachel .txt{font-weight:700;line-height:1.3;padding-right:14px}
.kachel .klein{display:block;font-weight:400;color:var(--grau);font-size:14px;margin-top:2px}
.kachel.fertig{border-color:var(--gruen);background:var(--gruenhell)}
.kachel.fertig .nr{background:var(--gruen)}
.haken{position:absolute;top:4px;right:8px;color:var(--gruen);font-size:22px;font-weight:700}

.kapitelkopf{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.badge{flex:none;min-width:58px;height:58px;padding:0 6px;background:var(--akzent);color:#fff;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.kapitelkopf .thema{color:var(--grau);font-size:15px}
.kapitelkopf h1{margin:0;font-size:26px;line-height:1.2}
.punkte{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 18px}
.punkt{width:30px;height:8px;border-radius:4px;background:var(--linie);border:none;padding:0;cursor:pointer}
.punkt.besucht{background:#9cc3d1}
.punkt.erledigt{background:var(--gruen)}
.punkt.aktiv{outline:3px solid var(--warm);outline-offset:2px}
.karte{background:var(--weiss);border-radius:16px;padding:22px 24px;box-shadow:0 2px 12px rgba(0,0,0,.06);min-height:320px;animation:rein .25s ease}
@keyframes rein{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.karte h2{margin:0 0 4px;font-size:24px}
.kicker{text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--grau)}
.quelle{font-size:13px;color:var(--grau);margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--weiss);border-top:1px solid var(--linie);padding:10px 16px;display:flex;gap:10px;justify-content:center;z-index:15}
.nav .knopf{min-width:140px}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.zwei.breitlinks{grid-template-columns:1.3fr 1fr}
@media (max-width:720px){.zwei,.zwei.breitlinks{grid-template-columns:1fr}}
.grafik{text-align:center;margin:8px 0}
.grafik svg{max-width:100%;height:auto}

.merke{border-left:10px solid var(--akzent);background:var(--akzenthell);padding:14px 18px;border-radius:0 12px 12px 0}
.merke h2{color:var(--akzent)}
.merke table.mk{width:100%;border-collapse:collapse;margin-top:8px}
.merke table.mk>tbody>tr>th{text-align:left;color:var(--akzent);font-size:15px;border-bottom:1px solid #b9cfd7;padding:6px 8px}
.merke table.mk>tbody>tr>td{vertical-align:top;padding:10px 8px;border-bottom:1px solid #b9cfd7}
.merke table.mk>tbody>tr:last-child>td{border-bottom:none}
.merke table.mk>tbody>tr>td:first-child{width:58%}
@media (max-width:720px){.merke table.mk,.merke table.mk>tbody,.merke table.mk>tbody>tr{display:block;width:100%}.merke table.mk>tbody>tr:first-child{display:none}.merke table.mk>tbody>tr>td{display:block;width:100%!important;border-bottom:none}.merke table.mk>tbody>tr>td:last-child{border-bottom:1px solid #b9cfd7;padding-top:0}.merke{padding:12px 12px}}
@media (max-width:480px){header.top{gap:6px;padding:6px 8px}header.top .titel{font-size:16px}header.top .wer{font-size:13px}header.top .knopf{padding:4px 8px;font-size:14px;border-radius:8px}}
.hefterhinweis{margin-top:12px;font-size:15px;color:var(--akzent)}

.aufgabenkopf{display:flex;align-items:center;gap:10px;background:var(--akzenthell);margin:-22px -24px 16px;padding:12px 24px;border-radius:16px 16px 0 0}
.aufgabenkopf b{font-size:21px}
.stufe{margin-left:auto;font-size:15px;color:var(--grau)}
.teil{border-top:1px solid var(--linie);padding:14px 0}
.teil:first-of-type{border-top:none}
.frage{margin-bottom:8px}
.eingabe{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eingabe input{width:140px;padding:8px 10px;border:2px solid var(--linie);border-radius:10px;font-size:20px}
.eingabe input.schmal{width:90px}
.eingabe input:focus,.bruchein input:focus,table.eingabetab input:focus{outline:none;border-color:var(--akzent)}
.eingabe .einheit{color:var(--grau)}
.eingabe .vor{font-weight:700}
.teil.richtig input{border-color:var(--gruen);background:var(--gruenhell)}
.bruchein{display:inline-flex;flex-direction:column;align-items:center;gap:3px;vertical-align:middle}
.bruchein input{width:70px;text-align:center;padding:4px;border:2px solid var(--linie);border-radius:8px;font-size:20px}
.bruchein .strich{width:80px;height:3px;background:var(--text);border-radius:2px}
.rueck{margin-top:8px;padding:8px 12px;border-radius:10px;font-size:16px}
.rueck.gut{background:var(--gruenhell);color:var(--gruentext)}
.rueck.nochnicht{background:var(--warmhell);color:#8a4210}
.tipp{margin-top:8px;padding:8px 12px;border-radius:10px;background:#fff8e1;border:1px dashed var(--d4);font-size:16px}
.loesungzeigen{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--gruenhell);color:var(--gruentext);font-size:16px}
.heftnotiz{margin-top:4px;padding:8px 12px;border-radius:10px;background:#fff8e1;font-size:16px}
.links{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.linkknopf{background:none;border:none;color:var(--akzent);text-decoration:underline;cursor:pointer;padding:0;font-size:16px}
.wahl{display:flex;flex-direction:column;gap:8px}
.wahl button,.chips button{text-align:left;border:2px solid var(--linie);background:var(--weiss);border-radius:10px;padding:8px 12px;cursor:pointer;color:inherit}
.wahl button:hover,.chips button:hover{border-color:var(--akzent)}
.wahl button.gewaehlt,.chips button.gewaehlt{border-color:var(--akzent);background:var(--akzenthell)}
.wahl button.ist-richtig,.chips button.ist-richtig{border-color:var(--gruen);background:var(--gruenhell)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button.weg{visibility:hidden}
.ablage{display:flex;gap:8px;flex-wrap:wrap;min-height:48px;padding:6px;border:2px dashed var(--linie);border-radius:12px;margin:8px 0}
.ablage span{border:2px solid var(--akzent);background:var(--akzenthell);border-radius:10px;padding:6px 12px}
.zuordnen{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
.zuordnen .spalte{display:flex;flex-direction:column;gap:8px}
.zuordnen button{text-align:left;border:2px solid var(--linie);background:var(--weiss);border-radius:10px;padding:8px 12px;cursor:pointer;color:inherit;display:flex;align-items:center;gap:8px}
.zuordnen button .marke{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--linie);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}
.zuordnen button.aktiv{border-color:var(--warm);background:var(--warmhell)}
table.daten{border-collapse:collapse;margin:6px 0 10px}
table.daten td,table.daten th{border:1px solid #9fb3bb;padding:4px 10px;text-align:center}
table.daten th{background:var(--akzenthell)}
table.daten td.l,table.daten th.l{text-align:left}
.tabwrap{overflow-x:auto;max-width:100%}

<body>
<header class="top hidden" id="kopf">
  <span class="titel" id="zurStart" title="Zur Themenkarte"></span>
  <span class="wer" id="wer"></span>
  <span class="platz"></span>
  <button class="knopf" id="speichern" title="Spielstand als Datei speichern">Speichern</button>
  <button class="knopf" id="abmelden" title="Andere Person">Wechseln</button>
</header>
<main id="app"></main>
<nav class="nav hidden" id="nav">
  <button class="knopf" id="zurueck">← Zurück</button>
  <button class="knopf voll" id="weiter">Weiter →</button>
</nav>
<input type="file" id="dateiwahl" accept=".statistik" class="hidden">
<script>
"use strict";
/* =========================================================
   Lernpfad-Engine · Freiarbeit Statistik
   ========================================================= */
const SCHLUESSEL = "Freiarbeit-Statistik-Halle-2026";
const LP = {kurs:null, name:"", untertitel:"", gruppen:[], dateiPraefix:"Statistik", kapitel:{}};
const KAPITEL = LP.kapitel;
let S = null, ungespeichert = false;
let SPEICHERKEY = "";

/* ---------- Hilfen ---------- */
const $ = (sel, el=document) => el.querySelector(sel);
function el(tag, attrs={}, ...kinder){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null || v===false) continue;
    if(k==="class") e.className = v; else if(k==="html") e.innerHTML = v;
    else if(k.startsWith("on") && typeof v==="function") e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for(const k of kinder.flat()){ if(k==null || k===false) continue; e.append(k.nodeType ? k : document.createTextNode(k)); }
  return e;
}
function html(s){ const d = document.createElement("div"); d.innerHTML = s; return d; }
function knoten(x){ if(x==null) return null; if(typeof x==="function") return knoten(x()); if(x.nodeType) return x; return html(x); }
function zahl(txt){
  if(txt==null) return NaN;
  let t = String(txt).trim().replace(/\s/g,"").replace(/[−–]/g,"-").replace(/[a-zA-ZäöüÄÖÜß°%€²]+\.?$/,"");
  const br = t.match(/^(-?\d+)\/(\d+)$/); if(br) return +br[2] ? (+br[1])/(+br[2]) : NaN;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g,"");
  t = t.replace(",", ".");
  if(!/^-?\d*\.?\d+$/.test(t)) return NaN;
  return parseFloat(t);
}
const fmt = (x, st=2) => { const f = Math.pow(10,st); return String(Math.round(x*f)/f).replace(".", ","); };
const ggT = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; };
function br(z,n){ return `<span class="bruchtxt" style="display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px"><span>${z}</span><span style="border-top:2px solid currentColor;min-width:1.1em;text-align:center">${n}</span></span>`; }
function jetzt(){ return new Date().toISOString(); }
function mische(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function zufall(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

/* ---------- Spielstand ---------- */
function neuerStand(vorname, gruppe){
  return {kurs:LP.kurs, version:1, vorname, gruppe, angelegt:jetzt(), zuletzt:jetzt(),
    gespeichert:[], ort:null, karten:{}, uebungen:{}, heft:{}, kapitel:{}};
}
function lokalSichern(){ try{ localStorage.setItem(SPEICHERKEY, JSON.stringify(S)); }catch(e){} }
function merke(){ S.zuletzt = jetzt(); ungespeichert = true; lokalSichern(); zeigeSpeicherStatus(); }
function zeigeSpeicherStatus(){
  const k = $("#speichern"); if(!k) return;
  k.classList.toggle("ungespeichert", ungespeichert);
  k.title = ungespeichert ? "Es gibt Neues. Bitte speichern." : "Spielstand ist gespeichert.";
}
function ladeLokal(){
  try{ const t = localStorage.getItem(SPEICHERKEY); if(t){ const o = JSON.parse(t); if(o && o.kurs===LP.kurs) return o; } }catch(e){}
  return null;
}
function pruefsumme(txt){ let h = 0x811c9dc5; const s = SCHLUESSEL + txt;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8,"0"); }
function verschluesseln(obj){
  const txt = JSON.stringify(obj);
  const b = new TextEncoder().encode(txt), k = new TextEncoder().encode(SCHLUESSEL);
  let bin = ""; for(let i=0;i<b.length;i++) bin += String.fromCharCode(b[i] ^ k[i % k.length] ^ ((i*31) & 255));
  return "STAT1:" + pruefsumme(txt) + ":" + btoa(bin);
}
function entschluesseln(inhalt){
  const t = inhalt.trim().split(":");
  if(t.length !== 3 || t[0] !== "STAT1") throw new Error("Das ist keine Spielstand-Datei.");
  const bin = atob(t[2]), k = new TextEncoder().encode(SCHLUESSEL), b = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i) ^ k[i % k.length] ^ ((i*31) & 255);
  const txt = new TextDecoder().decode(b); const obj = JSON.parse(txt);
  obj._veraendert = (pruefsumme(txt) !== t[1]); return obj;
}
function dateiname(){
  const sauber = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"");
  return `${LP.dateiPraefix}_${sauber(S.vorname)}_${sauber(S.gruppe)}.statistik`;
}
function ladeHerunter(name, inhalt, typ="application/octet-stream"){
  const blob = inhalt instanceof Blob ? inhalt : new Blob([inhalt], {type:typ});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}
function speichereDatei(){
  S.gespeichert.push(jetzt());
  ladeHerunter(dateiname(), verschluesseln(S));
  ungespeichert = false; lokalSichern(); zeigeSpeicherStatus();
  hinweis(`Gespeichert als <b>${dateiname()}</b>. Lege die Datei in deinen Ordner auf dem Server.`);
}
function hinweis(h){
  let t = $("#toast");
  if(!t){ t = el("div",{id:"toast", style:"position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1d2a30;color:#fff;padding:12px 18px;border-radius:12px;z-index:50;max-width:92vw;font-size:16px;box-shadow:0 4px 16px rgba(0,0,0,.2)"}); document.body.appendChild(t); }
  t.innerHTML = h; t.style.display = "block"; clearTimeout(t._t); t._t = setTimeout(()=>t.style.display="none", 6000);
}
window.addEventListener("beforeunload", e => { if(S && ungespeichert){ e.preventDefault(); e.returnValue=""; } });
function uebung(id, info){
  if(!S.uebungen[id]) S.uebungen[id] = {karte:info.karte, titel:info.titel, versuche:0, falsch:[], tipp:false, loesungGezeigt:false,
    ersterVersuchRichtig:null, begonnen:jetzt(), geloest:null};
  return S.uebungen[id];
}
const erledigt = id => { const u = S.uebungen[id]; return !!(u && (u.geloest || u.loesungGezeigt)); };

/* ---------- Start ---------- */
function zeigeStart(){
  $("#kopf").classList.add("hidden"); $("#nav").classList.add("hidden");
  const app = $("#app"); app.innerHTML = "";
  const lokal = ladeLokal();
  const box = el("div",{class:"startbox"}, el("h1",{}, LP.name), el("p",{class:"unter"}, LP.untertitel));
  if(lokal){
    box.append(el("button",{class:"knopf voll", style:"width:100%;padding:14px", onclick:()=>{ S = lokal; ungespeichert = false; zeigeThemen(); }},
      `Weiter als ${lokal.vorname} (${lokal.gruppe})`), el("div",{class:"trenn"},"oder"));
  }
  const vn = el("input",{type:"text", autocomplete:"off", placeholder:"z. B. Mia", maxlength:"30", id:"vorname"});
  const gr = el("input",{type:"text", autocomplete:"off", placeholder:"z. B. 7b", maxlength:"20", id:"lerngruppe"});
  const fehler = el("div",{class:"meldung fehler hidden"});
  box.append(el("h2",{style:"margin:0;font-size:20px"}, "Neu anfangen"),
    el("label",{class:"feld"}, el("span",{},"Vorname"), vn),
    el("label",{class:"feld"}, el("span",{},"Lerngruppe"), gr), fehler,
    el("button",{class:"knopf voll", id:"losgehts", onclick:()=>{
      if(!vn.value.trim() || !gr.value.trim()){ fehler.textContent = "Bitte Vorname und Lerngruppe eintragen."; fehler.classList.remove("hidden"); return; }
      if(lokal && !confirm(`Auf diesem Gerät ist noch der Spielstand von ${lokal.vorname}. Er wird hier gelöscht. Hast du ihn als Datei gespeichert?`)) return;
      S = neuerStand(vn.value.trim(), gr.value.trim()); merke(); zeigeThemen();
    }}, "Los geht's"),
    el("div",{class:"trenn"},"oder"),
    el("h2",{style:"margin:0;font-size:20px"}, "Spielstand laden"),
    el("p",{class:"ladehinweis"}, "Du hast schon angefangen? Wähle deine Datei aus deinem Ordner auf dem Server. Sie endet auf .statistik"),
    el("button",{class:"knopf", onclick:()=>$("#dateiwahl").click()}, "Datei auswählen …"));
  app.append(box);
}
function initKopf(){
  $("#dateiwahl").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = ""; if(!f) return;
    try{
      const obj = entschluesseln(await f.text());
      if(obj.kurs !== LP.kurs) throw new Error("Diese Datei gehört zu einem anderen Lernpfad.");
      delete obj._veraendert; S = obj; ungespeichert = false; lokalSichern();
      hinweis(`Willkommen zurück, ${S.vorname}!`);
      if(S.ort && KAPITEL[S.ort.kapitel]) oeffneKapitel(S.ort.kapitel, S.ort.schritt); else zeigeThemen();
    }catch(err){ alert("Die Datei konnte nicht geladen werden. " + (err.message||"")); }
  });
  $("#speichern").addEventListener("click", speichereDatei);
  $("#zurStart").addEventListener("click", ()=>zeigeThemen());
  $("#abmelden").addEventListener("click", ()=>{
    if(ungespeichert && !confirm("Dein neuester Stand ist noch nicht als Datei gespeichert. Trotzdem wechseln?")) return;
    try{ localStorage.removeItem(SPEICHERKEY); }catch(e){}
    S = null; ungespeichert = false; zeigeStart();
  });
  $("#zurueck").addEventListener("click", ()=>{ if(aktSchritt>0){ aktSchritt--; zeigeSchritt(); } });
  $("#weiter").addEventListener("click", ()=>{ if(aktSchritt < aktKap.schritte.length-1){ aktSchritt++; zeigeSchritt(); } else zeigeThemen(); });
}

/* ---------- Themenkarte ---------- */
function zeigeThemen(){
  $("#kopf").classList.remove("hidden"); $("#nav").classList.add("hidden");
  $("#wer").textContent = `${S.vorname} · ${S.gruppe}`; zeigeSpeicherStatus();
  S.ort = null; lokalSichern();
  const app = $("#app"); app.innerHTML = "";
  app.append(el("div",{class:"gruss"}, `Hallo ${S.vorname}!`),
    el("p",{style:"margin:0;color:var(--grau)"}, LP.themenText || "Wähle ein Kapitel. Die Nummern sind dieselben wie auf den Karten in der Box."));
  for(const g of LP.gruppen){
    app.append(el("div",{class:"gruppe"}, el("span",{class:"streifen", style:`background:${g.farbe}`}), el("h2",{}, g.titel)));
    const k = el("div",{class:"kacheln"});
    for(const kap of g.kapitel){
      const da = !!KAPITEL[kap.id], fertig = !!(S.kapitel[kap.id] && S.kapitel[kap.id].fertig);
      const zusatz = kap.analog ? (kap.analogText || "auf Papier bei deiner Lehrkraft") : (fertig ? "fertig" : (S.kapitel[kap.id] ? "angefangen" : (kap.zusatz||"")));
      const kachel = el("button",{class:"kachel" + (da?"":" zu") + (fertig?" fertig":"") + (kap.analog?" analog":""), "data-kap":kap.id,
          onclick: da ? ()=>oeffneKapitel(kap.id) : null},
        el("span",{class:"nr"}, kap.nr), el("span",{class:"txt"}, kap.titel, el("span",{class:"klein"}, zusatz)),
        fertig ? el("span",{class:"haken"},"✓") : null);
      if(!da) kachel.disabled = true;
      k.append(kachel);
    }
    app.append(k);
  }
  window.scrollTo(0,0);
}

/* ---------- Kapitel ---------- */
let aktKap = null, aktSchritt = 0;
function oeffneKapitel(id, schritt=0){
  aktKap = KAPITEL[id]; aktSchritt = Math.max(0, Math.min(schritt, aktKap.schritte.length-1));
  if(!S.kapitel[id]){ S.kapitel[id] = {begonnen:jetzt(), fertig:null, besucht:[]}; merke(); }
  $("#kopf").classList.remove("hidden"); $("#nav").classList.remove("hidden");
  $("#wer").textContent = `${S.vorname} · ${S.gruppe}`;
  zeigeSchritt();
}
function zeigeSchritt(){
  const kap = aktKap, sch = kap.schritte[aktSchritt];
  S.ort = {kapitel:kap.id, schritt:aktSchritt};
  let neu = false;
  if(!S.karten[sch.karte]){ S.karten[sch.karte] = {geoeffnet:jetzt(), erledigt:null}; neu = true; }
  const kk = S.kapitel[kap.id]; if(!kk.besucht) kk.besucht = [];
  if(!kk.besucht.includes(aktSchritt)){ kk.besucht.push(aktSchritt); neu = true; }
  if(neu) merke(); else lokalSichern();
  const app = $("#app"); app.innerHTML = "";
  app.append(el("div",{class:"kapitelkopf"}, el("div",{class:"badge"}, String(sch.karte)),
    el("div",{}, el("div",{class:"thema"}, kap.thema), el("h1",{}, kap.titel))));
  const punkte = el("div",{class:"punkte"});
  kap.schritte.forEach((s,i)=>{
    const b = el("button",{class:"punkt", title:s.name, "aria-label":s.name, onclick:()=>{ aktSchritt=i; zeigeSchritt(); }});
    if(kk.besucht.includes(i)) b.classList.add("besucht");
    if(s.fertig && s.fertig()) b.classList.add("erledigt");
    if(i===aktSchritt) b.classList.add("aktiv");
    punkte.append(b);
  });
  app.append(punkte);
  const karte = el("div",{class:"karte"}); sch.zeige(karte); app.append(karte);
  $("#zurueck").disabled = aktSchritt===0;
  $("#weiter").textContent = aktSchritt===kap.schritte.length-1 ? "Zur Themenkarte" : "Weiter →";
  window.scrollTo(0,0);
}
function aktualisierePunkte(){
  const p = document.querySelectorAll(".punkt");
  aktKap.schritte.forEach((s,i)=>{ if(p[i] && s.fertig && s.fertig()) p[i].classList.add("erledigt"); });
}
function pruefeKapitelFertig(){
  const kap = aktKap; if(!kap) return false;
  for(const nr of kap.karten){
    const ids = kap.pflicht.filter(id => kap.karteVon[id]===nr);
    const hefte = kap.heftPflicht.filter(id => kap.karteVon[id]===nr);
    if(ids.every(erledigt) && hefte.every(id=>S.heft[id]&&S.heft[id].erledigt) && S.karten[nr] && !S.karten[nr].erledigt) S.karten[nr].erledigt = jetzt();
  }
  const alle = kap.pflicht.every(erledigt) && kap.heftPflicht.every(id => S.heft[id] && S.heft[id].erledigt);
  aktualisierePunkte();
  if(alle && !S.kapitel[kap.id].fertig){ S.kapitel[kap.id].fertig = jetzt(); merke(); return true; }
  return false;
}

/* =========================================================
   Kapitel-Bausteine
   ========================================================= */
function kapitel(def){
  const kap = {id:def.id, titel:def.titel, thema:def.thema, karten:def.karten, schritte:[], pflicht:[], heftPflicht:[], karteVon:{}, heftItems:[], fertigText:def.fertigText, ohneHeftschritt:def.ohneHeftschritt, heftTitel:def.heftTitel};
  KAPITEL[def.id] = kap;
  for(const s of def.schritte){ s._init && s._init(kap); kap.schritte.push(s); }
  if(kap.heftItems.length && !def.ohneHeftschritt) kap.schritte.push(heftSchritt(kap));
  kap.schritte.push(fertigSchritt(kap));
  return kap;
}
function kopf(kicker, titel){ return [kicker ? el("div",{class:"kicker"}, kicker) : null, titel ? el("h2",{}, titel) : null]; }

function einstieg(o){
  return {name:"Einstieg", karte:o.karte, zeige(k){
    k.append(...kopf(o.kicker, o.titel));
    const text = knoten(o.text), grafik = o.grafik ? el("div",{class:"grafik"}, knoten(o.grafik)) : null;
    if(grafik && !o.untereinander) k.append(el("div",{class:"zwei"}, text, grafik)); else k.append(text, grafik);
    if(o.zusatz) k.append(knoten(o.zusatz));
    if(o.quelle) k.append(el("div",{class:"quelle"}, o.quelle));
    if(o.darum) k.append(el("p",{}, el("b",{},"Darum geht es: "), o.darum));
  }};
}
function info(o){
  return {name:o.name||"Info", karte:o.karte, zeige(k){ k.append(...kopf(o.kicker, o.titel), knoten(o.inhalt)); }};
}
/* Entdecken: o.baue(box, geschafft, u) – geschafft() aufrufen, wenn die Idee gefunden wurde */
function entdecken(o){
  const s = {name:"Entdecken", karte:o.karte, _init(kap){ s.id = kap.id+":entdecken"; kap.pflicht.push(s.id); kap.karteVon[s.id]=o.karte; s.kap = kap; },
    fertig:()=>erledigt(s.id), zeige(k){
      const u = uebung(s.id, {karte:o.karte, titel:"Entdecken: " + o.titel});
      k.append(...kopf(o.kicker||"Entdecken", o.titel), knoten(o.text));
      const box = el("div",{class:"entdecken"}); k.append(box);
      const geschafft = (zuege) => { if(!u.geloest){ u.versuche = 1; if(zuege!=null) u.zuege = zuege; u.ersterVersuchRichtig = true; u.geloest = jetzt(); merke(); pruefeKapitelFertig(); } };
      o.baue(box, geschafft, u, s.kap.id);
    }};
  return s;
}
function merkeKasten(o){
  const s = {name:"Merke", karte:o.karte, _init(kap){
      const id = kap.id+":merke"; kap.heftPflicht.push(id); kap.karteVon[id]=o.karte;
      kap.heftItems.push({id, karte:o.karte, titel:"Merkkasten übertragen", text:`Übertrage den Merkkasten „${o.titel||kap.titel}“ in deinen Hefter.`, muster:`Vergleiche mit dem Merkkasten auf Karte ${o.karte}.`}); },
    zeige(k){
      const m = el("div",{class:"merke"}, el("h2",{}, o.ueberschrift || "Merke"));
      const t = el("table",{class:"mk"}); const tb = el("tbody"); t.append(tb);
      tb.append(el("tr",{}, el("th",{}, "Erklärung"), el("th",{}, "Beispiel")));
      for(const [a,b] of o.zeilen) tb.append(el("tr",{}, el("td",{html:a}), el("td",{}, knoten(b))));
      m.append(t, el("div",{class:"hefterhinweis"}, "📒 Übertrage den Merkkasten in deinen Hefter. Abhaken kannst du das am Ende des Kapitels."));
      k.append(m); if(o.danach) k.append(knoten(o.danach));
    }};
  return s;
}
/* Aufgabe: {karte, nr, stufe, intro, teile:[{k, typ, ...}], piktogramm} */
function aufgabe(o){
  const knobeln = /knobel|freiwillig/i.test(o.stufe||"") || o.freiwillig;
  const s = {name:"Aufgabe " + o.nr + (knobeln?" (Knobeln)":""), karte:o.karte, freiwillig:knobeln, ids:[], teile:o.teile,
    _init(kap){
      s.kap = kap;
      for(const t of o.teile){
        t.id = `${kap.id}:${o.idnr||o.nr}${t.k||""}`; t.karte = o.karte;
        t.titel = `${o.idnr?o.karte+" ":""}A${o.nr}${t.k?" "+t.k+")":""} ${t.kurz||""}`.trim();
        kap.karteVon[t.id] = o.karte;
        if(t.typ==="heft"){
          kap.heftItems.push({id:t.id, karte:o.karte, titel:`${t.ort==="computer"?"💻 ":""}Aufgabe ${o.nr}${t.k?" "+t.k+")":""}`, text:t.frage, muster:t.muster});
          if(!knobeln) kap.heftPflicht.push(t.id);
        } else { s.ids.push(t.id); if(!knobeln && !t.freiwillig) kap.pflicht.push(t.id); }
      }
    },
    fertig:()=> s.ids.length ? s.ids.every(erledigt) : o.teile.every(t=>S.heft[t.id]&&S.heft[t.id].erledigt),
    zeige(k){
      k.append(el("div",{class:"aufgabenkopf"}, el("span",{style:"font-size:22px"}, o.piktogramm || (knobeln?"🧩":(o.computer?"💻":"✏️"))),
        el("b",{}, "Aufgabe " + o.nr), o.titel ? el("span",{}, "· " + o.titel) : null, el("span",{class:"stufe"}, o.stufe||"")));
      if(o.intro) k.append(knoten(o.intro));
      for(const t of o.teile) k.append(t.typ==="heft" ? heftTeil(t) : baueTeil(t));
      if(o.quelle) k.append(el("div",{class:"quelle"}, o.quelle));
    }};
  return s;
}
function heftTeil(t){

function baueTeil(t){
  const u = uebung(t.id, t);
  const box = el("div",{class:"teil" + (u.geloest ? " richtig":""), "data-id":t.id});
  box.append(el("div",{class:"frage", html:(t.k ? t.k+") " : "") + (t.frage||"")}));
  const rueck = el("div",{class:"rueck hidden"});
  const tippBox = el("div",{class:"tipp hidden", html:"<b>Tipp:</b> " + (t.tipp||"")});
  const loesBox = el("div",{class:"loesungzeigen hidden", html:"<b>Lösung:</b> " + (t.loesung||"")});
  const links = el("div",{class:"links"});
  const tippKnopf = el("button",{class:"linkknopf", onclick:()=>{ tippBox.classList.remove("hidden"); tippKnopf.remove(); if(!u.tipp){ u.tipp=true; u.tippZeit=jetzt(); merke(); } }}, "Tipp anzeigen");
  const loesKnopf = el("button",{class:"linkknopf hidden", onclick:()=>{ loesBox.classList.remove("hidden"); loesKnopf.remove(); if(!u.loesungGezeigt){ u.loesungGezeigt=true; u.loesungZeit=jetzt(); merke(); pruefeKapitelFertig(); } }}, "Lösung anzeigen");
  if(t.typ==="selbst") return selbstTeil(t, u, box);
  if(t.tipp && !u.geloest) links.append(tippKnopf);
  if(t.loesung) links.append(loesKnopf);
  if(u.tipp && !u.geloest){ tippBox.classList.remove("hidden"); tippKnopf.remove(); }
  if(u.loesungGezeigt) loesBox.classList.remove("hidden");
  else if(u.versuche>=3 && !u.geloest) loesKnopf.classList.remove("hidden");

  function auswerten(richtig, antwortText, meldung){
    u.versuche++;
    if(u.ersterVersuchRichtig===null) u.ersterVersuchRichtig = richtig;
    if(richtig){
      u.geloest = jetzt(); box.classList.add("richtig");
      rueck.className = "rueck gut"; rueck.innerHTML = (t.lob || "Richtig!") + (t.nachher ? " " + t.nachher : "");
      tippKnopf.remove(); loesKnopf.remove();
    }else{
      if(u.falsch.length < 8) u.falsch.push(antwortText);
      rueck.className = "rueck nochnicht";
      rueck.innerHTML = meldung || (typeof t.fehler==="function" ? t.fehler(antwortText) : null) || "Noch nicht. Prüfe deine Rechnung noch einmal.";
      if(u.versuche>=3 && !u.loesungGezeigt && t.loesung) loesKnopf.classList.remove("hidden");
    }
    if(t.beiAuswertung) t.beiAuswertung(richtig);
    merke(); pruefeKapitelFertig();
    return richtig;
  }
  const typ = TEILTYPEN[t.typ];
  if(!typ) throw new Error("Unbekannter Typ " + t.typ);
  box.append(typ(t, u, auswerten, rueck));
  if(u.geloest){ rueck.className = "rueck gut"; rueck.innerHTML = "Erledigt." + (t.nachher ? " " + t.nachher : ""); }
  box.append(rueck, tippBox, loesBox, links);
  return box;
}
function hinweisLeer(rueck, text){ rueck.className = "rueck nochnicht"; rueck.textContent = text; }

const TEILTYPEN = {};
/* --- Zahl(en) und Brüche ---
   zahl:   {wert, tol, einheit, vor}
   felder: {felder:[{wert,tol,einheit,vor} | {art:"bruch", z, n, gekuerzt}]}
   bruch:  {z, n, gekuerzt}                                                    */
function feldBauen(f, geloest){
  if(f.art==="bruch"){
    const zi = el("input",{type:"text", inputmode:"numeric", autocomplete:"off", "aria-label":"Zähler"}),
          ni = el("input",{type:"text", inputmode:"numeric", autocomplete:"off", "aria-label":"Nenner"});
    if(geloest){ zi.value = f.z; ni.value = f.n; zi.disabled = ni.disabled = true; }
    const node = el("span",{}, f.vor ? el("span",{class:"vor"}, f.vor+" ") : null, el("span",{class:"bruchein"}, zi, el("span",{class:"strich"}), ni), f.einheit ? el("span",{class:"einheit"}, " "+f.einheit) : null);
    return {node, inputs:[zi,ni], wert:()=>zahl(zi.value)/zahl(ni.value), gekuerzt:()=>ggT(zahl(zi.value),zahl(ni.value))===1, text:()=>`${zi.value.trim()}/${ni.value.trim()}`,
      leer:()=>!zi.value.trim()||!ni.value.trim(),
      pruefe:()=>{ const z=zahl(zi.value), n=zahl(ni.value); if(isNaN(z)||isNaN(n)||n===0) return "leer";
        if(Math.abs(z/n - f.z/f.n) > 1e-9) return false;
        if(f.gekuerzt && ggT(z,n)!==1) return "kuerzen"; return true; }};
  }
  const i = el("input",{type:"text", inputmode:"decimal", autocomplete:"off", "aria-label":f.einheit||f.vor||"Antwort", class:f.schmal?"schmal":null});
  if(geloest){ i.value = f.anzeige || fmt(f.wert, 3); i.disabled = true; }
  const node = el("span",{}, f.vor ? el("span",{class:"vor", html:f.vor+" "}) : null, i, f.einheit ? el("span",{class:"einheit"}, " "+f.einheit) : null);
  return {node, inputs:[i], wert:()=>zahl(i.value), text:()=>i.value.trim(), leer:()=>!i.value.trim(),
    pruefe:()=>{ const w = zahl(i.value); if(isNaN(w)) return "leer"; return Math.abs(w - f.wert) <= (f.tol ?? 0.001); }};
}
TEILTYPEN.zahl = (t,u,aus,rueck) => TEILTYPEN.felder(Object.assign({}, t, {felder:[{wert:t.wert, tol:t.tol, einheit:t.einheit, vor:t.vor, anzeige:t.anzeige}]}), u, aus, rueck);
TEILTYPEN.bruch = (t,u,aus,rueck) => TEILTYPEN.felder(Object.assign({}, t, {felder:[{art:"bruch", z:t.z, n:t.n, gekuerzt:t.gekuerzt!==false, vor:t.vor}]}), u, aus, rueck);
TEILTYPEN.felder = (t,u,aus,rueck) => {
  const reihe = el("div",{class:"eingabe"});
  const fs = t.felder.map(f => { if(f.umbruch) reihe.append(el("div",{style:"flex-basis:100%;height:0"})); const x = feldBauen(f, !!u.geloest); reihe.append(x.node); return x; });
  const pk = el("button",{class:"knopf voll klein", onclick:()=>pruefen()}, "Prüfen");
  if(!u.geloest) reihe.append(pk);
  fs.forEach(f => f.inputs.forEach(i => i.addEventListener("keydown", e => { if(e.key==="Enter") pruefen(); })));
  function pruefen(){
    if(u.geloest) return;
    let erg = fs.map(f=>f.pruefe());
    if(t.pruefe && !erg.includes("leer")){ const r = t.pruefe(fs.map(f=>f.wert()), fs); erg = fs.map(()=> r===true ? true : (r==="kuerzen" ? "kuerzen" : false)); }
    if(erg.includes("leer")) return hinweisLeer(rueck, fs.some(f=>f.leer()) ? "Bitte fülle alle Felder aus." : "Bitte gib eine Zahl ein.");
    const ok = erg.every(e=>e===true);
    const meldung = (!ok && erg.includes("kuerzen") && erg.every(e=>e===true||e==="kuerzen")) ? "Der Anteil stimmt. Kürze den Bruch noch so weit wie möglich." : null;
    if(aus(ok, fs.map(f=>f.text()).join(" | "), meldung)){ fs.forEach(f=>f.inputs.forEach(i=>i.disabled=true)); pk.remove(); }
  }
  return reihe;
};
/* --- Auswahl --- wahl: {optionen, richtig}  mehr: {optionen, richtig:[..]} */
TEILTYPEN.wahl = (t,u,aus,rueck) => wahlBauen(t,u,aus,rueck,false);
TEILTYPEN.mehr = (t,u,aus,rueck) => wahlBauen(t,u,aus,rueck,true);
function wahlBauen(t,u,aus,rueck,mehr){
  const hülle = el("div");
  const wahl = el("div",{class: (mehr || t.chips) ? "chips" : "wahl"});
  const gewaehlt = new Set(), richtig = new Set([].concat(t.richtig));
  const knoepfe = t.optionen.map((o,k) => {
    const b = el("button",{html:o, onclick:()=>{
      if(u.geloest) return;
      if(mehr){ gewaehlt.has(k) ? gewaehlt.delete(k) : gewaehlt.add(k); b.classList.toggle("gewaehlt"); }
      else { knoepfe.forEach(x=>x.classList.remove("gewaehlt")); b.classList.add("gewaehlt"); gewaehlt.clear(); gewaehlt.add(k); pruefen(); }
    }});
    wahl.append(b); return b;
  });
  if(u.geloest) knoepfe.forEach((b,k)=>{ if(richtig.has(k)) b.classList.add("ist-richtig"); });
  const pz = el("div",{style:"margin-top:8px"}, el("button",{class:"knopf voll klein", onclick:()=>pruefen()}, "Prüfen"));
  function pruefen(){
    if(u.geloest) return;
    if(!gewaehlt.size) return hinweisLeer(rueck, "Wähle zuerst aus.");
    const ok = gewaehlt.size===richtig.size && [...gewaehlt].every(k=>richtig.has(k));
    const meldung = (!ok && t.fehlerJe) ? [...gewaehlt].map(k=>t.fehlerJe[k]).filter(Boolean)[0] : null;
    if(aus(ok, [...gewaehlt].map(k=>t.optionen[k].replace(/<[^>]+>/g,"")).join(" + "), meldung)){
      knoepfe.forEach((b,k)=>{ b.classList.remove("gewaehlt"); if(richtig.has(k)) b.classList.add("ist-richtig"); }); pz.remove(); }
  }
  hülle.append(wahl); if(mehr && !u.geloest) hülle.append(pz);
  return hülle;
}
/* --- Reihenfolge: {items:[html], werte:[zahlen] (aufsteigend richtig) oder richtig:[indexfolge], absteigend} --- */
TEILTYPEN.reihenfolge = (t,u,aus,rueck) => {
  const hülle = el("div");
  const ablage = el("div",{class:"ablage"}), quelle = el("div",{class:"chips"});
  let folge = [];
  const knoepfe = t.items.map((it,k) => el("button",{html:it, onclick:()=>{ if(u.geloest || folge.includes(k)) return; folge.push(k); zeichne(); if(folge.length===t.items.length) pruefen(); }}));
  knoepfe.forEach(b=>quelle.append(b));
  const reset = el("button",{class:"knopf klein", onclick:()=>{ if(u.geloest) return; folge=[]; zeichne(); }}, "Zurücksetzen");
  function richtigeFolge(){
    if(t.richtig) return t.richtig;
    const idx = t.items.map((_,k)=>k); idx.sort((a,b)=> t.absteigend ? t.werte[b]-t.werte[a] : t.werte[a]-t.werte[b]); return idx;
  }
  function zeichne(){
    ablage.innerHTML = ""; folge.forEach((k,i)=>ablage.append(el("span",{html:t.items[k] + (i<folge.length-1 ? (t.zeichen ? " " + t.zeichen : "") : "")})));
    if(!folge.length) ablage.append(el("span",{style:"border:none;background:none;color:var(--grau)"}, t.leerText || "Tippe die Werte der Reihe nach an."));
    knoepfe.forEach((b,k)=>b.classList.toggle("weg", folge.includes(k)));
  }
  function pruefen(){
    let ok;
    if(t.werte){ ok = folge.every((k,i)=> i===0 || (t.absteigend ? t.werte[folge[i-1]] >= t.werte[k] : t.werte[folge[i-1]] <= t.werte[k])); }
    else ok = folge.every((k,i)=>k===t.richtig[i]);
    if(!aus(ok, folge.map(k=>t.items[k].replace(/<[^>]+>/g,"")).join(" | "), ok?null:"Noch nicht. Tippe auf „Zurücksetzen“ und versuche es noch einmal.")){ }
    else reset.remove();
  }
  if(u.geloest){ folge = richtigeFolge(); }
  zeichne();
  hülle.append(ablage, quelle); if(!u.geloest) hülle.append(el("div",{style:"margin-top:8px"}, reset));
  return hülle;
};
/* --- Zuordnen: {links:[html], rechts:[html], paare:[index rechts je links]} --- */
const FARBEN = ["#1F6F8B","#E8833A","#8DB600","#9B5DE5","#C0392B","#F2C14E","#16a085","#7f8c8d"];
TEILTYPEN.zuordnen = (t,u,aus,rueck) => {
  const hülle = el("div");
  const zu = new Array(t.links.length).fill(null);
  let aktiv = null;
  const L = t.links.map((x,i)=>el("button",{onclick:()=>{ if(u.geloest) return; aktiv = i; male(); }}, el("span",{class:"marke"}), el("span",{html:x})));
  const R = t.rechts.map((x,j)=>el("button",{onclick:()=>{ if(u.geloest || aktiv===null) return; for(let i=0;i<zu.length;i++) if(zu[i]===j) zu[i]=null; zu[aktiv]=j; aktiv=null; male(); }}, el("span",{class:"marke"}), el("span",{html:x})));
  function male(){
    L.forEach((b,i)=>{ b.classList.toggle("aktiv", aktiv===i); const m=b.firstChild; m.style.background = zu[i]!==null ? FARBEN[i%FARBEN.length] : "transparent"; m.style.borderColor = zu[i]!==null ? FARBEN[i%FARBEN.length] : "var(--linie)"; m.textContent = zu[i]!==null ? i+1 : ""; });
    R.forEach((b,j)=>{ const i = zu.indexOf(j); const m=b.firstChild; m.style.background = i>=0 ? FARBEN[i%FARBEN.length] : "transparent"; m.style.borderColor = i>=0 ? FARBEN[i%FARBEN.length] : "var(--linie)"; m.textContent = i>=0 ? i+1 : ""; });
  }
  if(u.geloest) t.paare.forEach((j,i)=>zu[i]=j);
  const pk = el("button",{class:"knopf voll klein", onclick:()=>{
    if(zu.some(x=>x===null)) return hinweisLeer(rueck, "Ordne zuerst alles zu.");
    const anz = zu.filter((j,i)=>j===t.paare[i]).length;
    if(aus(anz===zu.length, zu.map((j,i)=>`${i+1}→${j+1}`).join(" "), `${anz} von ${zu.length} Zuordnungen stimmen. Ändere die anderen.`)) pk.remove();
  }}, "Prüfen");
  hülle.append(el("p",{class:"ladehinweis", style:"margin:0 0 6px"}, "Tippe links etwas an und dann rechts das Passende."),
    el("div",{class:"zuordnen"}, el("div",{class:"spalte"}, L), el("div",{class:"spalte"}, R)));
  if(!u.geloest) hülle.append(el("div",{style:"margin-top:8px"}, pk));
  male(); return hülle;
};
/* --- Tabelle mit Eingabefeldern: {kopf:[..], zeilen:[[zelle..]]}; zelle: "Text" | {w:Zahl, tol} | {b:[z,n]} --- */
TEILTYPEN.tabelle = (t,u,aus,rueck) => {
  const hülle = el("div",{class:"tabwrap"}); const tab = el("table",{class:"eingabetab"}); const felder = [];
  const zeile = (zellen, kopf) => { const tr = el("tr"); zellen.forEach((z,ci)=>{
    if(typeof z === "string" || typeof z === "number"){ tr.append(el(kopf || (t.ersteSpalteKopf!==false && ci===0) ? "th" : "td", {html:String(z)})); return; }
    const i = el("input",{type:"text", inputmode:"decimal", autocomplete:"off"});
    if(u.geloest){ i.value = z.b ? `${z.b[0]}/${z.b[1]}` : (z.anzeige || fmt(z.w,3)); i.disabled = true; i.classList.add("ok"); }
    i.addEventListener("keydown", e=>{ if(e.key==="Enter") pruefen(); });
    felder.push({i, z}); tr.append(el("td",{}, i)); }); return tr; };
  if(t.kopf) tab.append(zeile(t.kopf, "th"));
  t.zeilen.forEach(z=>tab.append(zeile(z)));

    const v = f.i.value.trim(); if(!v) return null;
    if(f.z.b){ const m = v.match(/^(\d+)\s*\/\s*(\d+)$/); if(!m) return false; return Math.abs(m[1]/m[2] - f.z.b[0]/f.z.b[1])<1e-9 && (f.z.ungekuerzt || ggT(+m[1],+m[2])===1); }
    const w = zahl(v); if(isNaN(w)) return false; return Math.abs(w - f.z.w) <= (f.z.tol ?? 0.001);
  }
  function pruefen(){
    if(u.geloest) return;
    const erg = felder.map(stimmt);
    if(erg.includes(null)) return hinweisLeer(rueck, "Bitte fülle alle Felder aus.");
    felder.forEach((f,k)=>{ f.i.classList.toggle("ok", erg[k]); f.i.classList.toggle("falsch", !erg[k]); });
    const anz = erg.filter(Boolean).length;
    if(aus(anz===felder.length, felder.map(f=>f.i.value.trim()).join(" | "), `${anz} von ${felder.length} Feldern stimmen. Die orangen Felder musst du noch einmal prüfen.` + (t.hinweisBruch ? " Brüche schreibst du so: 3/4. Kürze so weit wie möglich." : ""))){ felder.forEach(f=>f.i.disabled=true); pk.remove(); }
  }
  hülle.append(tab); if(!u.geloest) hülle.append(el("div",{style:"margin-top:4px"}, pk));
  return hülle;
};
/* --- Säulen/Punkte einstellen: {namen, werte (Ziel), max, schritt, einheit, start, modus:"saeulen"|"linie"|"balken"} --- */
TEILTYPEN.saeulen = (t,u,aus,rueck) => {

/* --- Prüfungsteil: im Heft bearbeiten, Erwartungshorizont aufdecken, BE selbst eintragen --- */

/* =========================================================
   Diagramme (SVG)

const NS = "http://www.w3.org/2000/svg";
function tick(max, schritt){ const a=[]; for(let y=0;y<=max+1e-9;y+=schritt) a.push(Math.round(y*1000)/1000); return a; }
/* Säulen- oder Balkendiagramm, auch gruppiert: reihen:[{werte, farbe, name}] */
function svgSaeulen(o){
  const reihen = o.reihen || [{werte:o.werte, farbe:o.farbe||"var(--d1)"}];
  const quer = o.balken, B = o.breite || 460, H = o.hoehe || (quer ? 40 + o.namen.length*34*Math.max(1,reihen.length*0.7) : 250);
  const min = o.min || 0, max = o.max, schritt = o.schritt;
  const L = quer ? (o.links || 110) : 50, R = o.linieText ? 92 : 16, O = o.titel ? 34 : 14, U = (o.legende ? 54 : 34) + (o.xTitel ? 16 : 0);
  const w = B-L-R, h = H-O-U, n = o.namen.length;
  const sk = v => (v-min)/(max-min);
  let s = `<svg xmlns="${NS}" viewBox="0 0 ${B} ${H}" width="${B}" role="img" aria-label="${o.titel||"Diagramm"}" style="max-width:100%">`;
  if(o.titel) s += `<text x="${B/2}" y="20" text-anchor="middle" font-weight="700" font-size="15" fill="#1d2a30">${o.titel}</text>`;
  for(const y of tick(max-min, schritt).map(v=>v+min)){
    if(quer){ const xx = L + w*sk(y); s += `<line x1="${xx}" x2="${xx}" y1="${O}" y2="${O+h}" stroke="#e3e9ec"/><text x="${xx}" y="${O+h+18}" text-anchor="middle" font-size="13" fill="#555">${String(y).replace(".",",")}</text>`; }
    else { const yy = O+h-h*sk(y); s += `<line x1="${L}" x2="${L+w}" y1="${yy}" y2="${yy}" stroke="#e3e9ec"/><text x="${L-6}" y="${yy+5}" text-anchor="end" font-size="13" fill="#555">${String(y).replace(".",",")}</text>`; }
  }
  if(o.einheit && !quer) s += `<text x="13" y="${O+h/2}" font-size="13" fill="#555" transform="rotate(-90 13 ${O+h/2})" text-anchor="middle">${o.einheit}</text>`;
  if(o.einheit && quer) s += `<text x="${L+w/2}" y="${H-6}" font-size="13" fill="#555" text-anchor="middle">${o.einheit}</text>`;
  const gruppe = (quer ? h : w)/n, bw = Math.min(o.bw || 64, gruppe*0.7/reihen.length);
  const texte = [];
  reihen.forEach((r,ri)=>{ r.werte.forEach((v,i)=>{
    const mitte = (quer ? O : L) + gruppe*(i+0.5) + (ri - (reihen.length-1)/2)*bw;
    const len = (quer ? w : h)*sk(v);
    if(quer){ s += `<rect x="${L}" y="${mitte-bw/2}" width="${Math.max(0,len)}" height="${bw*0.92}" fill="${r.farbe}" rx="2"/>`;
      if(o.werteZeigen!==false) texte.push(`<text x="${L+len+5}" y="${mitte+5}" font-size="13" fill="#1d2a30">${String(v).replace(".",",")}</text>`); }
    else { s += `<rect x="${mitte-bw/2}" y="${O+h-len}" width="${bw*0.92}" height="${Math.max(0,len)}" fill="${r.farbe}" rx="2"/>`;
      if(o.werteZeigen!==false) texte.push(`<text x="${mitte}" y="${O+h-len-6}" text-anchor="middle" font-size="13" fill="#1d2a30" stroke="#fff" stroke-width="4" paint-order="stroke">${String(v).replace(".",",")}</text>`); }
  }); });
  o.namen.forEach((nm,i)=>{ const mitte = (quer ? O : L) + gruppe*(i+0.5);
    if(quer) s += `<text x="${L-6}" y="${mitte+5}" text-anchor="end" font-size="14" fill="#1d2a30">${nm}</text>`;
    else s += `<text x="${mitte}" y="${O+h+20}" text-anchor="middle" font-size="${o.namen.length>8?12:14}" fill="#1d2a30">${nm}</text>`; });
  s += quer ? `<line x1="${L}" x2="${L}" y1="${O}" y2="${O+h}" stroke="#555"/>` : `<line x1="${L}" x2="${L+w}" y1="${O+h}" y2="${O+h}" stroke="#555"/>`;
  if(o.linie!=null){ const yy = O+h-h*sk(o.linie);
    s += `<line x1="${L}" x2="${L+w}" y1="${yy}" y2="${yy}" stroke="var(--d2)" stroke-width="2.5" stroke-dasharray="7 5"/>`;
    if(o.linieText){ const [a,...b] = o.linieText.split(" "); s += `<text x="${L+w+6}" y="${yy-3}" font-size="13" font-weight="700" fill="var(--d2)">${a}</text><text x="${L+w+6}" y="${yy+13}" font-size="13" font-weight="700" fill="var(--d2)">${b.join(" ")}</text>`; } }
  s += texte.join("");
  if(o.legende){ let x = L; reihen.forEach(r=>{ s += `<rect x="${x}" y="${H-18}" width="14" height="14" fill="${r.farbe}"/><text x="${x+20}" y="${H-6}" font-size="13">${r.name}</text>`; x += 30 + r.name.length*8; }); }
  if(o.xTitel) s += `<text x="${L+w/2}" y="${H-4}" text-anchor="middle" font-size="13" fill="#555">${o.xTitel}</text>`;
  return s + "</svg>";
}
/* Liniendiagramm: reihen:[{werte, farbe, name}] */
function svgLinie(o){
  const reihen = o.reihen || [{werte:o.werte, farbe:"var(--d1)"}];
  const B = o.breite || 480, H = o.hoehe || 250, min = o.min||0, max = o.max, L = 50, R = 16, O = o.titel?34:14, U = (o.legende?54:34) + (o.xTitel?16:0);
  const w = B-L-R, h = H-O-U, n = o.namen.length, x = i => L + w*(i+0.5)/n, y = v => O+h-h*(v-min)/(max-min);

  if(o.bezug!=null) s += `<line x1="${L}" x2="${L+w}" y1="${y(o.bezug)}" y2="${y(o.bezug)}" stroke="var(--d2)" stroke-width="2" stroke-dasharray="6 5"/>` + (o.bezugText ? `<text x="${L+4}" y="${y(o.bezug)+16}" text-anchor="start" stroke="#fff" stroke-width="4" paint-order="stroke" font-size="12" font-weight="700" fill="var(--d2)">${o.bezugText}</text>` : "");

    s += `<polyline fill="none" stroke="${r.farbe}" stroke-width="2.5" ${r.strich?'stroke-dasharray="7 5"':""} points="${pts}"/>`;
    r.werte.forEach((v,i)=>{ if(v==null) return; s += r.offen ? `<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="#fff" stroke="${r.farbe}" stroke-width="2.5"/>` : `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${r.farbe}"/>`;
      if(o.werteZeigen && !r.ohneWerte) s += `<text x="${x(i)}" y="${y(v)-9}" text-anchor="middle" font-size="12" stroke="#fff" stroke-width="4" paint-order="stroke">${r.wertText ? r.wertText(v) : String(v).replace(".",",")}</text>`; }); });
  if(o.xTitel) s += `<text x="${L+w/2}" y="${H-4}" text-anchor="middle" font-size="13" fill="#555">${o.xTitel}</text>`;
  if(o.legende){ let xx = L; reihen.filter(r=>r.name).forEach(r=>{ s += `<line x1="${xx}" x2="${xx+18}" y1="${H-(o.xTitel?27:11)}" y2="${H-(o.xTitel?27:11)}" stroke="${r.farbe}" stroke-width="3"/><text x="${xx+24}" y="${H-(o.xTitel?22:6)}" font-size="13">${r.name}</text>`; xx += 40 + r.name.length*8; }); }
  return s + "</svg>";
}
/* Kreisdiagramm: teile:[{wert, name, farbe}] */
function svgKreis(o){
  const r = o.r || 90, B = o.legende===false ? 2*r+20 : 2*r+200, H = 2*r+20, cx = r+10, cy = r+10;
  const summe = o.teile.reduce((a,t)=>a+t.wert,0);
  let s = `<svg xmlns="${NS}" viewBox="0 0 ${B} ${H}" width="${B}" style="max-width:100%" role="img" aria-label="${o.titel||"Kreisdiagramm"}">`;
  let a = -90;
  o.teile.forEach((t,i)=>{
    const w = 360*t.wert/summe, a2 = a + w, f = t.farbe || FARBEN[i%FARBEN.length];
    const p = (g)=>[cx + r*Math.cos(g*Math.PI/180), cy + r*Math.sin(g*Math.PI/180)];
    const [x1,y1] = p(a), [x2,y2] = p(a2);
    if(w >= 359.99) s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" stroke="#fff" stroke-width="2"/>`;
    else if(w > 0) s += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${w>180?1:0} 1 ${x2},${y2} Z" fill="${f}" stroke="#fff" stroke-width="2"/>`;
    if(o.prozente && w>18){ const [tx,ty] = [cx + r*0.62*Math.cos((a+w/2)*Math.PI/180), cy + r*0.62*Math.sin((a+w/2)*Math.PI/180)];
      s += `<text x="${tx}" y="${ty+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${o.prozente===true ? fmt(100*t.wert/summe,1)+" %" : o.prozente(t)}</text>`; }
    if(o.legende!==false){ s += `<rect x="${2*r+30}" y="${20+i*24}" width="16" height="16" fill="${f}"/><text x="${2*r+52}" y="${33+i*24}" font-size="14">${t.name}</text>`; }
    a = a2;
  });
  if(o.linien){ for(let k=0;k<o.linien;k++){ const g = -90 + 360*k/o.linien; s += `<line x1="${cx}" y1="${cy}" x2="${cx + r*Math.cos(g*Math.PI/180)}" y2="${cy + r*Math.sin(g*Math.PI/180)}" stroke="#666" stroke-width="1"/>`; } s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#666" stroke-width="1.5"/>`; }
  return s + "</svg>";
}
/* Streifendiagramm */
function svgStreifen(o){

/* Zahlengerade mit Punkten */
function svgZahlengerade(o){

}

/* Zieh-Diagramm: Säulen oder Punkte mit Maus/Finger oder ▲▼ einstellen */
function ziehDiagramm(o){
  const B = o.breite || 480, H = o.hoehe || 270, L = 50, R = 14, O = o.titel ? 34 : 24, U = 36, h = H-O-U, w = B-L-R, n = o.namen.length;
  const min = o.min || 0, max = o.max, sch = o.schritt;
  const werte = o.werte.slice();
  const y = v => O + h - h*(v-min)/(max-min);
  const svg = document.createElementNS(NS,"svg"); svg.setAttribute("viewBox",`0 0 ${B} ${H}`); svg.setAttribute("width", B); svg.style.maxWidth = "100%";
  const mk = (tag, at, txt) => { const e = document.createElementNS(NS, tag); for(const k in at) e.setAttribute(k, at[k]); if(txt!=null) e.textContent = txt; svg.appendChild(e); return e; };
  if(o.titel) mk("text",{x:B/2, y:20, "text-anchor":"middle", "font-size":15, "font-weight":700}, o.titel);
  for(const v of tick(max-min, o.achse || sch*Math.max(1, Math.round((max-min)/sch/8))).map(t=>t+min)){ mk("line",{x1:L,x2:L+w,y1:y(v),y2:y(v),stroke:"#e3e9ec"}); mk("text",{x:L-6,y:y(v)+5,"text-anchor":"end","font-size":13,fill:"#555"}, String(v).replace(".",",")); }
  if(o.einheit) mk("text",{x:13, y:O+h/2, "font-size":13, fill:"#555", transform:`rotate(-90 13 ${O+h/2})`, "text-anchor":"middle"}, o.einheit);
  mk("line",{x1:L,x2:L+w,y1:O+h,y2:O+h,stroke:"#555"});
  const linie = o.modus==="linie" ? mk("polyline",{fill:"none", stroke:"var(--d1)", "stroke-width":2.5}) : null;
  if(o.ziellinie!=null) mk("line",{x1:L,x2:L+w,y1:y(o.ziellinie),y2:y(o.ziellinie),stroke:"var(--d2)","stroke-width":2,"stroke-dasharray":"6 5"});
  const bw = Math.min(60, w/n*0.6);
  const teile = werte.map((v,i)=>{
    const xm = L + w*(i+0.5)/n;
    let saeule = null, griff;
    if(o.modus==="linie") griff = mk("circle",{cx:xm, r:9, fill:"var(--warm)", stroke:"#fff", "stroke-width":2, style:"cursor:ns-resize"});
    else { saeule = mk("rect",{x:xm-bw/2, width:bw, fill:o.farbe||"var(--d1)", rx:2, style:"cursor:ns-resize"}); griff = mk("rect",{x:xm-bw/2-6, width:bw+12, height:14, rx:7, fill:"var(--warm)", style:"cursor:ns-resize"}); }
    const wt = mk("text",{x:xm, "text-anchor":"middle", "font-size":14, "font-weight":700, stroke:"#fff", "stroke-width":4, "paint-order":"stroke"});
    mk("text",{x:xm, y:O+h+21, "text-anchor":"middle", "font-size": n>8 ? 12 : 14}, o.namen[i]);
    [saeule, griff].forEach(r => r && r.addEventListener("pointerdown", e => ziehen(e, i)));
    return {saeule, griff, wt, xm};
  });
  function male(){
    werte.forEach((v,i)=>{ const t = teile[i];
      if(t.saeule){ t.saeule.setAttribute("y", y(v)); t.saeule.setAttribute("height", Math.max(0, O+h-y(v))); t.griff.setAttribute("y", y(v)-7); t.wt.setAttribute("y", y(v)-12); }
      else { t.griff.setAttribute("cy", y(v)); t.wt.setAttribute("y", y(v)-14); }
      t.wt.textContent = String(v).replace(".",","); });
    if(linie) linie.setAttribute("points", werte.map((v,i)=>`${teile[i].xm},${y(v)}`).join(" "));
    o.beiAenderung && o.beiAenderung(werte.slice());
  }
  function setze(i, v){
    if(o.gesperrt && o.gesperrt()) return;
    v = Math.round((v-min)/sch)*sch + min; v = Math.round(v*1000)/1000;
    v = Math.max(min, Math.min(max, v));
    if(o.erlaubt){ v = o.erlaubt(i, v, werte.slice()); if(v==null) return; }
    if(v === werte[i]) return;
    werte[i] = v; male();
  }
  function ziehen(e, i){
    if(o.gesperrt && o.gesperrt()) return; e.preventDefault();
    const bewege = ev => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse()); setze(i, min + (O+h-p.y)/h*(max-min)); };
    const ende = () => { window.removeEventListener("pointermove", bewege); window.removeEventListener("pointerup", ende); o.nachZiehen && o.nachZiehen(werte.slice()); };
    window.addEventListener("pointermove", bewege); window.addEventListener("pointerup", ende);
  }
  const pfeile = el("div",{class:"pfeile", style:`max-width:${B}px;padding-left:${L*100/B}%`});
  werte.forEach((_,i)=>pfeile.append(el("div",{},
    el("button",{title:"weniger", "aria-label":o.namen[i]+" weniger", onclick:()=>{ setze(i, werte[i]-sch); o.nachZiehen && o.nachZiehen(werte.slice()); }}, "▼"),
    el("button",{title:"mehr", "aria-label":o.namen[i]+" mehr", onclick:()=>{ setze(i, werte[i]+sch); o.nachZiehen && o.nachZiehen(werte.slice()); }}, "▲"))));
  const node = el("div",{class:"zieh"}, el("div",{class:"grafik", style:"margin:0"}, svg), pfeile);
  male();
  return {node, werte:()=>werte.slice(), setze:(arr)=>{ arr.forEach((v,i)=>werte[i]=v); male(); }};
}

      darum:"Hier lernst du, Boxplots zu lesen und zu zeichnen und damit Datenreihen zu vergleichen."}),

      baue(box, geschafft, u, kapId){
        const bild = el("div",{class:"grafik"});
        const ids = ["min","med","q1","q3","max"].map(k=>kapId+":entdecken-"+k);
        const male = () => { const z = {min:erledigt(ids[0])?2:null, med:erledigt(ids[1])?5:null, q1:erledigt(ids[2])?3:null, q3:erledigt(ids[3])?8:null, max:erledigt(ids[4])?12:null};
          if(Object.values(z).every(v=>v!=null)){ bild.innerHTML = svgBoxplot({von:0, bis:14, schritt:2, zeilen:[{min:2,q1:3,med:5,q3:8,max:12}]}); return; }
          bild.innerHTML = svgZahlengerade({von:0, bis:14, schritt:2, breite:500, hoehe:80, punkte:Object.entries(z).filter(([,v])=>v!=null).map(([k,v])=>({v, text:{min:"Min",med:"Median",q1:"Q₁",q3:"Q₃",max:"Max"}[k], farbe:k==="med"?"var(--warm)":"var(--d1)"}))}); };
        const nach = () => { male(); if(ids.every(erledigt)) geschafft(); };
        box.append(bild,
          baueTeil({id:ids[0], karte:43, titel:"Entdecken: Minimum", typ:"zahl", wert:2, frage:"Minimum:", lob:"Richtig!", beiAuswertung:()=>setTimeout(nach,0)}),
          baueTeil({id:ids[4], karte:43, titel:"Entdecken: Maximum", typ:"zahl", wert:12, frage:"Maximum:", lob:"Richtig!", beiAuswertung:()=>setTimeout(nach,0)}),
          baueTeil({id:ids[1], karte:43, titel:"Entdecken: Median", typ:"zahl", wert:5, frage:"Median (der 6. Wert):", lob:"Richtig! Er teilt die Rangliste in eine untere Hälfte (2, 3, 3, 4, 5) und eine obere Hälfte (6, 7, 8, 9, 12).", beiAuswertung:()=>setTimeout(nach,0)}),
          baueTeil({id:ids[2], karte:43, titel:"Entdecken: unteres Quartil", typ:"zahl", wert:3, frage:"Das <b>untere Quartil</b> ist der Median der unteren Hälfte 2, 3, 3, 4, 5:", lob:"Richtig!", beiAuswertung:()=>setTimeout(nach,0)}),
          baueTeil({id:ids[3], karte:43, titel:"Entdecken: oberes Quartil", typ:"zahl", wert:8, frage:"Das <b>obere Quartil</b> ist der Median der oberen Hälfte 6, 7, 8, 9, 12:", lob:"Richtig! Jetzt ist der Boxplot vollständig.", beiAuswertung:()=>setTimeout(nach,0)}));
        male();
      }}),

    aufgabe({karte:43, nr:2, stufe:"Basis", intro:()=>el("div",{}, el("p",{}, "Noten einer Vergleichsarbeit:"), el("div",{class:"grafik", html:svgBoxplot({von:0, bis:7, schritt:1, zeilen:[{name:"9a", min:1,q1:2,med:3,q3:4,max:5, farbe:"var(--d1)"},{name:"9b", min:2,q1:3,med:4,q3:5,max:6, farbe:"var(--d2)"}]})})), teile:[

      {k:"b", typ:"wahl", chips:true, frage:"Welche Klasse hat besser abgeschnitten?", optionen:["9a","9b"], richtig:0, loesung:"Die 9a: Alle Kennwerte sind um eine Note besser."},
      {k:"c", typ:"zahl", wert:25, einheit:"%", frage:"Mindestens wie viel Prozent der 9a haben eine 2 oder besser?", loesung:"Mindestens 25 %, weil das untere Quartil bei 2 liegt."}]}),
    aufgabe({karte:44, nr:3, stufe:"Standard", intro:"<p>Weitsprung von Karte 39, Aufgabe 2 (in m):<br>Gruppe A: 3,10; 3,40; 3,50; 3,60; 3,90<br>Gruppe B: 2,60; 3,00; 3,60; 4,00; 4,30</p>", teile:[
