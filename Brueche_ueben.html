<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brüche üben mit deinem Bruchling</title>
<style>
:root{
  --bg:#fdf6ec; --card:#ffffff; --ink:#2b2d42; --muted:#6c6f80; --line:#e6dccb;
  --ok:#2f9e5b; --bad:#d1495b; --gold:#e8b923; --tc:#2a9d8f; --tcl:#e3f4f1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.4}
button{font:inherit;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}
#app{max-width:1100px;margin:0 auto;padding:12px;min-height:100%}
.screen{display:none}
.screen.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.card{background:var(--card);border-radius:20px;box-shadow:0 3px 0 var(--line),0 6px 18px rgba(0,0,0,.06);padding:18px}
.btn{border:none;border-radius:14px;padding:12px 20px;background:var(--tc);color:#fff;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.gold{background:var(--gold);color:#3b2a00}
.btn:disabled{opacity:.45;cursor:default}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.topbar h1,.topbar h2{margin:0;font-size:1.3em;flex:1}
.coins{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 14px;font-weight:bold;box-shadow:0 2px 0 var(--line)}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#e8b923 60%,#b98a00);border:2px solid #b98a00;vertical-align:middle}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

/* Start */
.start{max-width:560px;margin:30px auto;text-align:center}
.start h1{margin:.2em 0}
.start label{display:block;text-align:left;margin:12px 0 4px;font-weight:bold}
.start input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);font-size:1.1em}
.creature-wrap{width:200px;height:200px;margin:0 auto}

/* Home */
.home{display:grid;grid-template-columns:300px 1fr;gap:14px}
@media (max-width:800px){.home{grid-template-columns:1fr}}
.petcard{text-align:center}
.petcard .creature-wrap{width:220px;height:220px}
.petname{font-size:1.3em;font-weight:bold;margin:6px 0 0}
.stage{color:var(--muted);font-size:.9em}
.xpbar{height:14px;background:#eee;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.xpbar>div{height:100%;background:linear-gradient(90deg,#8bd17c,#2f9e5b);border-radius:99px;transition:width .6s}
.small{font-size:.85em;color:var(--muted)}
.petbtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{border:none;text-align:left;background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 0 var(--line);border-top:8px solid var(--c);display:flex;flex-direction:column;gap:6px;min-height:150px}
.tile:active{transform:translateY(3px)}
.tile .ti{height:56px;display:flex;align-items:center}
.tile .ti svg{height:56px;width:auto}
.tile b{font-size:1.05em}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.15em}
.stars .off{color:#ddd}
.lvl{font-size:.8em;color:var(--muted)}

/* Practice */
.pr-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pr-head h2{margin:0;font-size:1.2em;flex:1}
.lvldots{display:inline-flex;gap:5px;align-items:center;font-size:.85em;color:var(--muted)}
.lvldots i{width:14px;height:14px;border-radius:50%;background:#ddd;display:inline-block}
.lvldots i.on{background:var(--tc)}
.pr-main{display:grid;grid-template-columns:1fr 170px;gap:14px}
@media (max-width:760px){.pr-main{grid-template-columns:1fr}.pr-side{display:none}}
.taskcard{border-top:8px solid var(--tc);min-height:380px;display:flex;flex-direction:column}
.q{font-size:1.1em}
.q p{margin:.3em 0 .6em}
.figbox{display:flex;justify-content:center;margin:8px 0}
.fig{max-width:100%;height:auto;flex:0 1 auto;display:block}
.figbox>.fig{min-width:0}
.fig .part{fill:#fff;stroke:#2b2d42;stroke-width:2}
.fig .part.on{fill:var(--tc)}
.fig.clickable .part{cursor:pointer}
.fig.clickable .part:hover{fill:var(--tcl)}
.fig.clickable .part.on:hover{fill:var(--tc)}
.fig .dot{fill:#f4a261;stroke:#b5651d;stroke-width:2}
.fig .tickhit{fill:transparent;cursor:pointer}
.fig .pt{fill:var(--tc);opacity:0}
.fig .pt.sel{opacity:1}
.fig .pt.solution{opacity:1;fill:var(--ok)}
.answer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:10px 0}
.finput{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.finput input,.ginput,.ninput{width:76px;padding:8px;font-size:1.4em;text-align:center;border-radius:12px;border:2px solid var(--line);background:#fffdf8}
.finput .fbar{width:90px;height:4px;background:var(--ink);border-radius:2px}
.finput input:disabled{background:#f1f1f1;color:var(--ink)}
.ginput{width:66px}
.ninput{width:120px}
input:focus{outline:none;border-color:var(--tc)}
.unit{font-size:1.2em}
.mc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.mc button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:1.05em;box-shadow:0 3px 0 var(--line);min-height:56px}
.mc button.wrong{border-color:var(--bad);background:#fdecee;opacity:.7}
.mc button.right{border-color:var(--ok);background:#e6f6ec}
.mc button.big{font-size:2em;font-weight:bold}
.actions{display:flex;gap:10px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:120px}
.fb{margin-top:10px;padding:12px 14px;border-radius:14px;display:none}
.fb.show{display:block;animation:fade .2s}
.fb.ok{background:#e6f6ec;border:2px solid #a8dcb9}
.fb.hint{background:#fff5d6;border:2px solid #f1d27a}
.fb.bad{background:#fdecee;border:2px solid #f2b3bc}
.fb h4{margin:0 0 4px}
.sol{margin-top:6px}
.sol ol{margin:4px 0;padding-left:22px}
.gain{font-weight:bold;color:#9a7400}
.pr-side{text-align:center}
.pr-side .creature-wrap{width:160px;height:160px}
.streak{font-size:.9em;color:var(--muted);margin-top:6px}

/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1.1}
.fr .fz{border-bottom:2px solid currentColor;padding:0 .2em}
.fr .fn{padding:0 .2em}
.mx{display:inline-flex;align-items:center;white-space:nowrap}
.bigfrac{font-size:2.6em;text-align:center;margin:6px 0}
.eqs{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .2em;line-height:1}
.eqs .lbl{font-size:.7em;color:var(--tc);font-weight:bold;min-height:1em}
.math{font-size:1.15em}

/* Shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:#fff;border-radius:16px;padding:10px;text-align:center;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:6px;align-items:center}
.item .prev{width:90px;height:90px}
.item.equipped{outline:3px solid var(--ok)}
.item .btn{padding:8px 12px;font-size:.9em;width:100%}
.shopsec h3{margin:16px 0 8px}
.shoplayout{display:grid;grid-template-columns:260px 1fr;gap:14px}
@media (max-width:760px){.shoplayout{grid-template-columns:1fr}}

/* Report */
.repstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#faf3e6;border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:2em;line-height:1.1}
.stat span{font-size:.9em;color:var(--muted)}
.reptopics{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 18px}
.reptopics div{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.repfoot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--muted);font-size:.85em;text-decoration:underline;padding:6px 0}
table.rep{border-collapse:collapse;width:100%;font-size:.92em}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:center}
table.rep th:first-child,table.rep td:first-child{text-align:left}
table.rep th{background:#faf3e6}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(30,30,50,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.mbox{background:#fff;border-radius:22px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px;text-align:center;animation:fade .2s}
.mbox h3{margin-top:0}
table.merk{border-collapse:collapse;width:100%;text-align:left;margin:8px 0 14px}
table.merk td{border:1px solid var(--line);padding:8px;vertical-align:middle}
table.merk td:first-child{width:58%}
table.merk tr:nth-child(odd) td{background:#fcf8f1}
.wobble{animation:wob 2.4s ease-in-out infinite;transform-origin:100px 180px}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(0)}}
.bounce{animation:bnc .6s}
@keyframes bnc{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="app">

<!-- START -->
<section id="s-start" class="screen">
  <div class="card start">
    <h1>Brüche üben</h1>
    <p>In diesem Ei wartet dein <b>Bruchling</b>. Er wächst, wenn du Aufgaben löst. Mit den Münzen kannst du ihn ausstatten.</p>
    <div class="creature-wrap" id="startPet"></div>
    <label for="inName">Dein Vorname</label>
    <input id="inName" maxlength="30" autocomplete="off" placeholder="z. B. Mia">
    <label for="inPet">Wie soll dein Bruchling heißen?</label>
    <input id="inPet" maxlength="20" autocomplete="off" placeholder="z. B. Krümel">
    <p id="startMsg" class="small"></p>
    <button class="btn" id="btnStart">Los geht's</button>
  </div>
</section>

<!-- HOME -->
<section id="s-home" class="screen">
  <div class="topbar">
    <h1 id="hello">Hallo!</h1>
    <span class="coins" id="coinsHome"><span class="coin"></span><span class="cval">0</span></span>
  </div>
  <div class="home">
    <div class="card petcard">
      <div class="creature-wrap" id="homePet"></div>
      <div class="petname" id="petName"></div>
      <div class="stage" id="petStage"></div>
      <div class="xpbar"><div id="xpFill" style="width:0"></div></div>
      <div class="small" id="xpText"></div>
      <div class="petbtns">
        <button class="btn gold" id="btnShop">Shop</button>
        <button class="btn sec" id="btnReport">Mein Ergebnis</button>
      </div>
      <button class="linkbtn" id="btnNames">✎ Namen ändern</button>
    </div>
    <div>
      <div class="tiles" id="tiles"></div>
    </div>
  </div>
</section>

<!-- PRACTICE -->
<section id="s-practice" class="screen">
  <div class="pr-head">
    <button class="btn sec" id="btnBack">◀ Übersicht</button>
    <h2 id="prTitle"></h2>
    <span class="lvldots" id="lvlDots"></span>
    <span class="coins" id="coinsPr"><span class="coin"></span><span class="cval">0</span></span>
  </div>
  <div class="pr-main">
    <div class="card taskcard">
      <div class="q" id="q"></div>
      <div id="ans"></div>
      <div class="fb" id="fb"></div>
      <div class="actions">
        <button class="btn sec" id="btnMerk">Merkkarte</button>
        <button class="btn" id="btnCheck">Prüfen</button>
        <button class="btn hidden" id="btnNext">Weiter ▶</button>
      </div>
    </div>
    <div class="card pr-side">
      <div class="creature-wrap" id="sidePet"></div>
      <div class="streak" id="streakInfo"></div>
    </div>
  </div>
</section>

<!-- SHOP -->
<section id="s-shop" class="screen">
  <div class="topbar">
    <button class="btn sec" id="btnShopBack">◀ Übersicht</button>
    <h2>Shop</h2>
    <span class="coins" id="coinsShop"><span class="coin"></span><span class="cval">0</span></span>
  </div>
  <div class="shoplayout">
    <div class="card petcard" style="align-self:start"><div class="creature-wrap" id="shopPet"></div><div class="small" id="shopInfo"></div></div>
    <div class="card" id="shopBody"></div>
  </div>
</section>

<!-- REPORT -->
<section id="s-report" class="screen">
  <div class="topbar">
    <button class="btn sec" id="btnRepBack">◀ Übersicht</button>
    <h2>Mein Ergebnis</h2>
  </div>
  <div class="card">
    <div id="repStats" class="repstats"></div>
    <div id="repTopics" class="reptopics"></div>
    <div class="repfoot">
      <button class="linkbtn" id="btnDownload">Datei speichern</button>
      <button class="linkbtn" id="btnReset">Neu beginnen</button>
    </div>
  </div>
</section>
</div>

<div id="modal" class="modal hidden"><div class="mbox"><div id="mcontent"></div><button class="btn" id="mclose">OK</button></div></div>

<script>
"use strict";
/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const gcd = (a,b) => b ? gcd(b, a % b) : Math.abs(a);
const range = n => Array.from({length:n}, (_,i) => i);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const F = (z,n) => `<span class="fr"><span class="fz">${z}</span><span class="fn">${n}</span></span>`;
const M = (g,z,n) => `<span class="mx">${g}${F(z,n)}</span>`;
const EQ = (lbl,pos) => pos==='top' ? `<span class="eqs"><span class="lbl">${lbl}</span>=<span class="lbl"></span></span>` : `<span class="eqs"><span class="lbl"></span>=<span class="lbl">${lbl}</span></span>`;
const coprime = (lo,hi,maxN) => { let z,n; do{ n=rnd(lo,maxN); z=rnd(1,n-1);}while(gcd(z,n)!==1); return [z,n]; };
const plain = h => String(h).replace(/<span class="fr"><span class="fz">(.*?)<\/span><span class="fn">(.*?)<\/span><\/span>/g,'$1/$2').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Themen ---------- */
const TOPICS = [
  {id:'begriffe', name:'Grundbegriffe', c:'#e76f51', cl:'#fbe5de'},
  {id:'gleich',   name:'Gleich große Teile', c:'#e09f3e', cl:'#fbefd9'},
  {id:'anteile',  name:'Anteile benennen', c:'#2a9d8f', cl:'#dcf1ee'},
  {id:'strahl',   name:'Zahlenstrahl', c:'#457b9d', cl:'#dfeaf2'},
  {id:'erweitern',name:'Erweitern und Kürzen', c:'#8e5ea2', cl:'#efe4f4'},
  {id:'gemischt', name:'Unechte Brüche und gemischte Schreibweise', c:'#d1495b', cl:'#f9e0e3'},
  {id:'mengen',   name:'Anteile von Mengen', c:'#4c956c', cl:'#e0f0e6'},
  {id:'knobel',   name:'Super-Knobelaufgaben', c:'#3d348b', cl:'#e4e1f5', special:true}
];
const BASIC = TOPICS.filter(t=>!t.special);
const TOP = Object.fromEntries(TOPICS.map(t=>[t.id,t]));

/* ---------- Merkkarten (Erklärung links, Beispiel rechts) ---------- */
const MERKF = () => ({
  begriffe:[
    ['Der <b>Nenner</b> steht unter dem Bruchstrich. Er gibt an, in wie viele gleich große Teile das Ganze geteilt wird.', `${F(3,4)} : Das Ganze ist in 4 gleich große Teile geteilt.`],
    ['Der <b>Zähler</b> steht über dem Bruchstrich. Er gibt an, wie viele dieser Teile genommen werden.', `${F(3,4)} : Es werden 3 Teile genommen.`],
    ['Bei einem <b>Stammbruch</b> ist der Zähler 1.', `${F(1,5)}, ${F(1,8)}`],
    ['Bei einem <b>echten Bruch</b> ist der Zähler kleiner als der Nenner. Der Bruch ist kleiner als ein Ganzes.', `${F(2,3)}, ${F(5,9)}`],
    ['Bei einem <b>unechten Bruch</b> ist der Zähler größer als der Nenner oder gleich groß. Der Bruch ist mindestens ein Ganzes.', `${F(7,4)}, ${F(9,2)}`]
  ],
  gleich:[
    ['Einen Bruch kannst du nur angeben, wenn das Ganze in <b>gleich große Teile</b> geteilt ist.', svgBar(4,[0],{w:160,h:36})],
    ['Sind die Teile unterschiedlich groß, beschreibt die Anzahl der Teile keinen Bruch.', svgBar(3,[0],{w:160,h:36,widths:[.2,.3,.5]})],
    ['Die Teile müssen nicht gleich aussehen. Sie müssen nur <b>gleich groß</b> sein, also die gleiche Fläche haben.', FIGS[0].svg.replace('class="fig"','class="fig" width="90"')]
  ],
  anteile:[
    ['Zähle zuerst <b>alle</b> Teile. Diese Anzahl ist der Nenner.', `${svgBar(5,[0,1,2],{w:150,h:34})}<br>5 Teile`],
    ['Zähle dann die <b>gefärbten</b> Teile. Diese Anzahl ist der Zähler.', `3 Teile gefärbt: ${F(3,5)}`],
    ['Der Anteil, der <b>nicht gefärbt</b> ist, besteht aus den übrigen Teilen.', `nicht gefärbt: ${F(2,5)}`]
  ],
  strahl:[
    ['Die Strecke von 0 bis 1 ist das <b>Ganze</b>.', svgLine(0,1,4,{marker:3/4,w:200})],
    ['Zähle, in wie viele gleich große <b>Abschnitte</b> die Strecke von 0 bis 1 geteilt ist. Das ist der Nenner.', '4 Abschnitte, also Nenner 4'],
    ['Zähle von 0 aus die Abschnitte bis zur Markierung. Das ist der Zähler. Zähle Abschnitte, keine Striche.', `3 Abschnitte: ${F(3,4)}`],
    ['Hinter der 1 geht es weiter. Dort liegen die unechten Brüche.', `${F(5,4)} liegt einen Abschnitt hinter der 1.`]
  ],
  erweitern:[
    ['<b>Erweitern</b>: Zähler und Nenner werden mit der gleichen Zahl multipliziert. Der Wert bleibt gleich, die Teile werden feiner.', `<span class="math">${F(2,3)}${EQ('·4','top')}${F(8,12)}</span>`],
    ['<b>Kürzen</b>: Zähler und Nenner werden durch die gleiche Zahl dividiert. Kürzen ist die Umkehrung des Erweiterns. Teile werden zusammengefasst.', `<span class="math">${F(12,18)}${EQ(':6','bottom')}${F(2,3)}</span>`],
    ['Ein Bruch ist <b>vollständig gekürzt</b>, wenn Zähler und Nenner keinen gemeinsamen Teiler außer 1 haben.', `${F(2,3)} ist vollständig gekürzt, ${F(4,6)} nicht.`]
  ],
  gemischt:[
    ['<b>Unechter Bruch in gemischte Schreibweise</b>: Dividiere den Zähler durch den Nenner. Das Ergebnis sind die Ganzen. Der Rest kommt in den Zähler, der Nenner bleibt.', `<span class="math">${F(11,4)}</span><br>11 : 4 = 2 Rest 3<br><span class="math">${F(11,4)} = ${M(2,3,4)}</span>`],
    ['<b>Gemischte Schreibweise in unechten Bruch</b>: Multipliziere die Ganzen mit dem Nenner und addiere den Zähler. Der Nenner bleibt.', `<span class="math">${M(2,3,4)}</span><br>2 · 4 + 3 = 11<br><span class="math">${M(2,3,4)} = ${F(11,4)}</span>`]
  ],
  knobel:[
    ['<b>Lies genau.</b> Schreibe dir auf, was gegeben ist und was gesucht ist.', 'gegeben: …<br>gesucht: …'],
    ['<b>Zeichne eine Skizze</b>, zum Beispiel einen Bruchstreifen. Teile ihn in gleich große Teile.', svgBar(6,[0,1],{w:150,h:30})],
    ['<b>Rückwärts denken</b>: Wenn du einen Teil kennst, kannst du auf das Ganze schließen.', `${F(2,5)} sind 8.<br>${F(1,5)} sind 4, das Ganze sind 20.`],
    ['<b>Gleiche Nenner</b> helfen beim Vergleichen. Erweitere die Brüche dazu.', `${F(1,4)} und ${F(2,8)}: ${F(1,4)} = ${F(2,8)}`]
  ],
  mengen:[
    ['<b>Anteil einer Menge</b>: Dividiere die Menge durch den Nenner. So erhältst du einen Teil. Multipliziere dann mit dem Zähler.', `${F(3,4)} von 20 €<br>20 € : 4 = 5 €<br>5 € · 3 = 15 €`],
    ['<b>Vom Anteil zum Ganzen</b>: Dividiere durch den Zähler. So erhältst du einen Teil. Multipliziere dann mit dem Nenner.', `${F(3,5)} sind 12 Kinder.<br>12 : 3 = 4<br>4 · 5 = 20 Kinder`]
  ]
});

function svgCircle(n, shaded, o={}){

  if(as.length===1){ return s+`<circle data-part="0" cx="${cx}" cy="${cy}" r="${r}" class="part${shaded.includes(0)?' on':''}"/></svg>`; }

    s+=`<path data-part="${i}" d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${f>0.5?1:0} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" class="part${shaded.includes(i)?' on':''}"/>`; a=b; });
  return s+'</svg>';
}
function svgGrid(rows, cols, shaded, o={}){

function svgLine(min, max, d, o={}){

function chkFrac(a, Z, N, mode){
  if(a.n===0) return {ok:false,msg:'Der Nenner darf nicht 0 sein.'};
  const eq = a.z*N === Z*a.n;
  if(mode==='exact'){
    if(a.z===Z && a.n===N) return {ok:true};
    if(eq) return {ok:false,msg:'Der Wert stimmt, aber gesucht ist genau der angegebene Bruch. Lies die Aufgabe noch einmal.'};
  } else if(mode==='lowest'){
    if(eq && gcd(a.z,a.n)===1) return {ok:true};
    if(eq) return {ok:false,msg:'Der Wert stimmt. Du kannst aber noch weiter kürzen. Suche einen gemeinsamen Teiler von Zähler und Nenner.'};
  } else { if(eq) return {ok:true}; }
  if(a.z===N && a.n===Z) return {ok:false,msg:'Hast du Zähler und Nenner vertauscht? Der Nenner steht unten.'};
  return {ok:false};
}

    (k,n,T0)=>[`In einem Fass sind ${T0} l Regenwasser. ${F(k,n)} davon werden zum Gießen im Schulgarten verwendet. Wie viele Liter sind das?`,'l'],
    (k,n,T0)=>[`Eine Solaranlage erzeugt an einem Tag ${T0} kWh Strom. ${F(k,n)} davon werden im Haus verbraucht. Wie viele kWh sind das?`,'kWh'],
    (k,n,T0)=>[`Beim Müllsammeln wurden ${T0} Flaschen gefunden. ${F(k,n)} davon sind aus Glas. Wie viele Glasflaschen sind das?`,'Flaschen'],
    (k,n,T0)=>[`Ein Beet ist ${T0} m² groß. Auf ${F(k,n)} der Fläche wachsen Kartoffeln. Wie viele m² sind das?`,'m²'],
    (k,n,T0)=>[`Aus dem Schulgarten wurden ${T0} Äpfel geerntet. ${F(k,n)} davon werden zu Saft gepresst. Wie viele Äpfel sind das?`,'Äpfel'],
    (k,n,T0)=>[`Eine Radtour ist ${T0} km lang. ${F(k,n)} der Strecke sind geschafft. Wie viele km sind das?`,'km'],
    (k,n,T0)=>[`Die Klasse hat ${T0} € mit einem Kuchenbasar eingenommen. ${F(k,n)} davon werden für Bäume gespendet. Wie viel Geld ist das?`,'€']
  ];
  const ofTask = (k,n,m) => { const T0=n*m; const [q,unit]=pick(ctxs)(k,n,T0);
    return numT(`<p>${q}</p>`, plain(q)+` [${k}/${n} von ${T0}]`, k*m, unit,
      'Teile zuerst durch den Nenner. So erhältst du einen Teil. Multipliziere dann mit dem Zähler.', `<ol><li>${F(1,n)} von ${T0}: ${T0} : ${n} = ${m}</li><li>${F(k,n)} von ${T0}: ${m} · ${k} = ${k*m}</li></ol>Ergebnis: ${k*m} ${unit}`,
      {check:v=>v===k*m?{ok:true}:{ok:false,msg:(k>1&&v===m)?`${m} ist erst ${F(1,n)}. Du brauchst ${k} solche Teile.`:(v===T0*k?'Du hast nur mit dem Zähler multipliziert. Teile auch durch den Nenner.':null)}}); };
  if(L===2){ const n=rnd(2,8), k=rnd(1,n-1), m=rnd(2,12); return ofTask(k,n,m); }
  const v=rnd(0,2);
  if(v===0){ const U=pick([{g:'1 h',val:60,u:'min',d:[2,3,4,5,6,10,12]},{g:'1 kg',val:1000,u:'g',d:[2,4,5,8,10]},{g:'1 m',val:100,u:'cm',d:[2,4,5,10,20]},{g:'1 Tag',val:24,u:'h',d:[2,3,4,6,8,12]},{g:'1 €',val:100,u:'ct',d:[2,4,5,10,20]}]);
    const n=pick(U.d), k=rnd(1,n-1), one=U.val/n;
    return numT(`<p>Wie viel sind ${F(k,n)} von ${U.g}? Gib das Ergebnis in ${U.u} an.</p>`, `${k}/${n} von ${U.g} in ${U.u}`, k*one, U.u,
      `Rechne zuerst ${U.g} in ${U.u} um.`, `<ol><li>${U.g} = ${U.val} ${U.u}</li><li>${U.val} : ${n} = ${one}</li><li>${one} · ${k} = ${k*one}</li></ol>Ergebnis: ${k*one} ${U.u}`); }
  if(v===1){ const n=rnd(2,8), k=rnd(1,n-1), m=rnd(2,8), P=k*m, W=n*m;
    const c=pick([[`${F(k,n)} der Lernenden einer Klasse fahren mit dem Bus. Das sind ${P} Lernende. Wie viele Lernende sind in der Klasse?`,'Lernende'],
      [`${F(k,n)} einer Wanderung sind ${P} km. Wie lang ist die ganze Wanderung?`,'km'],
      [`${F(k,n)} des Sparziels sind ${P} €. Wie hoch ist das ganze Sparziel?`,'€'],
      [`Auf ${F(k,n)} eines Feldes wächst Mais. Das sind ${P} m². Wie groß ist das ganze Feld?`,'m²']]);
    return numT(`<p>${c[0]}</p>`, plain(c[0])+` [${k}/${n} sind ${P}]`, W, c[1],
      `Teile durch den Zähler. So weißt du, wie viel ${F(1,n)} ist. Multipliziere dann mit dem Nenner.`, `<ol><li>${F(k,n)} sind ${P}, also ist ${F(1,n)}: ${P} : ${k} = ${m}</li><li>Das Ganze sind ${F(n,n)}: ${m} · ${n} = ${W}</li></ol>Ergebnis: ${W} ${c[1]}`); }
  const n=rnd(3,9), k=rnd(2,n-1), m=rnd(5,25); return ofTask(k,n,m);
}
};

function setTopicColor(tid){ const t=TOP[tid]; const el=$('#s-practice'); el.style.setProperty('--tc',t.c); el.style.setProperty('--tcl',t.cl); }
function nextTask(){
  const tid = mode==='mix' ? pick(BASIC).id : mode; const tp=S.topics[tid];
  let task, tries=0; do{ task=GEN[tid](tp.level); tries++; }while(task.text===lastText && tries<8);
  lastText=task.text;
  cur={tid, task, attempts:0, answers:[], t0:Date.now(), done:false, sel:new Set(), tick:null};
  setTopicColor(tid);
  $('#prTitle').textContent = (mode==='mix'?'Bunte Mischung · ':'') + TOP[tid].name;
  $('#lvlDots').innerHTML = 'Stufe ' + [1,2,3].map(i=>`<i class="${i<=tp.level?'on':''}"></i>`).join('');
  $('#q').innerHTML = task.q;
  const A=$('#ans'); A.innerHTML='';
  if(task.type==='frac'){ const fz=task.fixed&&task.fixed.z!=null, fn=task.fixed&&task.fixed.n!=null;
    A.innerHTML=`<div class="answer"><span>Dein Ergebnis:</span><span class="finput"><input id="iz" inputmode="numeric" ${fz?`value="${task.fixed.z}" disabled`:''} aria-label="Zähler"><span class="fbar"></span><input id="in" inputmode="numeric" ${fn?`value="${task.fixed.n}" disabled`:''} aria-label="Nenner"></span></div>`; }
  else if(task.type==='mixed') A.innerHTML=`<div class="answer"><span>Dein Ergebnis:</span><input id="ig" class="ginput" inputmode="numeric" aria-label="Ganze"><span class="finput"><input id="iz" inputmode="numeric" aria-label="Zähler"><span class="fbar"></span><input id="in" inputmode="numeric" aria-label="Nenner"></span></div>`;
  else if(task.type==='num') A.innerHTML=`<div class="answer"><span>Ergebnis:</span><input id="iv" class="ninput" inputmode="decimal" aria-label="Ergebnis"><span class="unit">${task.unit||''}</span></div>`;
  else if(task.type==='mc'){ A.innerHTML=`<div class="mc">${task.options.map((o,i)=>`<button data-i="${i}" class="${task.big?'big':''}">${o}</button>`).join('')}</div>`;
    A.querySelectorAll('.mc button').forEach(b=>b.onclick=()=>answerMC(+b.dataset.i,b)); }
  if(task.type==='click'){ document.querySelectorAll('#clickfig [data-part]').forEach(p=>p.onclick=()=>{ if(cur.done) return; const i=+p.dataset.part; if(cur.sel.has(i)){cur.sel.delete(i);p.classList.remove('on');}else{cur.sel.add(i);p.classList.add('on');} }); }
  if(task.type==='line'){ document.querySelectorAll('#linefig [data-tick]').forEach(h=>h.onclick=()=>{ if(cur.done) return; cur.tick=+h.dataset.tick; document.querySelectorAll('#linefig .pt').forEach(p=>p.classList.toggle('sel',+p.dataset.pt===cur.tick)); }); }
  $('#btnCheck').classList.toggle('hidden', task.type==='mc'); $('#btnCheck').disabled=false;
  $('#btnNext').classList.add('hidden');
  const fb=$('#fb'); fb.className='fb'; fb.innerHTML='';
  A.querySelectorAll('input').forEach(inp=>inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); }));
  const first=A.querySelector('input:not([disabled])'); if(first && window.matchMedia('(pointer:fine)').matches) first.focus();
  $('#streakInfo').textContent = S.streak>=2 ? `${S.streak} richtig in Folge!` : 'Löse Aufgaben, damit ich wachse!';
  $('#sidePet').innerHTML=creatureSVG({mood:'think'});
  updCoins();
}
const toInt = v => { v=String(v).trim(); return /^\d+$/.test(v)?parseInt(v,10):null; };
function readAnswer(){
  const t=cur.task.type;
  if(t==='frac'){ const z=toInt($('#iz').value), n=toInt($('#in').value); if(z===null||n===null) return null; return {z,n,str:`${z}/${n}`}; }
  if(t==='mixed'){ const g=toInt($('#ig').value), z=toInt($('#iz').value), n=toInt($('#in').value); if(g===null||z===null||n===null) return null; return {g,z,n,str:`${g} ${z}/${n}`}; }
  if(t==='num'){ const raw=$('#iv').value.trim().replace(',','.'); if(raw===''||isNaN(+raw)) return null; return {v:+raw,str:raw.replace('.',',')+(cur.task.unit?' '+cur.task.unit:'')}; }
  if(t==='click'){ if(cur.sel.size===0) return null; return {sel:cur.sel,str:`${cur.sel.size} Teile gefärbt`}; }
  if(t==='line'){ if(cur.tick===null) return null; return {tick:cur.tick,str:''}; }
}
function check(){
  if(!cur||cur.done) return; const t=cur.task; const a=readAnswer(); const fb=$('#fb');
  if(!a){ fb.className='fb hint show'; fb.innerHTML= t.type==='click'?'Tippe zuerst Teile an.': t.type==='line'?'Tippe zuerst auf eine Stelle am Zahlenstrahl.':(t.type==='mixed'?'Fülle alle drei Felder aus. Schreibe nur ganze Zahlen.':'Trage zuerst eine Zahl in jedes Feld ein.'); return; }
  if(t.type==='line') a.str=`Stelle ${a.tick} (Unterteilung ${t.lineSteps})`;
  let r; if(t.type==='click') r=t.check(a.sel); else if(t.type==='line') r=t.check(a.tick); else if(t.type==='num') r=t.check(a.v); else r=t.check(a);
  attempt(r,a.str);
}
function answerMC(i,btn){ if(!cur||cur.done) return; const t=cur.task; const ok=i===t.correct;
  if(ok) btn.classList.add('right'); else { btn.classList.add('wrong'); btn.disabled=true; }
  attempt({ok}, plain(t.options[i]));
}
function attempt(r,str){
  const t=cur.task, fb=$('#fb'); cur.attempts++; cur.answers.push(str); S.topics[cur.tid].attempts++;
  if(r.ok){ finish(cur.attempts===1?'1':'2'); return; }
  if(cur.attempts<t.max){ fb.className='fb hint show'; fb.innerHTML=`<h4>Noch nicht ganz. Versuche es noch einmal.</h4>${r.msg||t.hint||''}`; $('#sidePet').innerHTML=creatureSVG({mood:'think'}); return; }
  finish('x', r.msg);
}
function finish(res,msg){
  cur.done=true; const tp=S.topics[cur.tid], t=cur.task, L=tp.level, fb=$('#fb');
  tp.tasks++; tp.time += Math.min(Date.now()-cur.t0, 300000);
  let gain=0, extra='';
  if(res==='1'){ tp.first++; gain=L+1; tp.streak++; tp.wrong=0; S.streak++; if(L===3) tp.l3first++; }
  else if(res==='2'){ tp.second++; gain=1; tp.streak=0; tp.wrong=0; S.streak=0; }
  else { tp.failed++; tp.streak=0; tp.wrong++; S.streak=0; }
  S.bestStreak=Math.max(S.bestStreak,S.streak);
  if(res==='1' && S.streak>0 && S.streak%5===0){ gain+=5; extra=`<br><span class="gain">Bonus: ${S.streak} richtig in Folge, +5 Münzen!</span>`; }
  const oldStage=stageOf(S.xp); S.coins+=gain; S.xp+=gain; const newStage=stageOf(S.xp);
  S.log.push({t:Date.now(),topic:cur.tid,level:L,q:t.text,a:cur.answers.slice(),r:res});
  if(S.log.length>600) S.log=S.log.slice(-600);
  let lvlMsg='';
  if(tp.streak>=3 && tp.level<3){ tp.level++; tp.streak=0; tp.maxLevel=Math.max(tp.maxLevel,tp.level); lvlMsg=`<br><b>Stufe ${tp.level} freigeschaltet!</b> Die nächsten Aufgaben werden kniffliger.`; }
  if(tp.wrong>=2 && tp.level>1){ tp.level--; tp.wrong=0; lvlMsg=`<br>Wir üben jetzt ein paar Aufgaben auf Stufe ${tp.level}. Danach geht es wieder hoch.`; }
  save();
  if(res==='x'){ fb.className='fb bad show'; fb.innerHTML=`<h4>Diesmal leider nicht richtig.</h4>${msg?msg+'<br>':''}<div class="sol"><b>So geht es:</b><br>${t.sol}</div>${lvlMsg}`;
    if(t.type==='mc'){ const b=document.querySelectorAll('.mc button')[t.correct]; if(b) b.classList.add('right'); }
    if(t.type==='line'){ const p=document.querySelector(`#linefig .pt[data-pt="${t.target}"]`); if(p) p.classList.add('solution'); }
    $('#sidePet').innerHTML=creatureSVG({mood:'think'}); }
  else { fb.className='fb ok show'; fb.innerHTML=`<h4>${pick(res==='1'?['Richtig!','Super!','Klasse gemacht!','Genau so!','Stark!']:['Richtig, im zweiten Versuch!','Gut, dass du es nochmal probiert hast!'])}</h4><span class="gain">+${gain} <span class="coin"></span></span>${extra}${lvlMsg}${res==='2'?`<div class="sol small">${t.sol}</div>`:''}`;
    const sp=$('#sidePet'); sp.innerHTML=creatureSVG({mood:'joy'}); sp.classList.remove('bounce'); void sp.offsetWidth; sp.classList.add('bounce'); updCoins(true); }
  document.querySelectorAll('#ans input').forEach(i=>i.disabled=true);
  document.querySelectorAll('.mc button').forEach(b=>b.disabled=true);
  $('#btnCheck').classList.add('hidden'); $('#btnNext').classList.remove('hidden');
  $('#streakInfo').textContent = S.streak>=2 ? `${S.streak} richtig in Folge!` : '';
  if(newStage>oldStage){ confetti(); setTimeout(()=>modal(`<h3>${oldStage===0?'Dein Ei ist geschlüpft!':S.pet+' ist gewachsen!'}</h3><div class="creature-wrap">${creatureSVG({mood:'joy'})}</div><p><b>${STAGES[newStage].name}</b></p>${oldStage===0?'<p>Jetzt kannst du im Shop Zubehör für deinen Bruchling kaufen.</p>':''}`),500); }
}
$('#btnCheck').onclick=check;
$('#btnNext').onclick=nextTask;
$('#btnBack').onclick=()=>{ show('home'); renderHome(); };
$('#btnMerk').onclick=()=>{ const tid=cur?cur.tid:'begriffe'; modal(`<h3>Merkkarte: ${TOP[tid].name}</h3><table class="merk">${MERKF()[tid].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`); };

/* ---------- Shop ---------- */
function renderShop(){
  const st=stageOf(S.xp); updCoins();
  $('#shopPet').innerHTML=creatureSVG({mood:'happy'});
  $('#shopInfo').textContent = st===0 ? 'Zubehör gibt es erst, wenn dein Ei geschlüpft ist. Farben und Hintergründe kannst du schon kaufen.' : 'Tippe auf ein gekauftes Teil, um es an- oder abzulegen.';
  const card=(key,name,price,preview,owned,equipped,locked)=>`<div class="item${equipped?' equipped':''}"><div class="prev">${preview}</div><b>${name}</b>${owned?`<button class="btn ${equipped?'sec':''}" data-act="use" data-key="${key}">${equipped?'Ablegen':'Anlegen'}</button>`:`<button class="btn gold" data-act="buy" data-key="${key}" ${(S.coins<price||locked)?'disabled':''}>${locked?'nach dem Schlüpfen':price+' Münzen'}</button>`}</div>`;
  let h='<div class="shopsec"><h3>Farbe</h3><div class="shopgrid">';
  Object.entries(COLORS).forEach(([k,c])=>{ h+=card('c:'+k,c.name,c.p,creatureSVG({color:k,stage:Math.max(1,st),equip:{},bg:S.bg,mood:'happy'}),S.owned.includes(k),S.color===k,false).replace('>Ablegen<','>Gewählt<'); });
  h+='</div></div><div class="shopsec"><h3>Zubehör</h3><div class="shopgrid">';
  Object.entries(ITEMS).forEach(([k,it])=>{ const eq={head:null,eyes:null,neck:null}; eq[it.slot]=k; h+=card('i:'+k,it.name,it.p,creatureSVG({stage:Math.max(2,st),equip:eq,mood:'happy'}),S.owned.includes(k),S.equip[it.slot]===k,st===0); });
  h+='</div></div><div class="shopsec"><h3>Hintergrund</h3><div class="shopgrid">';
  Object.entries(BGS).forEach(([k,b])=>{ h+=card('b:'+k,b.name,b.p,creatureSVG({bg:k,mood:'happy'}),S.owned.includes(k),S.bg===k,false).replace('>Ablegen<','>Gewählt<'); });
  h+='</div></div>';
  $('#shopBody').innerHTML=h;
  document.querySelectorAll('#shopBody [data-act]').forEach(b=>b.onclick=()=>shopAct(b.dataset.act,b.dataset.key));
}
function shopAct(act,key){
  const [type,k]=key.split(':'); const price = type==='c'?COLORS[k].p : type==='i'?ITEMS[k].p : BGS[k].p;
  if(act==='buy'){ if(S.coins<price) return; S.coins-=price; S.owned.push(k); }
  if(type==='c') S.color=k;
  if(type==='b') S.bg=k;
  if(type==='i'){ const sl=ITEMS[k].slot; S.equip[sl] = (act==='use' && S.equip[sl]===k) ? null : k; }
  save(); renderShop();
}
$('#btnShop').onclick=()=>{ show('shop'); renderShop(); };
$('#btnShopBack').onclick=()=>{ show('home'); renderHome(); };

/* ---------- Rückmeldung ---------- */
const fmtMin = ms => Math.round(ms/60000)+' min';
const fmtDate = t => { const d=new Date(t), p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; };
function totals(){ const o={tasks:0,first:0,second:0,failed:0,attempts:0,time:0}; TOPICS.forEach(t=>{const s=S.topics[t.id]; for(const k in o) o[k]+=s[k];}); return o; }
function renderReport(){
  const tt=totals(), sum=TOPICS.reduce((a,t)=>a+stars(t.id),0), ok=tt.first+tt.second;
  $('#repStats').innerHTML=`<div class="stat"><b>${tt.tasks}</b><span>Aufgaben bearbeitet</span></div><div class="stat"><b>${ok}</b><span>davon richtig gelöst</span></div><div class="stat"><b style="color:var(--gold)">${sum} ★</b><span>von ${TOPICS.length*3} Sternen</span></div>`;
  $('#repTopics').innerHTML=TOPICS.map(t=>`<div><span>${t.name}</span><span class="stars">${'★'.repeat(stars(t.id))}<span class="off">${'★'.repeat(3-stars(t.id))}</span></span></div>`).join('');
}
function reportText(){
  const tt=totals(), pad=(s,n)=>String(s).padEnd(n), lp=(s,n)=>String(s).padStart(n);
  const L=[];
  L.push('RÜCKMELDUNG: BRÜCHE ÜBEN'); L.push('='.repeat(60));
  L.push(`Name:                ${S.name}`);
  L.push(`Erstellt am:         ${fmtDate(Date.now())}`);
  L.push(`Begonnen am:         ${fmtDate(S.started)}`);
  L.push(`Bruchling:           ${S.pet} (${STAGES[stageOf(S.xp)].name}, ${S.xp} Punkte)`);
  L.push(`Übungszeit gesamt:   ${fmtMin(tt.time)}`);
  L.push(`Aufgaben gesamt:     ${tt.tasks}`);
  L.push(`  1. Versuch richtig: ${tt.first}${tt.tasks?` (${Math.round(tt.first/tt.tasks*100)} %)`:''}`);
  L.push(`  2. Versuch richtig: ${tt.second}`);
  L.push(`  nicht gelöst:       ${tt.failed}`);
  L.push(`Eingaben gesamt:     ${tt.attempts}`);
  L.push(`Längste Serie:       ${S.bestStreak} richtig in Folge`);
  L.push(''); L.push('NACH BEREICHEN'); L.push('-'.repeat(60));
  L.push(pad('Bereich',26)+lp('Aufg.',6)+lp('1.V.',6)+lp('2.V.',6)+lp('falsch',7)+lp('Stufe',6)+lp('max',5)+lp('Zeit',8));
  TOPICS.forEach(t=>{ const s=S.topics[t.id]; const nm=t.id==='gemischt'?'Unecht/gemischt':t.name; L.push(pad(nm.slice(0,25),26)+lp(s.tasks,6)+lp(s.first,6)+lp(s.second,6)+lp(s.failed,7)+lp(s.level,6)+lp(s.maxLevel,5)+lp(fmtMin(s.time),8)); });
  L.push(''); L.push('Stufe = aktuelle Schwierigkeitsstufe (1 bis 3), max = höchste erreichte Stufe');
  L.push(''); L.push('AUFGABENPROTOKOLL (neueste zuletzt)'); L.push('-'.repeat(60));
  L.push('Ergebnis: R1 = beim 1. Versuch richtig, R2 = beim 2. Versuch richtig, X = nicht gelöst');
  S.log.forEach(e=>{ L.push(`${fmtDate(e.t)} | ${TOP[e.topic].name} | Stufe ${e.level} | ${e.r==='1'?'R1':e.r==='2'?'R2':'X '} | ${e.q} | Eingaben: ${e.a.join(' ; ')}`); });
  return L.join('\r\n');
}
function download(){
  const txt=reportText(); const safe=(S.name||'Name').replace(/[^A-Za-zÄÖÜäöüß0-9_-]+/g,'_');
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const fn=`Rueckmeldung_Brueche_${safe}_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.txt`;
  try{ const blob=new Blob(['﻿'+txt],{type:'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=fn; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
    modal(`<h3>Datei wird gespeichert</h3><p>Die Datei heißt<br><b>${esc(fn)}</b></p><p>Sie liegt meist im Ordner „Downloads“.</p>`); }
  catch(e){ modal(`<h3>Speichern hat nicht geklappt</h3><p>Zeige diesen Bildschirm deiner Pädagogin.</p>`); }
}
$('#btnNames').onclick=()=>{ modal(`<h3>Namen ändern</h3><div class="start" style="margin:0 auto"><label for="edName">Dein Vorname</label><input id="edName" maxlength="30" autocomplete="off" value="${esc(S.name)}"><label for="edPet">Name deines Bruchlings</label><input id="edPet" maxlength="20" autocomplete="off" value="${esc(S.pet)}"><p class="small" id="edMsg"></p></div>`);
  const old=$('#mclose').onclick; $('#mclose').textContent='Speichern';
  $('#mclose').onclick=()=>{ const n=$('#edName').value.trim(), pt=$('#edPet').value.trim(); if(!n){ $('#edMsg').textContent='Bitte trage deinen Vornamen ein.'; return; }
    S.name=n; S.pet=pt||S.pet; save(); $('#mclose').textContent='OK'; $('#mclose').onclick=old; $('#modal').classList.add('hidden'); renderHome(); }; };
$('#btnReport').onclick=()=>{ show('report'); renderReport(); };
$('#btnRepBack').onclick=()=>{ show('home'); renderHome(); };
$('#btnDownload').onclick=download;
$('#btnReset').onclick=()=>{ if(confirm('Willst du wirklich neu beginnen? Münzen, Bruchling und alle Ergebnisse werden gelöscht. Lade vorher deine Rückmeldung herunter.')){ S=freshState(); save(); initStart(); } };

/* ---------- Start ---------- */
function initStart(){ show('start'); $('#startPet').innerHTML=creatureSVG({stage:0}); $('#inName').value=S.name||''; $('#inPet').value=S.pet||''; }
$('#btnStart').onclick=()=>{ const n=$('#inName').value.trim(); if(!n){ $('#startMsg').textContent='Bitte trage deinen Vornamen ein.'; return; }
  S.name=n; S.pet=$('#inPet').value.trim()||'Krümel'; S.started=Date.now(); save(); show('home'); renderHome(); };

load();
if(S.name){ show('home'); renderHome(); } else initStart();
</script>
